name: PR Checks

# The checks a worker runs by hand before a pull request, run on the pull
# request itself (architecture review 2026-09-21, findings Q-1 and Q-2).
# Nothing here needs a database, a secret or a running server: the integration
# specs and the browser runs stay on the development machine.

# The first run on a pull request (run 35558214895, 2026-09-21) was refused
# before any step: "The job was not started because an Actions budget is
# preventing further use". The pull_request trigger was disabled to avoid
# every PR to dev carrying three red checks that said nothing about its code
# (audit D-02, t-2026-09-24-n2). Trigger restored below on Ivan's instruction;
# if the budget is still exhausted the next PR's checks will fail the same
# way — that failure now at least reflects the repo's actual Actions quota,
# not a config bug. workflow_dispatch stays for a manual re-run without a new
# commit.

# A push to dev runs the same checks on the merged commit itself (t-2026-10-12-30): the release agent on
# each host (deploy/auto/release-agent.sh) releases the newest dev commit whose jobs below are all green.
# A pull request was checked against the dev of its own time, so after five merges in a row the commit
# that reaches dev was never checked as it is.
# A pull request into templates/** (template and block work, AGENTS.md «`templates/*` Branches») runs Storefront
# and, from templates-guard.yml, Templates Guard. Template Scope reads what it changes, and Backend, Panel And
# Repository and Deploy Checks run only when it touches what they check (t-2026-10-12-33). All jobs share one
# self-hosted runner on the INTL production host, Backend alone takes about 23 minutes, and up to seven lines open
# template pull requests at night. The dev releases must not wait behind them (t-2026-10-12-30 measured 164 minutes).
on:
  pull_request:
    branches: [ dev, 'templates/**' ]
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

# The single self-hosted runner takes one job at a time, and not in the order the jobs were queued. On
# 12.10.2026 the checks of dev 67430df1 ran 44 minutes for 34 minutes of their own jobs: three dependabot
# pull requests, rebased by dependabot right after the merge, slipped their jobs in between until the lead
# cancelled them. All dependabot runs now share one group: one runs, the newest waits, an older waiting one
# is dropped, so at most one dependabot run spends minutes at a time. (.github/dependabot.yml no longer
# rebases its pull requests on every move of dev, which is what started all three at once.)
# The lead merges in bursts (five pull requests within 61 seconds on 12.10): a push to dev cancels the run
# of the push before it, so the last commit of a burst is checked at once and released.
concurrency:
  group: ${{ startsWith(github.head_ref, 'dependabot/') && 'pr-checks-dependabot' || format('pr-checks-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.head_ref, 'dependabot/') }}

# The jobs of a dependabot pull request run on GitHub's own runner, never on the self-hosted one
# (t-2026-10-12-30, point 11): from 05.10 to 12.10 they held it 429 of its 2432 busy minutes, and on 09.10
# the checks of a pull request waited 164 minutes behind them. Every other run (a push to dev, the pull
# requests of people and agents, a run by hand) stays on [self-hosted, upready-store]. A re-run keeps the
# actor of the first run, so a dependabot run re-run by anyone stays on GitHub's runner. When GitHub refuses
# the job (the Actions budget, as on 21.09), the job fails before its first step and costs the runner
# nothing; the lead then checks that pull request right before merging it with a run by hand on its branch
# (`gh workflow run pr-checks.yml --ref <branch>`), which is not dependabot's and runs here.
# deploy/auto/__tests__/pr-checks-runner.test.mjs checks that every job carries this choice.
jobs:
  # Runs only on a pull request into templates/**. The merge commit's first parent is the base tip, so the diff
  # against it is what the pull request changes. Elsewhere the job is skipped and every job below runs. When
  # the job fails, its outputs are empty and the jobs below run too.
  scope:
    name: Template Scope
    if: ${{ startsWith(github.base_ref, 'templates/') }}
    runs-on: ${{ (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted", "upready-store"]') }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      panel: ${{ steps.scope.outputs.panel }}
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Changed paths
        id: scope
        shell: bash
        run: git diff --name-only HEAD^1 HEAD | node .github/scripts/templates-guard.mjs --scope >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: scope
    if: ${{ !cancelled() && (!startsWith(github.base_ref, 'templates/') || needs.scope.outputs.backend != 'false') }}
    runs-on: ${{ (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted", "upready-store"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/backend
        run: npx tsc --noEmit
      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: apps/backend
        run: npx medusa lint
      - name: Unit suites
        if: ${{ !cancelled() }}
        working-directory: apps/backend
        run: pnpm run test:unit
      - name: Production build
        if: ${{ !cancelled() }}
        run: pnpm check:backend-build
      - name: Fixtures typecheck
        if: ${{ !cancelled() }}
        run: pnpm check:backend-fixtures

  storefront:
    name: Storefront
    runs-on: ${{ (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted", "upready-store"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/storefront
        run: npx tsc --noEmit
      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: apps/storefront
        run: npx next lint
      - name: Unit suites
        if: ${{ !cancelled() }}
        working-directory: apps/storefront
        run: pnpm run test:unit

  panel-and-repository:
    name: Panel And Repository
    needs: scope
    if: ${{ !cancelled() && (!startsWith(github.base_ref, 'templates/') || needs.scope.outputs.panel != 'false') }}
    runs-on: ${{ (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted", "upready-store"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Panel typecheck
        working-directory: apps/tenant-panel
        run: pnpm run typecheck
      - name: Panel lint
        if: ${{ !cancelled() }}
        working-directory: apps/tenant-panel
        run: pnpm run lint
      - name: Panel tests
        if: ${{ !cancelled() }}
        working-directory: apps/tenant-panel
        run: pnpm run test
      - name: Locale catalogs
        if: ${{ !cancelled() }}
        run: pnpm check:locale-catalogs
      - name: Shared markdown
        if: ${{ !cancelled() }}
        run: pnpm check:shared-markdown
      # Lists the owner guide frames the change made stale (docs/owner-guide).
      # Refreshing them needs a stand, so the step reports and never fails.
      - name: Owner guide
        if: ${{ !cancelled() }}
        run: pnpm check:owner-guide --warn
      # apps/school installs on its own, from its own lockfile: the root
      # workspace excludes it (t-2026-10-08-37).
      - name: School install
        if: ${{ !cancelled() }}
        working-directory: apps/school
        run: pnpm install --frozen-lockfile
      - name: School typecheck
        if: ${{ !cancelled() }}
        working-directory: apps/school
        run: pnpm run typecheck
      - name: School lint
        if: ${{ !cancelled() }}
        working-directory: apps/school
        run: pnpm run lint
      - name: School tests
        if: ${{ !cancelled() }}
        working-directory: apps/school
        run: pnpm run test
      - name: School build
        if: ${{ !cancelled() }}
        working-directory: apps/school
        run: pnpm run build
      # A screenshot from a stand on a copy of live data shows real buyers
      # (t-2026-10-03-59). The checkout is one shallow merge commit, so the
      # base tip is fetched to see what the pull request adds or changes.
      - name: Evidence screenshots
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node --test scripts/__tests__/check-evidence-manifest.test.mjs
          EVIDENCE_BASE=FETCH_HEAD pnpm check:evidence

  deploy-checks:
    name: Deploy Checks
    needs: scope
    if: ${{ !cancelled() && (!startsWith(github.base_ref, 'templates/') || needs.scope.outputs.deploy != 'false') }}
    runs-on: ${{ (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted", "upready-store"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: instance-check unit tests
        run: node --test deploy/scripts/__tests__/*.test.mjs
      - name: release agent tests
        if: ${{ !cancelled() }}
        run: node --test deploy/auto/__tests__/*.test.mjs
      # The tool itself, once per profile, on the env templates this
      # repository ships. It needs no secret and no database, and it fails
      # when a profile loses a field a check reads or a template gains a
      # service or a backup target its instance forbids.
      - name: instance-check on the RU profile
        if: ${{ !cancelled() }}
        run: node deploy/scripts/instance-check.mjs --instance ru --env deploy/mt/ru.env.example --backup-env deploy/backup/nightly.env.example
      - name: instance-check on the INTL profile
        if: ${{ !cancelled() }}
        run: node deploy/scripts/instance-check.mjs --instance intl --env deploy/mt/shipshift.env.example --backup-env deploy/backup/nightly.env.example
