name: PR Checks

# The checks a worker runs by hand before a pull request, run on the pull
# request itself (architecture review 2026-09-21, findings Q-1 and Q-2).
# Nothing here needs a database, a secret or a running server: the integration
# specs and the browser runs stay on the development machine.

# The first run on a pull request (run 35558214895, 2026-09-21) was refused
# before any step: "The job was not started because an Actions budget is
# preventing further use". The pull_request trigger was disabled to avoid
# every PR to dev carrying three red checks that said nothing about its code
# (audit D-02, t-2026-09-24-n2). Trigger restored below on Ivan's instruction;
# if the budget is still exhausted the next PR's checks will fail the same
# way — that failure now at least reflects the repo's actual Actions quota,
# not a config bug. workflow_dispatch stays for a manual re-run without a new
# commit.

on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: [self-hosted, upready-store]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/backend
        run: npx tsc --noEmit
      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: apps/backend
        run: npx medusa lint
      - name: Unit suites
        if: ${{ !cancelled() }}
        working-directory: apps/backend
        run: pnpm run test:unit
      - name: Production build
        if: ${{ !cancelled() }}
        run: pnpm check:backend-build
      - name: Fixtures typecheck
        if: ${{ !cancelled() }}
        run: pnpm check:backend-fixtures

  storefront:
    name: Storefront
    runs-on: [self-hosted, upready-store]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/storefront
        run: npx tsc --noEmit
      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: apps/storefront
        run: npx next lint
      - name: Unit suites
        if: ${{ !cancelled() }}
        working-directory: apps/storefront
        run: pnpm run test:unit

  panel-and-repository:
    name: Panel And Repository
    runs-on: [self-hosted, upready-store]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Panel typecheck
        working-directory: apps/tenant-panel
        run: pnpm run typecheck
      - name: Panel lint
        if: ${{ !cancelled() }}
        working-directory: apps/tenant-panel
        run: pnpm run lint
      - name: Panel tests
        if: ${{ !cancelled() }}
        working-directory: apps/tenant-panel
        run: pnpm run test
      - name: Locale catalogs
        if: ${{ !cancelled() }}
        run: pnpm check:locale-catalogs
      - name: Shared markdown
        if: ${{ !cancelled() }}
        run: pnpm check:shared-markdown
      # A screenshot from a stand on a copy of live data shows real buyers
      # (t-2026-10-03-59). The checkout is one shallow merge commit, so the
      # base tip is fetched to see what the pull request adds or changes.
      - name: Evidence screenshots
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node --test scripts/__tests__/check-evidence-manifest.test.mjs
          EVIDENCE_BASE=FETCH_HEAD pnpm check:evidence

  deploy-checks:
    name: Deploy Checks
    runs-on: [self-hosted, upready-store]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: instance-check unit tests
        run: node --test deploy/scripts/__tests__/*.test.mjs
