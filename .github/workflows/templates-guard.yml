name: Templates Guard

# Ivan, 12.10.2026: «всё что касается шаблонов должно быть в отдельной ветке, и оно не должно попадать в ветку,
# которая идет на деплой». Template and block work lives on templates/main and templates/<slug> (AGENTS.md,
# «`templates/*` Branches»). This check goes red on a pull request that brings a templates/* branch into dev or
# main without the label ivan-ok, which only Ivan sets (t-2026-10-12-33). The rule and its test live in
# .github/scripts/templates-guard.mjs.
#
# It is a workflow of its own, not a job of pr-checks.yml, so that adding or removing a label runs this check
# alone. A labeled run of pr-checks.yml would add Backend, Panel And Repository and Deploy Checks as skipped checks
# on the same head commit, next to the real ones. `edited` runs the guard again when the base branch changes.
#
# Each run reads the pull request's base and labels from the API when it starts (`--pr`), not from the event, so a
# run that starts late judges the pull request as it is, and a rerun of a red run turns green once Ivan has set
# ivan-ok. There is no concurrency group on purpose. A run that a newer one cancels stays on the head commit as a
# cancelled check, and a cancelled check reads as a failure (seen on PR #349).
#
# GitHub Free has no branch protection here (t-2026-10-12-25), so a red guard does not disable the merge button.
# The workflow and the script run from the pull request's own merge commit, so a pull request that edits them can
# turn the check green. The lead's read of the diff covers that.
on:
  pull_request:
    branches: [ dev, main, 'templates/**' ]
    types: [ opened, synchronize, reopened, edited, labeled, unlabeled ]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Templates Guard
    # A dependabot pull request runs it on GitHub's runner, as every job of pr-checks.yml (t-2026-10-12-30, point 11).
    runs-on: ${{ (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted", "upready-store"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Guard tests
        run: node --test .github/scripts/__tests__/templates-guard.test.mjs
      - name: Verdict
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/templates-guard.mjs --base "$BASE_REF" --head "$HEAD_REF" --labels "$LABELS" --pr "$PR"
