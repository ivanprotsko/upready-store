# The multi-tenant stack: ONE Postgres, ONE Medusa backend, ONE storefront
# process serving every tenant by `Host`, and the tenant panel behind nginx.
#
#   docker compose -p mt -f deploy/compose.mt.yml --env-file deploy/mt/shipshift.env up -d --build
#
# It is deliberately NOT deploy/compose.stand.yml with more services: a stand is
# one shop per triple (own database, own key baked into the storefront image),
# this is one database and one storefront image with NO publishable key baked in
# at all — the key arrives per request from `GET /storefront/by-host`
# (docs/multitenancy/storefront-by-host.md §2). Everything about the ingress —
# entrypoint names `http`/`https`, resolver `letsencrypt`, network `coolify`,
# container names never bare service names — is inherited measured from
# compose.stand.yml; read its header comments before changing any of it.
#
# Tenant hosts (technical `<handle>.shipshift.dev` and custom domains) are NOT
# labelled here. They are written into traefik's file provider by
# deploy/scripts/tenant-ingress-sync.mjs, so a domain added in the panel goes
# live without touching this file or restarting anything.

x-backend-healthcheck: &backend-healthcheck
  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    container_name: mt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-medusa_mt}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d ${DB_NAME:-medusa_mt}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          # Per instance from its env file. The RU host sets 1536M: at 512M the
          # nightly pg_dump, which runs inside this container, was OOM-killed twice
          # on 03-04.10.2026 (lead-upready-store, Ivan's standing order 04.10).
          memory: ${MT_POSTGRES_MEMORY_LIMIT:-512M}
        reservations:
          memory: 256M

  # Medusa's event bus, workflow engine and locks (audit 46df A-04). Without
  # it all three live in the backend's memory, so every restart dropped what
  # was in flight: an `order.placed` caught by a deploy never ran its
  # subscribers, the one that files the order under its shop included. The
  # backend switches over on REDIS_URL alone (apps/backend/src/config/redis.ts).
  #
  # `noeviction` because BullMQ, which carries the event bus and the workflow
  # engine, loses jobs under any eviction policy; when the ceiling is reached
  # Redis refuses writes loudly instead. The cache's keys all carry a TTL, so
  # the ceiling is not something it fills. `appendonly` so a queued job
  # survives Redis' own restart, not only the backend's.
  #
  # Only on `mt-private`, never on `coolify`: that network is shared with every
  # other stack on this host, and this Redis has no password.
  redis:
    image: redis:7-alpine
    container_name: mt-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - mt-private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M

  backend:
    build:
      context: ../.
      dockerfile: apps/backend/Dockerfile
    image: mt-backend:${IMAGE_TAG:-latest}
    container_name: mt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "9000"
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@mt-postgres:5432/${DB_NAME:-medusa_mt}
      # The `redis` service above. Production needs REDIS_URL alone; USE_REDIS
      # is spelled out so nobody reads its absence as "Redis is off".
      REDIS_URL: redis://mt-redis:6379
      USE_REDIS: "true"
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # The session cookie is Secure in production unless this is `false`
      # (medusa-config.ts, audit A-03). Unset = Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Traefik sits in front: the login/registration rate limit takes the
      # client from the first X-Forwarded-For hop (src/api/rate-limit.ts).
      TRUST_PROXY: "1"
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      STOREFRONT_SETTINGS_SECRET: ${STOREFRONT_SETTINGS_SECRET}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-}
      DEMO_CUSTOMER_EMAIL: ${DEMO_CUSTOMER_EMAIL:-}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-}
      # The platform's own login (o25-platform-admin-all-shops): unset = off,
      # no shop gets a tenant_admin row for it. Set it and every NEW shop gets
      # one automatically (createTenantWorkflow); backfilling every EXISTING
      # shop is a separate, explicit run of
      # scripts/fixtures/o25-platform-admin-all-shops.ts, never this boot.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      # Sign in with Yandex ID for buyers (y01, docs/auth-yandex.md). Unset
      # YANDEX_CLIENT_ID = the provider is never registered and nothing
      # changes; a half-filled block (id without secret or callback URL)
      # fails at boot by design, naming the missing variable.
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_CALLBACK_URL: ${YANDEX_CALLBACK_URL:-}
      YANDEX_CALLBACK_ORIGINS: ${YANDEX_CALLBACK_ORIGINS:-}
      YANDEX_SCOPE: ${YANDEX_SCOPE:-}
      YANDEX_FORCE_CONFIRM: ${YANDEX_FORCE_CONFIRM:-false}
      # The profile the FIRST boot seeds (store, 241 regions, stock locations,
      # fulfillment + this profile's catalog). The other two demo catalogs are
      # seeded by re-running the same seed with another STORE_PROFILE —
      # initial-data-seed.ts's own header documents that second-run behaviour.
      STORE_PROFILE: ${PROFILE:-sneakers}
      STORE_MEDIA_BASE_URL: https://${ENGINE_DOMAIN}/static/store-profiles/${PROFILE:-sneakers}
      # Public base for files a TENANT uploads from the panel (product images,
      # category covers, hero pictures). Without it @medusajs/file-local stamps
      # its own default `http://localhost:9000/static` into every stored URL.
      LOCAL_FILE_BACKEND_URL: https://${ENGINE_DOMAIN}/static
      # The Result URL a shop owner pastes into Robokassa is built from this
      # (`/tenants/payment-settings` → `<BACKEND_PUBLIC_URL>/robokassa/result`);
      # the request host is the panel's behind nginx, so it cannot be derived.
      BACKEND_PUBLIC_URL: https://${ENGINE_DOMAIN}
      # Which suffixes make a host a tenant's TECHNICAL subdomain
      # (api/storefront/by-host/hosts.ts). `localhost` is dropped on purpose:
      # this is a public deployment, not a stand.
      TENANT_BASE_DOMAINS: ${TENANT_BASE_DOMAINS}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      STOREFRONT_URL: https://${ENGINE_DOMAIN}
      # Where the cache-clearing webhook goes. NOT STOREFRONT_URL: that is the
      # engine's domain (customer links in e-mails are built from it), while the
      # storefront is this other container — posting there answered 404 and no
      # shop ever saw its own edits.
      STOREFRONT_REVALIDATE_URL: http://mt-storefront:8000
      STORE_NAME: ${STORE_NAME:-Shipshift}
      STORE_EMAIL: ${STORE_EMAIL:-hello@shipshift.dev}
      # The footer of every letter (emails/i18n/constants.ts). compose.stand.yml
      # already passes both; without them here the footer renders an empty
      # address and an empty phone in every shop's e-mail.
      STORE_PHONE: ${STORE_PHONE:-}
      STORE_ADDRESS: ${STORE_ADDRESS:-}
      # Transactional e-mail (t08-order-notifications). Optional, like every
      # other piece of infrastructure here: with SMTP_HOST empty the provider is
      # never registered, the backend boots the same, and each undelivered
      # letter is logged with its order id. The links INSIDE a letter are built
      # from the shop the order belongs to, not from STOREFRONT_URL above.
      #
      # The `mail` service above (t-2026-10-02-mail-relay) is this stack's own
      # send-only relay: set SMTP_HOST=mail, SMTP_PORT=587, SMTP_SECURE=false,
      # SMTP_FROM=noreply@shipshift.dev and leave SMTP_USER/SMTP_PASS empty —
      # the relay takes no auth, only mail from this network. deploy/mt/MAIL.md
      # has the DNS records that make `mail`'s output land anywhere at all.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      # The owner's Telegram. The backend only SENDS; the bot container keeps
      # its long polling, which Telegram allows exactly one of per token.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_LINK_SECRET: ${TELEGRAM_LINK_SECRET:-}
      # Closed mode for every shop bot on this deployment (shop-bot/access-gate.ts):
      # SHA-256 hex of the access password; empty = open mode.
      SHOP_BOT_ACCESS_PASSWORD_SHA256: ${SHOP_BOT_ACCESS_PASSWORD_SHA256:-}
      # The marketplace scheduler's switch (src/jobs/marketplace-sync.ts): `off` stops
      # the five-minute tick that mirrors Wildberries and Ozon, «Обновить сейчас» in
      # the panel keeps working. Unset, or any other value, leaves the schedule on.
      MP_SCHEDULER: ${MP_SCHEDULER:-}
      # Where the owner opens an order: the panel, not the engine. The Telegram
      # message links here.
      PANEL_PUBLIC_URL: https://${PANEL_DOMAIN}
      STOREFRONT_DEFAULT_LOCALE: ${STOREFRONT_DEFAULT_LOCALE:-en}
      # The footer's attribution line, resolved per shop by GET /storefront/by-host
      # (src/api/storefront/by-host/attribution.ts): a shop's own override wins over
      # its group, a group over these. ATTRIBUTION_GROUPS is how one anchor is
      # handed to a batch of shops: {"<group>":{"anchor":"…"}}.
      ATTRIBUTION_ANCHOR: ${ATTRIBUTION_ANCHOR:-}
      ATTRIBUTION_HREF: ${ATTRIBUTION_HREF:-}
      ATTRIBUTION_BRAND: ${ATTRIBUTION_BRAND:-}
      ATTRIBUTION_REL: ${ATTRIBUTION_REL:-}
      ATTRIBUTION_GROUPS: ${ATTRIBUTION_GROUPS:-}
      MEDUSA_ADMIN_ONBOARDING_NEXTJS_DIRECTORY: medusa-storefront
    volumes:
      # The WHOLE media tree, not one profile's: this backend serves several
      # catalogs at once, one per tenant.
      - ${MEDIA_HOST_PATH:-/opt/upready-store/media}:/app/static/store-profiles
      # Tenant uploads live OUTSIDE the image: `static/tenants/<tenant_id>/…`
      # is written at runtime, so without this bind mount every picture a shop
      # owner uploads is destroyed by the next `up -d --build`.
      - ${TENANT_MEDIA_HOST_PATH:-/opt/upready-store/media-tenants}:/app/static/tenants
    networks:
      # traefik reaches the backend on `coolify` (the traefik.docker.network
      # label below pins it); Redis only on `mt-private`.
      - coolify
      - mt-private
    healthcheck: *backend-healthcheck
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.mt-https.redirectscheme.scheme=https
      - traefik.http.routers.mt-backend-http.rule=Host(`${ENGINE_DOMAIN}`)
      - traefik.http.routers.mt-backend-http.entrypoints=http
      - traefik.http.routers.mt-backend-http.middlewares=mt-https
      - traefik.http.routers.mt-backend-http.service=mt-backend
      - traefik.http.routers.mt-backend.rule=Host(`${ENGINE_DOMAIN}`)
      - traefik.http.routers.mt-backend.entrypoints=https
      - traefik.http.routers.mt-backend.tls=true
      - traefik.http.routers.mt-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.mt-backend.service=mt-backend
      - traefik.http.services.mt-backend.loadbalancer.server.port=9000

  storefront:
    build:
      context: ../.
      dockerfile: apps/storefront/Dockerfile
      args:
        # The FALLBACK profile only: theme and catalog come per request from
        # the resolved tenant. NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY is absent on
        # purpose — a key baked here would be one shop's key for every shop.
        NEXT_PUBLIC_STORE_PROFILE: ${PROFILE:-sneakers}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://${ENGINE_DOMAIN}
        NEXT_PUBLIC_BASE_URL: https://${STORES_DOMAIN}
        NEXT_PUBLIC_DEFAULT_REGION: ${DEFAULT_REGION:-us}
        # Baked in, because the browser reads it too (next-intl routing and the
        # x-default hreflang). The multi-tenant storefront opens in Russian.
        NEXT_PUBLIC_DEFAULT_LOCALE: ${STOREFRONT_DEFAULT_LOCALE:-ru}
        NEXT_PUBLIC_SITE_NAME: ${STORE_NAME:-Shipshift}
        # The engine's own name on a host with no tenant, not the fallback
        # profile's brand (sneakers is Kerbstone), so the build-time check that
        # the name equals the profile's style board does not apply here.
        STORE_SITE_NAME_GATE: "off"
        STORE_MEDIA_BASE_URL: https://${ENGINE_DOMAIN}/static/store-profiles/${PROFILE:-sneakers}
        NEXT_PUBLIC_DEMO_TENANT_BASE_DOMAIN: ${DEMO_TENANT_BASE_DOMAIN:-}
        # Checkout pickup-point map (i03). Baked in, because the map is a
        # client component: without it the map renders its failure state.
        NEXT_PUBLIC_YANDEX_MAPS_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_KEY:-}
        # «Войти с Яндекс ID» on the buyer login page (y01). Read in a
        # "use client" component, so it is inlined at build time: a runtime
        # env edit alone never flips the button (measured on live 2026-09-24).
        NEXT_PUBLIC_YANDEX_LOGIN_ENABLED: ${NEXT_PUBLIC_YANDEX_LOGIN_ENABLED:-false}
    image: mt-storefront:${IMAGE_TAG:-latest}
    container_name: mt-storefront
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "8000"
      # Hold an idle keep-alive socket longer than the proxy does (traefik: 90 s,
      # Node: 5 s by default), or a request the proxy writes to a socket Node has
      # just closed is a 502 (pass 3b N12). The backend sets the same in
      # apps/backend/src/config/http-keep-alive.ts.
      KEEP_ALIVE_TIMEOUT: "95000"
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://${ENGINE_DOMAIN}
      NEXT_PUBLIC_BASE_URL: https://${STORES_DOMAIN}
      NEXT_PUBLIC_DEFAULT_REGION: ${DEFAULT_REGION:-us}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${STOREFRONT_DEFAULT_LOCALE:-ru}
      NEXT_PUBLIC_SITE_NAME: ${STORE_NAME:-Shipshift}
      NEXT_PUBLIC_YANDEX_MAPS_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_KEY:-}
      NEXT_PUBLIC_YANDEX_LOGIN_ENABLED: ${NEXT_PUBLIC_YANDEX_LOGIN_ENABLED:-false}
      REGION_PIN: "true"
      # A visitor without a locale in the URL gets NEXT_PUBLIC_DEFAULT_LOCALE
      # whatever their browser sends: this storefront's audience is Russian
      # speaking (Ivan's order 4.1, 2026-09-12). A pick in the language switcher
      # still wins. The stands run without the pin and negotiate with the browser.
      LOCALE_PIN: "true"
      # Which country — and therefore which Medusa region, and therefore which
      # currency — a locale implies. Prices are NOT converted in the markup: the
      # region carries its own price rows. Empty on a deployment that wants one
      # currency for every language.
      LOCALE_COUNTRY_MAP: ${LOCALE_COUNTRY_MAP:-ru:ru,en:us}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      STOREFRONT_STUDIO_PASSWORD: ${STOREFRONT_STUDIO_PASSWORD}
      STOREFRONT_SETTINGS_SECRET: ${STOREFRONT_SETTINGS_SECRET}
      # The seller's requisites line in the Olavka footer (t-2026-10-08-13): the
      # legal name, the ОГРНИП and the ИНН under the footer's columns. Off unless
      # this is 1 or true. Robokassa moderates a shop only with the requisites in
      # its footer, so the RU env file is where it is meant to be set; everywhere
      # else Ivan's order of 03.10.2026 keeps the requisites off. The storefront
      # reads it at render time: edit the env file and run `up -d`, no rebuild.
      STOREFRONT_FOOTER_REQUISITES: ${STOREFRONT_FOOTER_REQUISITES:-}
      # Takes the red test-mode dot off every page (t-2026-10-08-13). The dot is
      # the owner's mark of test payments and delivery (t-2026-10-04-21). A shop
      # under Robokassa moderation keeps its payments in test until the
      # moderation ends, so set this to 1 for that time and remove it after.
      # Off unless it is 1 or true. Read at render time, like the line above.
      STOREFRONT_HIDE_TEST_MODE_DOT: ${STOREFRONT_HIDE_TEST_MODE_DOT:-}
      # The catalog's view controls (ask a0e1, t-2026-10-06-09): grid, rows, a
      # denser grid and 12/24/48 per page. 1 or true turns them on for every shop
      # of the stack, a comma-separated list of tenant handles for those shops
      # alone; the Olavka shops never get them. Off unless set, and a shop without
      # them keeps its listing and its page code as they were. Read at render time.
      STOREFRONT_CATALOG_VIEW_CONTROLS: ${STOREFRONT_CATALOG_VIEW_CONTROLS:-}
      # Hosts that carry the paywall->onboarding demo instead of a shop
      # (t-2026-09-12-paywall-onboarding-demo). They resolve to no tenant, so
      # src/middleware.ts sends them to /start, which lives outside [locale] and
      # asks the Store API for nothing. Empty = no host behaves this way.
      DEMO_HOSTS: ${DEMO_HOSTS:-}
      DEMO_TENANT_BASE_DOMAIN: ${DEMO_TENANT_BASE_DOMAIN:-}
      DEMO_PANEL_URL: ${DEMO_PANEL_URL:-}
    networks:
      - coolify
    healthcheck:
      # /healthz, not /: this storefront resolves its tenant from the Host
      # header, and `127.0.0.1` is no tenant — see apps/storefront/src/app/healthz.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      # Tenant hosts are NOT labelled here — tenant-ingress-sync.sh writes them
      # into traefik's file provider, which is what lets a domain added in the
      # panel go live without touching this file.
      #
      # `${STORES_DOMAIN}` is the CNAME target the panel hands a shop owner. It
      # is not a shop, so it must never reach the storefront: an unresolvable
      # Host is exactly defect A2 (unknown domain → 500). It redirects to the
      # engine instead, and holds its own certificate so the redirect happens
      # over https for anyone who lands on it.
      - traefik.http.middlewares.mt-stores-home.redirectregex.regex=^https?://[^/]+/.*
      - traefik.http.middlewares.mt-stores-home.redirectregex.replacement=https://${ENGINE_DOMAIN}/
      - traefik.http.routers.mt-stores-http.rule=Host(`${STORES_DOMAIN}`)
      - traefik.http.routers.mt-stores-http.entrypoints=http
      - traefik.http.routers.mt-stores-http.middlewares=mt-https
      - traefik.http.routers.mt-stores-http.service=mt-storefront
      - traefik.http.routers.mt-stores.rule=Host(`${STORES_DOMAIN}`)
      - traefik.http.routers.mt-stores.entrypoints=https
      - traefik.http.routers.mt-stores.tls=true
      - traefik.http.routers.mt-stores.tls.certresolver=letsencrypt
      - traefik.http.routers.mt-stores.middlewares=mt-stores-home
      - traefik.http.routers.mt-stores.service=mt-storefront
      - traefik.http.services.mt-storefront.loadbalancer.server.port=8000

  panel:
    build:
      context: ../.
      dockerfile: apps/tenant-panel/Dockerfile
      args:
        VITE_MEDUSA_STOREFRONT_URL: https://${STORES_DOMAIN}
        VITE_TENANT_CNAME_TARGET: ${STORES_DOMAIN}
    image: mt-panel:${IMAGE_TAG:-latest}
    container_name: mt-panel
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # nginx.conf proxies /auth and /tenants here, so the browser sees one
      # origin and the session cookie stays first-party (no CORS on /tenants/*).
      BACKEND_ORIGIN: http://mt-backend:9000
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.mt-panel-http.rule=Host(`${PANEL_DOMAIN}`) || Host(`${PANEL_DOMAIN_ALT:-${PANEL_DOMAIN}}`) || Host(`${PANEL_DOMAIN_ALT_2:-${PANEL_DOMAIN}}`)
      - traefik.http.routers.mt-panel-http.entrypoints=http
      - traefik.http.routers.mt-panel-http.middlewares=mt-https
      - traefik.http.routers.mt-panel-http.service=mt-panel
      - traefik.http.routers.mt-panel.rule=Host(`${PANEL_DOMAIN}`) || Host(`${PANEL_DOMAIN_ALT:-${PANEL_DOMAIN}}`) || Host(`${PANEL_DOMAIN_ALT_2:-${PANEL_DOMAIN}}`)
      - traefik.http.routers.mt-panel.entrypoints=https
      - traefik.http.routers.mt-panel.tls=true
      - traefik.http.routers.mt-panel.tls.certresolver=letsencrypt
      - traefik.http.routers.mt-panel.service=mt-panel
      - traefik.http.services.mt-panel.loadbalancer.server.port=8080

  # Send-only relay for the backend's transactional e-mail (t-2026-10-02-mail-relay).
  # No published ports and no SASL: `mt-private` is the only network it is on,
  # the same one the backend and Redis use, and boky/postfix's own
  # `smtpd_recipient_restrictions` (deploy/mt/MAIL.md) rejects an envelope
  # sender outside ALLOWED_SENDER_DOMAINS rather than relaying it. `mynetworks`
  # stays the image's default (RFC 1918 ranges), which already covers whatever
  # subnet Docker assigns `mt-private` — nothing on `coolify` can reach this
  # service to use it as an open relay.
  #
  # Pinned to v5.1.0, the newest tag github.com/bokysan/docker-postfix has
  # released (2026-01-04, checked against its GitHub releases on 2026-10-02):
  # its own README already documents rspamd as the default DKIM backend for
  # an unreleased `master`, but v5.1.0 still signs through OpenDKIM, which is
  # what every env var and file path below assumes. Alpine keeps the image
  # small, like every other base image in this compose file.
  mail:
    image: boky/postfix:v5.1.0-alpine
    container_name: mt-mail
    restart: unless-stopped
    environment:
      # MAIL_HOSTNAME and MAIL_SENDER_DOMAINS are per host. Both defaults are the
      # INTL (Contabo) host's own, so its env file needs neither key. Any other
      # host sets both (deploy/mt/MAIL.md, "A Second Host"): with the default
      # name the relay introduces itself as a machine it is not, and with the
      # default domain it refuses a sender of any other domain.
      # deploy/scripts/instance-check.mjs fails a deploy on either mistake.
      #
      # The host's own reverse DNS (measured 2026-10-02: PTR of 84.46.251.149
      # is vmi3137962.contaboserver.net) — HELO/EHLO must match it, or a
      # receiving MTA's PTR check fails before SPF or DKIM are even read.
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-vmi3137962.contaboserver.net}
      # The host's default route is IPv6 with no matching PTR (measured
      # 2026-10-02); forcing IPv4 keeps every outbound connection on the
      # address the PTR and the SPF `ip4:` record below actually describe.
      POSTFIX_inet_protocols: ipv4
      # Space-separated. The domain of SMTP_FROM has to be one of them.
      ALLOWED_SENDER_DOMAINS: ${MAIL_SENDER_DOMAINS:-shipshift.dev}
      # Generates /etc/opendkim/keys/<domain>.{private,txt} for each domain
      # above that has no key in the volume yet; a key already there is left
      # alone. Reading the public key and rolling the selector are in
      # deploy/mt/MAIL.md.
      DKIM_AUTOGENERATE: "1"
      DKIM_SELECTOR: mt1
    volumes:
      # Outside git on purpose: a DKIM private key committed anywhere, even in
      # a throwaway branch, is a key an attacker can sign shipshift.dev mail
      # with forever. A fresh checkout boots with an empty volume and
      # generates its own key, which then needs its own DNS record.
      - mail-dkim-keys:/etc/opendkim/keys
    networks:
      - mt-private
    healthcheck:
      # The image's own check (scripts/healthcheck.sh): EHLO on 587, plus the
      # opendkim milter socket when DKIM is configured.
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  # The dynamic half of the ingress: every tenant host, pushed into traefik's
  # file provider from the database. postgres:16-alpine is here for `psql` and
  # nothing else — the backend image has no pg client and no `pg` dependency of
  # its own (checked, not assumed).
  ingress:
    image: postgres:16-alpine
    container_name: mt-ingress-sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@mt-postgres:5432/${DB_NAME:-medusa_mt}
      TENANT_BASE_DOMAINS: ${TENANT_BASE_DOMAINS}
      STOREFRONT_SERVICE: http://mt-storefront:8000
      SYNC_INTERVAL: ${INGRESS_SYNC_INTERVAL:-15}
    entrypoint: ["/bin/sh", "/usr/local/bin/tenant-ingress-sync.sh"]
    volumes:
      - ./scripts/tenant-ingress-sync.sh:/usr/local/bin/tenant-ingress-sync.sh:ro
      - ${TRAEFIK_DYNAMIC_HOST_PATH:-/data/coolify/proxy/dynamic}:/traefik-dynamic
    networks:
      - coolify
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  coolify:
    external: true
  # The backend and Redis, nothing else.
  mt-private: {}

volumes:
  db-data:
  redis-data:
  mail-dkim-keys:
