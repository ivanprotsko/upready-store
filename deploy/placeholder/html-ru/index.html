<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Olavka — платформа интернет-магазинов</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0f1a17; color: #f4f6f5; font-family: -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 8vh 7vw; box-sizing: border-box; max-width: 860px; }
  .brand { font-size: 1rem; letter-spacing: .28em; text-transform: uppercase; color: #8fd3b8; margin: 0 0 1.2rem; }
  h1 { font-size: clamp(1.8rem, 4.2vw, 3rem); line-height: 1.15; margin: 0 0 1rem; font-weight: 600; }
  p { font-size: clamp(1.05rem, 1.6vw, 1.25rem); line-height: 1.5; margin: 0 0 .8rem; color: #cfd8d4; }
  .soon { display: inline-block; margin-top: 1.6rem; padding: .55rem 1.1rem; border: 1px solid #8fd3b8; border-radius: 999px; color: #8fd3b8; font-size: .95rem; letter-spacing: .08em; }
  footer { margin-top: 3rem; font-size: .85rem; color: #7f8c87; }
</style>
</head>
<body>
<main>
  <p class="brand">Olavka</p>
  <h1>Платформа интернет-магазинов upready store</h1>
  <p>Магазины на Olavka уже работают. Сайт платформы с описанием возможностей, тарифами и входом для владельцев магазинов откроется здесь в ближайшие дни.</p>
  <span class="soon">Скоро</span>
  <footer>© 2026 Olavka · upready store</footer>
</main>
</body>
</html>
