# Placeholder vhost (t-2026-10-04-11): every path answers the one page, /healthz answers "ok".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
