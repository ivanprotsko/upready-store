# Placeholder vhost (t-2026-10-04-11): every path answers the one page, /healthz answers "ok",
# /landing/ answers the page's own files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    # The files a page keeps beside it (fonts, pictures; t-2026-10-08-35, html-school/landing/).
    # A missing one is a 404, never the page.
    location ^~ /landing/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
