# nginx template (the image's own entrypoint expands ${BACKEND_ORIGIN} at boot).
#
# Two jobs: serve the SPA, and be the same-origin front for the backend's
# `/auth` and `/tenants` prefixes — the production twin of vite.config.mts's
# dev-server proxy. Nothing else is proxied: `/admin` and `/store` are not the
# panel's business.
# Which brand of the help a host gets (t-2026-10-09-104). docs/owner-guide/publish.mjs
# writes the lines from docs/owner-guide/brands.json, the default included, next to
# one build per brand, so a page comes with its brand and never swaps it in the browser.
map $host $help_brand {
  include /usr/share/nginx/help/brands.map;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Redirects nginx makes itself (/help → /help/, a help section without its
  # trailing slash) stay relative. An absolute one would carry this
  # container's own scheme and port 8080, not what the visitor came in on
  # through Traefik.
  absolute_redirect off;

  # Upstream as a variable so nginx starts even while the backend container is
  # still booting; with a literal proxy_pass host nginx exits on an unresolvable
  # name and the panel would crash-loop behind a healthy proxy.
  resolver 127.0.0.11 valid=10s;

  location ~ ^/(auth|tenants)(/|$) {
    set $backend ${BACKEND_ORIGIN};

    # The scheme the VISITOR used, not the one this container was reached with.
    # Traefik terminates TLS and hands the request down over plain HTTP, so
    # `$scheme` here is always `http`; passing that on told the backend the panel
    # lives on `http://`, and `/tenants/payment-settings` built the Robokassa
    # Result URL out of it (b10-panel-gaps). Keep what the proxy in front sent
    # and fall back to our own scheme only when there is nothing in front.
    set $forwarded_scheme $http_x_forwarded_proto;
    if ($forwarded_scheme = "") {
      set $forwarded_scheme $scheme;
    }

    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 25m;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # The help (docs/owner-guide, built by the Dockerfile with base /help/ for
  # every brand). The brand is the one of this panel's host. Pages are
  # `<name>.html` behind `/help/<name>`, and a path that is not there gets the
  # help's own «page not found».
  location = /help {
    return 301 /help/;
  }

  location /help/ {
    root /usr/share/nginx/help/$help_brand/panel;
    try_files $uri $uri.html $uri/ =404;
    error_page 404 /help/404.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# The docs hosts (docs.upready.dev, a customer's docs.<their domain>,
# t-2026-10-09-104) get the same help as /help/ above, built with base / and
# served from the root. It has a port of its own rather than a server_name
# list. Traefik sends the docs hosts here (the routers
# deploy/scripts/tenant-ingress-sync.sh writes from DOCS_DOMAINS), so nginx
# needs no list of hosts and a panel host can never land in the docs by
# accident. The map above picks the build of the host's brand.
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/help/$help_brand/root;
  absolute_redirect off;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
