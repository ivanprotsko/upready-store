<section id="sec-showcase" data-screen-label="Примеры магазинов" style="position:relative;border-top:1px solid #E4E4E7;padding:clamp(48px,6vw,76px) 0 0">
    <div style="padding:0 clamp(20px,4vw,56px) 28px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:16px">
        <span style="width:5px;height:5px;background:#18181B"></span>
        <span style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#71717A">{{ nShowcase }} · примеры</span>
      </div>
      <h2 style="font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.05;max-width:680px">Примеры магазинов</h2>
      <p style="margin-top:18px;font-size:clamp(15px,1.5vw,17px);line-height:1.6;color:#52525B;max-width:600px">Пять витрин, собранных на том же решении, которое мы развернём вам: электроника, одежда, товары для дома, БАД и обувь. У каждой своя тема, свои шрифты и своя фотография — меняется оформление, а не движок.</p>
    </div>

    <div style="padding:0 clamp(20px,4vw,56px) 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px">
      <button onClick="{{ prevCard }}" title="Назад" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #E4E4E7;background:#fff;color:#18181B;transition:all .15s" style-hover="background:#FAFAFA;border-color:#D4D4D8">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </button>
      <button onClick="{{ nextCard }}" title="Вперёд" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #E4E4E7;background:#fff;color:#18181B;transition:all .15s" style-hover="background:#FAFAFA;border-color:#D4D4D8">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </button>
    </div>

    <div id="rail-cards" ref="{{ setCardRail }}" style="display:flex;gap:1px;background:#E4E4E7;border-top:1px solid #E4E4E7;border-bottom:1px solid #E4E4E7;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="5">
        <a href="{{ c.url }}" target="_blank" rel="noopener" style="flex:0 0 min(78%,290px);scroll-snap-align:start;background:#fff;display:flex;flex-direction:column;padding:14px 14px 0;text-decoration:none;color:inherit">
          <div style="position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border:1px solid #E4E4E7;border-radius:10px;background:linear-gradient(to top,#F4F4F5,#FAFAFA)">
            <img src="{{ c.img }}" alt="{{ c.alt }}" loading="lazy" style="position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:top">
          </div>
          <div style="padding:22px 10px 26px;display:flex;flex-direction:column;gap:9px">
            <span style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#71717A">{{ c.eyebrow }}</span>
            <h3 style="font-size:15.5px;font-weight:600;letter-spacing:-.02em">{{ c.title }}</h3>
            <p style="font-size:13px;line-height:1.55;color:#52525B">{{ c.desc }}</p>
          </div>
        </a>
      </sc-for>
    </div>

    <div style="height:clamp(48px,6vw,76px)"></div>
  </section>
