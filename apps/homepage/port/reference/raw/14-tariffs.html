<section id="sec-tariffs" data-screen-label="Тарифы" style="position:relative;border-top:1px solid #E4E4E7;padding:clamp(48px,6vw,76px) 0 0">
    <i style="position:absolute;top:-6.5px;left:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <i style="position:absolute;top:-6.5px;right:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <div style="padding:0 clamp(20px,4vw,56px) 32px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:16px">
        <span style="width:5px;height:5px;background:#18181B"></span>
        <span style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#71717A">{{ nTariffs }} · выбор тарифа</span>
      </div>
      <h2 style="font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.05;max-width:680px">Выберите тариф</h2>
      <p style="margin-top:18px;font-size:clamp(15px,1.5vw,17px);line-height:1.6;color:#52525B;max-width:620px">Оплата картой или через СБП на стороне Tribute — счёт формируется сразу после выбора тарифа.</p>
    </div>

    <div style="display:grid;grid-template-columns:{{ gridPlans }};gap:1px;background:#E4E4E7;border-top:1px solid #E4E4E7;border-bottom:1px solid #E4E4E7">
      <sc-for list="{{ plans }}" as="pl" hint-placeholder-count="2">
        <div style="background:#fff;padding:clamp(22px,2.6vw,30px);display:flex;flex-direction:column;gap:16px;min-width:0">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#71717A">{{ pl.tag }}</span>
          </div>
          <h3 style="font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.2">{{ pl.title }}</h3>
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="display:inline-flex;align-items:baseline;gap:5px;color:#18181B"><span style="font-family:'Roboto Mono',monospace;font-size:29px;letter-spacing:-.03em">{{ pl.price }}</span><span style="font-family:Inter,sans-serif;font-size:24px;font-weight:500">₽</span></span>
            <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#71717A">{{ pl.term }}</span>
          </div>
          <p style="font-size:13px;line-height:1.6;color:#52525B">{{ pl.desc }}</p>
          <ul style="display:flex;flex-direction:column;gap:8px">
            <sc-for list="{{ pl.rows }}" as="r" hint-placeholder-count="4">
              <li style="display:flex;gap:9px;align-items:flex-start">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:2px"><path d="M20 6 9 17l-5-5"></path></svg>
                <span style="font-size:13px;line-height:1.5;color:#3F3F46">{{ r.t }}</span>
              </li>
            </sc-for>
          </ul>
          <button onClick="{{ pl.open }}" style="margin-top:auto;height:44px;border-radius:9px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;transition:all .15s;{{ pl.btn }}">Оплатить</button>
          <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#71717A">{{ pl.fine }}</span>
        </div>
      </sc-for>
    </div>

    <div style="height:clamp(48px,6vw,76px)"></div>
  </section>
