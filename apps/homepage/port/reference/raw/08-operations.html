<section data-screen-label="Операции" style="position:relative;border-top:1px solid #E4E4E7">
    <i style="position:absolute;top:-6.5px;left:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <i style="position:absolute;top:-6.5px;right:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:end;gap:24px;padding:clamp(48px,6vw,76px) clamp(20px,4vw,56px) 32px">
      <div>
        <div style="display:inline-flex;align-items:center;gap:9px;margin-bottom:16px">
          <span style="width:5px;height:5px;background:#18181B"></span>
          <span style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#71717A">{{ nOps }} · операции</span>
        </div>
        <h2 style="max-width:600px;font-size:clamp(26px,3.6vw,40px);line-height:1.05;letter-spacing:-.035em;font-weight:600;text-wrap:pretty">Управляйте продажами <br>без сложных настроек</h2>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
        <p style="max-width:420px;font-size:clamp(15px,1.5vw,17px);line-height:1.6;color:#52525B;text-wrap:pretty">Панель управления магазином, которую вы получаете вместе с установкой: товары, каналы продаж, склады, регионы и промоакции.</p>
        <div style="display:flex;align-items:center;gap:10px">
          <button onClick="{{ prevSlide }}" title="Назад" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid #E4E4E7;background:#fff;color:#18181B;transition:all .15s" style-hover="background:#FAFAFA;border-color:#D4D4D8">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
          </button>
          <button onClick="{{ nextSlide }}" title="Вперёд" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid #E4E4E7;background:#fff;color:#18181B;transition:all .15s" style-hover="background:#FAFAFA;border-color:#D4D4D8">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
          </button>
          <span style="font-family:'Roboto Mono',monospace;font-size:11.5px;color:#71717A">{{ slideLabel }}</span>
        </div>
      </div>
    </div>
    <div id="rail-ops" ref="{{ setRail }}" onScroll="{{ onRail }}" style="display:flex;gap:1px;background:#E4E4E7;border-top:1px solid #E4E4E7;border-bottom:1px solid #E4E4E7;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none">
      <sc-for list="{{ opsSlides }}" as="s" hint-placeholder-count="5">
        <div style="flex:0 0 min(84%,440px);scroll-snap-align:start;background:#fff;display:flex;flex-direction:column;padding:14px 14px 0">
          <div style="position:relative;width:100%;aspect-ratio:544/490;max-height:420px;overflow:hidden;border:1px solid #E4E4E7;border-radius:10px;background:linear-gradient(to top,#F4F4F5,#FAFAFA)">
            <img src="{{ s.img }}" alt="{{ s.title }}" loading="lazy" style="position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:right bottom">
          </div>
          <div style="padding:26px 10px 24px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
              <span style="font-size:15px;font-weight:600;letter-spacing:-.02em">{{ s.title }}</span>
              <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#C4C4CC;flex:0 0 auto">{{ s.n }}</span>
            </div>
            <p style="margin-top:8px;font-size:13px;line-height:1.6;color:#52525B">{{ s.desc }}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
