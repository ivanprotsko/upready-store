<section id="sec-faq" data-screen-label="Вопросы" style="position:relative;border-top:1px solid #E4E4E7">
    <i style="position:absolute;top:-6.5px;left:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <i style="position:absolute;top:-6.5px;right:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>

    <div style="display:grid;grid-template-columns:{{ gridFaq }};gap:1px;background:#E4E4E7">
      <div style="background:#fff;padding:clamp(48px,6vw,76px) clamp(20px,4vw,56px)">
        <div style="position:sticky;top:88px">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:16px">
            <span style="width:5px;height:5px;background:#18181B"></span>
            <span style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#71717A">{{ nFaq }} · вопросы</span>
          </div>
          <h2 style="font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.05">Частые вопросы</h2>
          <p style="margin-top:18px;font-size:13.5px;line-height:1.6;color:#52525B;max-width:420px">Не нашли ответ — напишите в телеграм, ответим тем же текстом, что здесь.</p>
        </div>
      </div>

      <div style="background:#fff;padding:clamp(32px,4vw,52px) clamp(20px,4vw,56px)">
        <sc-for list="{{ faq }}" as="q" hint-placeholder-count="7">
          <div style="border-bottom:1px solid #E4E4E7">
            <button onClick="{{ q.toggle }}" style="width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 0;text-align:left">
              <h3 style="font-size:15px;font-weight:600;letter-spacing:-.02em;color:#18181B">{{ q.q }}</h3>
              <span style="flex:0 0 auto;width:18px;height:18px;margin-top:1px;position:relative;transition:transform .25s;transform:{{ q.rot }}">
                <span style="position:absolute;top:8.5px;left:0;width:18px;height:1.4px;background:#71717A"></span>
                <span style="position:absolute;left:8.5px;top:0;width:1.4px;height:18px;background:#71717A"></span>
              </span>
            </button>
            <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
              <p style="padding:0 40px 20px 0;font-size:13.5px;line-height:1.65;color:#52525B">{{ q.a }}<sc-if value="{{ q.todo }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;padding:2px 6px;border-radius:4px;background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;font-family:'Roboto Mono',monospace;font-size:10.5px">{{ q.todo }}</span></sc-if></p>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </section>
