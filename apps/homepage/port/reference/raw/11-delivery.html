<section id="sec-delivery" data-screen-label="Доставка" style="position:relative;border-top:1px solid #E4E4E7;padding:clamp(48px,6vw,76px) clamp(20px,4vw,56px)">
    <i style="position:absolute;top:-6.5px;left:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <i style="position:absolute;top:-6.5px;right:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:16px">
      <span style="width:5px;height:5px;background:#18181B"></span>
      <span style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#71717A">{{ nDelivery }} · доставка</span>
    </div>
    <h2 style="font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.05">Доставка подключена</h2>
    <p style="margin-top:18px;font-size:clamp(15px,1.5vw,17px);line-height:1.6;color:#52525B;max-width:640px">Интегрируем магазин со службами доставки — покупатель видит актуальную стоимость доставки прямо при оформлении заказа, а вы печатаете готовые ярлыки для отправлений в один клик.</p>
    <div style="margin-top:24px;display:flex;align-items:center;gap:8px">
      <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#71717A">11 служб</span>
      <button onClick="{{ prevDel }}" title="Назад" style="margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #E4E4E7;background:#fff;color:#18181B;transition:all .15s" style-hover="background:#FAFAFA;border-color:#D4D4D8">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </button>
      <button onClick="{{ nextDel }}" title="Вперёд" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #E4E4E7;background:#fff;color:#18181B;transition:all .15s" style-hover="background:#FAFAFA;border-color:#D4D4D8">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </button>
    </div>

    <ul id="rail-delivery" ref="{{ setDelRail }}" style="margin-top:12px;display:flex;gap:1px;background:#E4E4E7;border:1px solid #E4E4E7;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none">
      <sc-for list="{{ delivery }}" as="d" hint-placeholder-count="11">
        <li style="flex:0 0 min(64%,208px);scroll-snap-align:start;background:#fff;padding:16px 14px;display:flex;flex-direction:column;gap:9px;min-width:0">
          <sc-if value="{{ d.hasLogo }}" hint-placeholder-val="{{ false }}">
            <span style="display:flex;align-items:center;height:24px">
              <img src="{{ d.logo }}" alt="{{ d.name }}" loading="lazy" style="display:block;width:{{ d.logoW }};height:{{ d.logoH }}" />
            </span>
          </sc-if>
          <sc-if value="{{ d.noLogo }}" hint-placeholder-val="{{ true }}">
            <span style="display:flex;align-items:center;height:24px">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="{{ d.d1 }}"></path><path d="{{ d.d2 }}"></path></svg>
            </span>
          </sc-if>
          <span style="font-size:13.5px;font-weight:500;letter-spacing:-.015em;color:#18181B">{{ d.name }}</span>
          <span style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.04em;color:#71717A">{{ d.kind }}</span>
        </li>
      </sc-for>
    </ul>
  </section>
