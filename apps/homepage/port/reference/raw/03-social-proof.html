<section data-screen-label="Кто уже на этой системе" style="position:relative;border-top:1px solid #E4E4E7">
    <i style="position:absolute;top:-6.5px;left:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <i style="position:absolute;top:-6.5px;right:-6.5px;width:13px;height:13px;pointer-events:none;background:linear-gradient(#D4D4D8,#D4D4D8) center/1.2px 100% no-repeat,linear-gradient(#D4D4D8,#D4D4D8) center/100% 1.2px no-repeat"></i>
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:15px clamp(20px,4vw,56px)">
      <div style="display:inline-flex;align-items:center;gap:9px">
        <span style="width:5px;height:5px;background:#18181B"></span>
        <span style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#71717A">{{ nLogos }} · на этой же системе</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#71717A">та же система управления магазином</span>
        <button onClick="{{ prevLogo }}" title="Назад" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #E4E4E7;background:#fff;color:#18181B;transition:all .15s" style-hover="background:#FAFAFA;border-color:#D4D4D8">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
        </button>
        <button onClick="{{ nextLogo }}" title="Вперёд" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #E4E4E7;background:#fff;color:#18181B;transition:all .15s" style-hover="background:#FAFAFA;border-color:#D4D4D8">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
        </button>
      </div>
    </div>
    <div id="rail-logos" ref="{{ setLogoRail }}" style="display:flex;gap:1px;background:#E4E4E7;border-top:1px solid #E4E4E7;border-bottom:1px solid #E4E4E7;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none">
      <sc-for list="{{ logos }}" as="l" hint-placeholder-count="10">
        <div style="flex:0 0 min(80%,300px);scroll-snap-align:start;background:#fff;display:flex;flex-direction:column;padding:14px 14px 0">
          <div style="display:flex;align-items:center;justify-content:center;height:132px;padding:24px;border:1px solid #E4E4E7;border-radius:10px;background:linear-gradient(to top,#F4F4F5,#FAFAFA)">
            <img src="{{ l.img }}" alt="{{ l.name }}" loading="lazy" style="max-height:{{ l.h }};max-width:150px;filter:grayscale(1);opacity:.9">
          </div>
          <div style="padding:20px 10px 24px;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;align-items:center;gap:9px">
              <span style="font-size:14.5px;font-weight:500;letter-spacing:-.02em">{{ l.name }}</span>
              <span style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border:1px solid #E4E4E7;border-radius:999px;background:#FAFAFA;font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.06em;color:#71717A;flex:0 0 auto">{{ l.tag }}</span>
            </div>
            <p style="font-size:12.5px;line-height:1.55;color:#52525B">{{ l.note }}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
