<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Composer · стенд-конструктор главной</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/lib/blocks.css" />
<link rel="stylesheet" href="/lib/hero.css" />
<style>
/* ---------- the lab chrome: neutral, Geist tokens by hand, same family as blocks-lab ---------- */
:root {
  --lab-bg: #0e0e10; --lab-panel: #151517; --lab-line: #2a2a2f; --lab-hover: #1f1f24; --lab-active: #26262c;
  --lab-ink: #f2f2f4; --lab-dim: #9a9aa4; --lab-faint: #6b6b75; --lab-acc: #7dd3fc;
  --lab-pass: #4ade80; --lab-fail: #f87171; --lab-warn: #fbbf24;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--lab-bg); color: var(--lab-ink); font-size: 14px; line-height: 1.45; }
.app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
.rail { border-right: 1px solid var(--lab-line); background: var(--lab-panel); overflow-y: auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 18px; }
.rail > header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.rail > header .hint { display: block; margin-top: 4px; }
.hint { color: var(--lab-dim); font-size: 12px; line-height: 1.5; }
.hint code, .mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.g > label { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--lab-dim); font-family: var(--mono); margin-bottom: 8px; }
.seg { display: flex; border: 1px solid var(--lab-line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; appearance: none; border: 0; background: transparent; color: var(--lab-dim); font: inherit; font-size: 13px; padding: 7px 10px; cursor: pointer; text-align: left; }
.seg.row button { text-align: center; }
.seg.row button + button { border-left: 1px solid var(--lab-line); }
.seg.col { flex-direction: column; }
.seg.col button + button { border-top: 1px solid var(--lab-line); }
.seg button:hover { background: var(--lab-hover); color: var(--lab-ink); }
.seg button[aria-pressed="true"] { background: var(--lab-active); color: var(--lab-ink); }
.seg button .k { font-family: var(--mono); font-size: 11px; color: var(--lab-faint); margin-right: 8px; display: inline-block; min-width: 22px; }
.seg button[aria-pressed="true"] .k { color: var(--lab-acc); }
.seg button[disabled] { color: var(--lab-faint); cursor: not-allowed; }
input, textarea { width: 100%; font: inherit; font-size: 13px; color: var(--lab-ink); background: var(--lab-bg); border: 1px solid var(--lab-line); border-radius: 6px; padding: 7px 10px; }
input:focus, textarea:focus { outline: none; border-color: #878787; }
input::placeholder, textarea::placeholder { color: var(--lab-faint); }
textarea { resize: vertical; min-height: 54px; margin-top: 8px; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btnl { appearance: none; font: inherit; font-size: 13px; border-radius: 6px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--lab-line); background: transparent; color: var(--lab-ink); }
.btnl:hover { background: var(--lab-hover); }
.btnl.primary { background: var(--lab-ink); color: var(--lab-bg); border-color: var(--lab-ink); font-weight: 500; }
.btnl.primary:hover { background: #d8d8dc; }
.btnl[disabled] { opacity: .45; cursor: not-allowed; }
.err { color: var(--lab-fail); font-size: 12px; margin: 8px 0 0; }
.ok { color: var(--lab-pass); font-size: 12px; margin: 8px 0 0; }

ul.versions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ver { border: 1px solid var(--lab-line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.ver.on { border-color: #4a4a55; background: var(--lab-hover); }
.ver .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ver .lbl { font-weight: 500; font-size: 13px; }
.ver .lbl input { padding: 3px 6px; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #4b4b53; flex: 0 0 auto; }
.dot[data-s="fresh"] { background: var(--lab-pass); } .dot[data-s="stale"] { background: var(--lab-warn); }
.ver .meta { color: var(--lab-dim); font-size: 12px; }
.ver .note { color: var(--lab-dim); font-size: 12px; white-space: pre-wrap; }
.ver .acts { display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
.ver .acts button, .ver .acts a { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--lab-acc); cursor: pointer; text-decoration: none; }
.ver .acts button:hover, .ver .acts a:hover { text-decoration: underline; }
.ver .acts button.danger { color: var(--lab-fail); }
.empty { color: var(--lab-faint); font-size: 12px; text-align: center; padding: 14px 0; }

.stage { overflow: auto; padding: 14px 20px 60px; }
.stagebar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 0 12px; background: linear-gradient(var(--lab-bg) 70%, transparent); font-size: 12px; color: var(--lab-dim); }
.stagebar b { color: var(--lab-ink); font-weight: 500; }
.stagebar a { color: var(--lab-acc); text-decoration: none; margin-left: auto; }
.chip { font-size: 11px; border-radius: 999px; padding: 3px 10px 3px 8px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--lab-line); color: var(--lab-dim); font-family: var(--mono); }
.chip .dot { width: 7px; height: 7px; }
.chip[data-verdict="pass"] { color: var(--lab-pass); border-color: #1f4d33; } .chip[data-verdict="pass"] .dot { background: var(--lab-pass); }
.chip[data-verdict="fail"] { color: var(--lab-fail); border-color: #5a2323; } .chip[data-verdict="fail"] .dot { background: var(--lab-fail); }
.fit { position: relative; overflow: hidden; }
.scaled { transform-origin: top left; width: 1440px; }
body[data-width="mobile"] .scaled { width: 390px; }
.scaled .store { border: 1px solid var(--lab-line); }
</style>
</head>
<body data-mode="light" data-width="desktop">
<div class="app">
  <aside class="rail">
    <header>
      <h1>Composer · стенд-конструктор</h1>
      <span class="hint">Собери главную из вариантов коридора, сохрани под подписью. Сохранённые версии снимает <code>shoot.mjs</code>.</span>
    </header>
    <section class="g"><label>Бренд</label><div class="seg col" id="opt-brand"></div></section>
    <section class="g"><label>Режим</label><div class="seg row" id="opt-mode"></div></section>
    <section class="g"><label>Ширина</label><div class="seg row" id="opt-width"></div></section>
    <div id="slots"></div>
    <section class="g">
      <label>Версия</label>
      <input id="label" placeholder="Подпись, например «Kerbstone тёмный, K + список»" />
      <textarea id="note" placeholder="Заметка: зачем эта версия, что в ней смотреть"></textarea>
      <div class="actions">
        <button class="btnl primary" id="save">Сохранить версию</button>
        <button class="btnl" id="save-new" hidden>Сохранить как новую</button>
        <button class="btnl" id="unload" hidden>Сбросить</button>
      </div>
      <p class="err" id="err" hidden></p>
      <p class="ok" id="ok" hidden></p>
    </section>
    <section class="g">
      <label>Сохранённые версии · <span id="count">0</span></label>
      <ul class="versions" id="versions"></ul>
    </section>
    <footer class="hint">Съёмка всех несостоявшихся кадров: <code>node artifacts/docs/composer/shoot.mjs</code>. Реестр: <code>composer/versions.json</code>.</footer>
  </aside>
  <main class="stage">
    <div class="stagebar">
      <span id="title"></span>
      <span class="chip" id="chip" data-verdict="none"><span class="dot"></span>—</span>
      <span class="mono" id="zoom"></span>
      <a id="viewlink" href="/view" target="_blank" rel="noopener">открыть без рамки ↗</a>
    </div>
    <div class="fit" id="fit"><div class="scaled" id="scaled"></div></div>
  </main>
</div>

<script type="module">
import { esc, wireGalleries } from "/lib/blocks.js"
import { measure } from "/lib/measure.js"
import { SLOTS, MODES, WIDTHS, defaultSpec, validateSpec, composePage, afterRender, specLine } from "/lib/page.js"

const DATA = await (await fetch("/data.json")).json()
const $ = (id) => document.getElementById(id)
const brandOf = (id) => DATA.find((p) => p.id === id)
const state = { spec: defaultSpec(DATA[0]), loaded: null, versions: [] }

/* ---------- url ↔ state: #v=<id> for a saved version, #s=<spec> for an unsaved one ---------- */
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1))
  if (h.get("v")) return { loaded: h.get("v") }
  if (h.get("s")) {
    try {
      const spec = JSON.parse(h.get("s"))
      if (!validateSpec(spec, DATA)) return { spec }
    } catch {}
  }
  return {}
}
const writeHash = () => history.replaceState(null, "", state.loaded ? `#v=${state.loaded}` : `#s=${encodeURIComponent(JSON.stringify(state.spec))}`)

/* ---------- the rail ---------- */
const pressed = (root, key) => { for (const b of root.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === key)) }
$("opt-brand").innerHTML = DATA.map((p) => `<button data-v="${p.id}"><span class="k">${esc(p.id.slice(0, 3))}</span>${esc(p.brand.name)}</button>`).join("")
$("opt-mode").innerHTML = MODES.map((m) => `<button data-v="${m}">${m}</button>`).join("")
$("opt-width").innerHTML = WIDTHS.map((w) => `<button data-v="${w.key}">${w.name}</button>`).join("")
$("slots").innerHTML = SLOTS.map((s) => `<section class="g"><label>${esc(s.name)}</label><div class="seg col" id="opt-${s.key}">${s.options
  .map((o) => `<button data-v="${o.key}" title="${esc(o.why ?? "")}"><span class="k">${esc(o.key.toUpperCase())}</span>${esc(o.name.replace(/^[A-Z0-9]+ · /, ""))}</button>`)
  .join("")}</div></section>`).join("")

for (const key of ["brand", "mode", "width", ...SLOTS.map((s) => s.key)]) {
  $(`opt-${key}`).addEventListener("click", (event) => {
    const button = event.target.closest("button")
    if (!button || button.disabled) return
    state.spec[key] = button.dataset.v
    if (key === "brand") state.spec.mode = brandOf(button.dataset.v).defaultMode
    render()
  })
}

/* ---------- the stage ---------- */
let ro = null
function fitScale() {
  const store = $("scaled").querySelector(".store")
  if (!store) return
  const width = state.spec.width === "mobile" ? 390 : 1440
  const scale = Math.min(1, ($("fit").clientWidth - 2) / width)
  $("scaled").style.transform = `scale(${scale})`
  $("fit").style.height = `${Math.ceil(store.offsetHeight * scale) + 2}px`
  $("zoom").textContent = `${width} px · ×${scale.toFixed(2)}`
}
window.addEventListener("resize", fitScale)

function render() {
  const p = brandOf(state.spec.brand)
  document.body.dataset.mode = state.spec.mode
  document.body.dataset.width = state.spec.width
  pressed($("opt-brand"), state.spec.brand); pressed($("opt-mode"), state.spec.mode); pressed($("opt-width"), state.spec.width)
  for (const s of SLOTS) pressed($(`opt-${s.key}`), state.spec[s.key])
  // hero L needs a frame with a person or a room; a brand without one gets the lab's honest "missing" panel
  $("opt-hero").querySelector('[data-v="l"]').title = p.frames.person.length || p.frames.room.length ? "" : `У ${p.brand.name} нет кадра с человеком или в среде — вариант покажет пустую панель`
  $("scaled").innerHTML = composePage(p, state.spec)
  $("title").innerHTML = `<b>${esc(p.brand.name)}</b> · ${esc(state.spec.mode)} · <span class="mono">${esc(specLine(state.spec))}</span>${state.loaded ? ` · <span class="mono">${esc(state.loaded)}</span>` : ""}`
  $("viewlink").href = state.loaded ? `/view?v=${encodeURIComponent(state.loaded)}` : `/view?s=${encodeURIComponent(JSON.stringify(state.spec))}`
  $("save").textContent = state.loaded ? `Обновить ${state.loaded}` : "Сохранить версию"
  $("save-new").hidden = !state.loaded
  $("unload").hidden = !state.loaded
  writeHash()
  ro?.disconnect()
  ro = new ResizeObserver(fitScale)
  ro.observe($("scaled").querySelector(".store"))
  requestAnimationFrame(() => {
    afterRender($("scaled")).then(fitScale)
    const out = measure($("scaled").querySelector(".store"), $("scaled").querySelector(".store"))
    const chip = $("chip")
    chip.dataset.verdict = out.verdict
    chip.innerHTML = `<span class="dot"></span>${esc(out.text)}`
    fitScale()
  })
  renderVersions()
}
wireGalleries($("scaled"))

/* ---------- saved versions ---------- */
const say = (id, text) => { $("err").hidden = id !== "err"; $("ok").hidden = id !== "ok"; $(id).textContent = text }
async function call(method, path, body) {
  const res = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined })
  const out = await res.json()
  if (!res.ok) throw new Error(out.error ?? `${res.status}`)
  return out
}
async function loadVersions() {
  state.versions = (await call("GET", "/api/versions")).versions
  renderVersions()
}
const shotState = (v) => (!v.shots.png ? ["none", "кадр не снят"] : v.shots.png.stale ? ["stale", `кадр снят ${v.shots.png.at.slice(0, 16)}, до последней правки`] : ["fresh", `кадр снят ${v.shots.png.at.slice(0, 16)}`])
function renderVersions() {
  $("count").textContent = String(state.versions.length)
  if (!state.versions.length) {
    $("versions").innerHTML = `<li class="empty">Пока ничего не сохранено</li>`
    return
  }
  $("versions").innerHTML = [...state.versions].reverse().map((v) => {
    const [s, title] = shotState(v)
    const p = brandOf(v.spec.brand)
    return `<li class="ver${v.id === state.loaded ? " on" : ""}" data-id="${v.id}">
      <div class="top"><span class="lbl" data-lbl>${esc(v.label)}</span><span class="dot" data-s="${s}" title="${esc(title)}"></span></div>
      <div class="meta mono">${esc(v.id)}</div>
      <div class="meta mono">${esc(p?.brand.name ?? v.spec.brand)} · ${esc(v.spec.mode)} · ${v.spec.width === "mobile" ? 390 : 1440} · ${esc(specLine(v.spec))}</div>
      ${v.note ? `<div class="note">${esc(v.note)}</div>` : ""}
      <div class="meta">${esc(v.updatedAt.slice(0, 16).replace("T", " "))}${v.shots.webp ? ` · карточка ${v.shots.webp.stale ? "устарела" : "готова"}` : ""}</div>
      <div class="acts"><button data-act="load">открыть</button><a href="/view?v=${encodeURIComponent(v.id)}" target="_blank" rel="noopener">без рамки ↗</a><button data-act="rename">переименовать</button><button data-act="del" class="danger">удалить</button></div>
    </li>`
  }).join("")
}
$("versions").addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-act]")
  if (!button) return
  const li = button.closest(".ver")
  const v = state.versions.find((x) => x.id === li.dataset.id)
  if (button.dataset.act === "load") {
    state.spec = structuredClone(v.spec); state.loaded = v.id
    $("label").value = v.label; $("note").value = v.note ?? ""
    say("ok", `Открыта ${v.id}`)
    render()
  }
  if (button.dataset.act === "rename") {
    const holder = li.querySelector("[data-lbl]")
    if (holder.querySelector("input")) return
    holder.innerHTML = `<input value="${esc(v.label)}" />`
    const input = holder.querySelector("input")
    input.focus(); input.select()
    const done = async (commit) => {
      if (commit && input.value.trim() && input.value.trim() !== v.label) {
        try { await call("PUT", `/api/versions/${v.id}`, { label: input.value.trim() }); if (state.loaded === v.id) $("label").value = input.value.trim() } catch (error) { say("err", error.message) }
      }
      await loadVersions()
    }
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false) })
    input.addEventListener("blur", () => done(true))
  }
  if (button.dataset.act === "del") {
    // two clicks, three seconds apart at most — no modal (rule 22f), no accidental loss
    if (button.dataset.armed !== "1") {
      button.dataset.armed = "1"; button.textContent = "точно удалить?"
      setTimeout(() => { button.dataset.armed = ""; button.textContent = "удалить" }, 3000)
      return
    }
    try {
      await call("DELETE", `/api/versions/${v.id}`)
      if (state.loaded === v.id) { state.loaded = null; render() }
      say("ok", `Удалена ${v.id}; кадры в shots/ оставлены`)
      await loadVersions()
    } catch (error) { say("err", error.message) }
  }
})
async function save(asNew) {
  const label = $("label").value.trim()
  if (!label) return say("err", "Подпись обязательна: по ней версия ищется и получает id")
  try {
    const body = { label, note: $("note").value, spec: state.spec }
    const isUpdate = Boolean(state.loaded) && !asNew
    const v = isUpdate ? await call("PUT", `/api/versions/${state.loaded}`, body) : await call("POST", "/api/versions", body)
    state.loaded = v.id
    say("ok", `${isUpdate ? "Обновлена" : "Сохранена"} ${v.id}`)
    await loadVersions()
    render()
  } catch (error) { say("err", error.message) }
}
$("save").addEventListener("click", () => save(false))
$("save-new").addEventListener("click", () => save(true))
$("unload").addEventListener("click", () => { state.loaded = null; $("label").value = ""; $("note").value = ""; say("ok", "Версия отвязана: правки не трогают сохранённое"); render() })

/* ---------- boot ---------- */
await loadVersions()
const fromUrl = readHash()
if (fromUrl.loaded) {
  const v = state.versions.find((x) => x.id === fromUrl.loaded)
  if (v) { state.spec = structuredClone(v.spec); state.loaded = v.id; $("label").value = v.label; $("note").value = v.note ?? "" }
} else if (fromUrl.spec) state.spec = fromUrl.spec
render()
</script>
</body>
</html>
