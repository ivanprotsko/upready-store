(публичный маршрут регистрации, см. `middlewares.ts`), домены —\n  `POST /tenants/domains`, дом главной — `PUT /tenants/home`.\n\n## Оговорка про сам адрес (решать в начале работы)\n\n`shiftship.dev` (это домен-двойник нашего `shipshift.dev`) сейчас отдаёт 502 не из-за нас:\n`/data/coolify/proxy/dynamic/0ui-custom-shiftship.dev.yml` — файл upready studio, `priority: 100`,\nсервис `upready-studio-api`, контейнер в статусе `Exited (137)`. Ночью 12.09 по решению Ивана (в)\nмы СНЯЛИ свои роутеры с этого хоста и вернули его студии. Чтобы разместить там демо, хост нужно\nзабрать обратно — то есть поднять приоритет НАШЕГО роутера выше 100 (чужой файл не трогать, правило\nпро чужие проекты). Это ровно вариант (б), который был отклонён утром; новый заказ Ивана его\nпересматривает. Риск в одну строку: если студия поднимет свой контейнер, хост будет спорным —\nразводить приоритетами и сказать об этом Ивану.\n\n## Приёмка (правило 18f + 27d)\n\n- Живой продукт: `https://shiftship.dev` и `https://www.shiftship.dev` открываются в браузере с\n  сертификатом, витрина сценариев видна глазами (скриншот — факт о файле, не вердикт).\n- Каждый из четырёх входов проходится ЦЕЛИКОМ от холодного старта до экрана онбординга с\n  настройками магазина; ни один не требует знать трюк.\n- Тестовая оплата действительно отклоняется на `0000…` и проходит на нормальном номере — оба исхода\n  показаны.\n- Прямая ссылка на онбординг работает отдельно от оплаты.\n- Дизайн-стадия перед кодом: канон Geist (`~/upready/packages/geist-kit/AGENTS.md`), макет назван в\n  задаче до начала вёрстки.\n"},{"id":"artifacts-docs-2026-09-12-paywall-onboarding-mockup-md","group":"demo-docs","path":"artifacts/docs/2026-09-12-paywall-onboarding-mockup.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/artifacts/docs/2026-09-12-paywall-onboarding-mockup.md","title":"Макет и приёмка","note":"восемь кадров, решения, критерии","bytes":8154,"text":"# Макет «оплата → онбординг» для shiftship.dev (дизайн-стадия, 2026-09-12)\n\nКанон — Geist (`file:///Users/ivanprotsko/upready/packages/geist-kit/AGENTS.md`). Кадры:\n`file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/artifacts/mockups/2026-09-12-paywall-onboarding/index.html`\n(открывается файлом, без сервера; переключение режима — класс `light` на `\u003chtml>`, как того требует\n`tokens.css`, где светлый блок написан как `:root.light`, а НЕ `[data-theme]`).\n\nТребования Ивана: `artifacts/docs/2026-09-12-paywall-onboarding-demo-requirements.md`.\n\n## 1. Восемь кадров и адреса\n\n| Кадр | Экран | Адрес |\n|---|---|---|\n| S1 | витрина четырёх сценариев + прямая ссылка в онбординг | `/start` |\n| S2 | выбор услуги (сценарии 2 и 4) | `/start/service?f=2` / `?f=4` |\n| S3 | выбор тарифа (сценарии 2 и 3) | `/start/plan?f=2&s=…` / `?f=3` |\n| S4 | тестовая оплата (все четыре) | `/start/pay?f=…&s=…&p=…` |\n| S4b | отказ банка — состояние S4, не отдельная страница | там же |\n| S5 | онбординг, шаг 1: название + адрес магазина | `/start/onboarding` |\n| S6 | онбординг, шаг 2: почта + пароль владельца | там же, шаг клиентский |\n| S7 | онбординг, шаг 3: пресет темы + режим | там же |\n| S8 | магазин создан — рабочие ссылки на витрину и панель | там же |\n\nВоронка кодируется параметрами (`f` — сценарий, `s` — услуга, `p` — тариф), а не четырьмя копиями\nвёрстки: S2/S3/S4 — одни и те же страницы с разной подписью шагов. Четыре входа отличаются ПУТЁМ,\nа не дизайном, и это главное решение макета.\n\n## 2. Решения, которые макет принимает\n\n- **Сетка 2×2 на витрине, ни один вход не выделен.** Иван сравнивает четыре формы воронки, а не\n  выбирает «правильную»; выделенная карточка навязала бы ответ. Длина воронки показана цепочкой\n  чипов (`услуга → тариф → оплата → онбординг`) — видно до клика, сколько шагов впереди.\n- **Строка-опция вместо карточки на S2/S3.** Три варианта читаются одним движением сверху вниз,\n  цена выровнена справа моноширинным `tabular-nums` (канон: моно на всех данных).\n- **Адрес магазина — поле с приклеенным суффиксом `.shipshift.dev`.** Человек видит будущий URL\n  целиком и не может ввести чужой формат; значение предлагается транслитерацией названия и\n  остаётся правимым.\n- **Свотч темы — три полосы реальных значений пресета** (фон / чернила / акцент), не картинка.\n- **Финальный экран отдаёт рабочие ссылки, а не поздравление**, и прямо называет пустой каталог:\n  обещать наполненную витрину и показать пустую — хуже, чем предупредить (правило 20a).\n- **Русский язык, вне `[locale]`.** Демо живёт отдельным сегментом `/start`, не проходит через\n  локальный роутинг витрины и не тянет next-intl: это тестовый стенд для Ивана, а не магазин.\n\n## 3. Поправка к требованиям: правило тестовой карты\n\nДокумент требований говорит «отклоняет оплату по номеру, НАЧИНАЮЩЕМУСЯ с `0000`». В коде\n(`apps/storefront/src/modules/checkout/components/demo-card-fields/index.tsx:98-106`) правило другое\nи по СУФФИКСУ:\n\n```\nclassifyDemoCard: digits.endsWith(\"0000\") → decline\n                  digits.endsWith(\"9999\") → redirect (подтверждение банка)\n                  иначе                    → approve\n```\n\nплюс `numberLooksValid`: 13–19 цифр и проверка Луна, которую два документированных суффикса\nпропускают намеренно. Демо берёт ЭТИ функции (чистые, экспортируемые), а не переписывает правило;\nв макете и в подсказке на экране написан суффикс.\n\n## 4. Что демо делает по-настоящему\n\nОнбординг — не заглушка. Продуктовый путь, который уже работает на этом бэкенде:\n\n1. `POST /auth/tenant/emailpass/register` `{email, password}` → регистрационный JWT;\n2. `POST /tenants` с этим токеном, тело `{name, handle, admin:{email}}` (валидатор\n   `PostTenantCreateSchema`) → 201, тенант + sales channel + публичный ключ;\n3. `POST /auth/tenant/emailpass` → сессионный токен владельца;\n4. `PUT /tenants/home` `{theme:{preset}}` → пресет применяется к витрине.\n\nДальше `mt-ingress-sync` сам публикует `\u003chandle>.shipshift.dev` (интервал 15 с) и traefik выпускает\nсертификат — замер ночи 1: домен → рабочий https за 70 с. Поэтому S8 честно пишет «сертификат\nвыпускается, обычно около минуты», а не «готово».\n\nОплата настоящей НЕ становится: денег нет, провайдера нет, вебхуков нет. Демо-касса — это состояние\nв подписанной куке сценария, и S8 отличает «оплачено» от «вошёл прямой ссылкой».\n\n## 5. Приёмка (правило 18f + 27d)\n\nГлазами в браузере, с холодного старта, на `https://shiftship.dev` и `https://www.shiftship.dev`:\n\n1. **Человеческий критерий.** Витрина S1 выглядит как один продукт, а не четыре чужих блока:\n   карточки одной высоты, кнопки на одной линии, ни один вход не кричит громче других. Смотрю\n   сам и показываю Ивану кадр.\n2. Каждый из четырёх входов пройден ЦЕЛИКОМ до S8; ни один не требует знать трюк.\n3. Карта с суффиксом `0000` даёт S4b (отказ виден на экране), `4242 4242 4242 4242` проходит —\n   оба исхода показаны.\n4. Прямая ссылка `/start/onboarding` работает без оплаты и доводит до S8.\n5. Созданный в онбординге магазин ОТКРЫВАЕТСЯ по своему адресу `\u003chandle>.shipshift.dev` — это\n   проверка того, что онбординг настоящий.\n6. Светлый и тёмный режимы проверены ОБА, кадрами выше сгиба (правило 18f: названный режим —\n   координата, в которую надо зайти).\n"}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("payload").textContent)
  var side = document.getElementById("side")
  var main = document.getElementById("main")

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }

  // ---- live links -------------------------------------------------------
  data.linkGroups.forEach(function (group) {
    var h = el("h2", null, group.title); side.appendChild(h)
    group.links.forEach(function (link) {
      var a = el("a", null, link.label); a.href = "#" + group.id; side.appendChild(a)
    })
    var section = el("section"); section.id = group.id
    section.appendChild(el("h2", "block", group.title))
    section.appendChild(el("p", "lede", group.lede))
    var cards = el("div", "cards")
    group.links.forEach(function (link) {
      var a = el("a", "card"); a.href = link.href; a.target = "_blank"; a.rel = "noreferrer"
      var left = el("span")
      left.appendChild(el("span", "label", link.label))
      left.appendChild(document.createElement("br"))
      left.appendChild(el("span", "url", link.href))
      a.appendChild(left)
      a.appendChild(el("span", "note", link.note))
      cards.appendChild(a)
    })
    section.appendChild(cards)
    main.appendChild(section)
  })

  // ---- documents --------------------------------------------------------
  data.docGroups.forEach(function (group) {
    var mine = data.docs.filter(function (d) { return d.group === group.id })
    if (!mine.length) return
    side.appendChild(el("h2", null, group.title))
    mine.forEach(function (doc) { var a = el("a", null, doc.title); a.href = "#" + doc.id; side.appendChild(a) })
    main.appendChild(el("h2", "block", group.title))
    mine.forEach(function (doc) {
      var section = el("section"); section.id = doc.id
      var meta = el("div", "docmeta")
      meta.appendChild(el("strong", null, doc.title))
      meta.appendChild(el("span", "note", doc.note))
      var code = el("code", null, doc.file); meta.appendChild(code)
      section.appendChild(meta)
      var body = el("div", "doc")
      try {
        body.innerHTML = marked.parse(doc.text)
      } catch (e) {
        // No renderer (offline) is not "no document": show the source rather than a void.
        var pre = el("pre"); pre.appendChild(el("code", "fallback", doc.text)); body.appendChild(pre)
      }
      // ```mermaid fences land as <pre><code class="language-mermaid">; mermaid wants
      // its own <pre class="mermaid"> with the raw text.
      Array.prototype.forEach.call(body.querySelectorAll("code.language-mermaid"), function (code) {
        var pre = code.parentNode
        var holder = el("pre", "mermaid", code.textContent)
        pre.parentNode.replaceChild(holder, pre)
      })
      section.appendChild(body)
      main.appendChild(section)
    })
  })

  // ---- mode + diagrams --------------------------------------------------
  var root = document.documentElement
  var button = document.getElementById("mode")
  function label() { button.textContent = root.getAttribute("data-mode") === "dark" ? "светлый режим" : "тёмный режим" }
  try { var saved = localStorage.getItem("mt-links.mode"); if (saved === "light" || saved === "dark") root.setAttribute("data-mode", saved) } catch (e) {}
  label()
  button.addEventListener("click", function () {
    var next = root.getAttribute("data-mode") === "dark" ? "light" : "dark"
    root.setAttribute("data-mode", next)
    try { localStorage.setItem("mt-links.mode", next) } catch (e) {}
    label()
    if (window.mermaid) { location.reload() }
  })

  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: root.getAttribute("data-mode") === "dark" ? "dark" : "default" })
    mermaid.run({ querySelector: ".mermaid" }).catch(function () {})
  }

  // ---- which section am I in -------------------------------------------
  var links = Array.prototype.slice.call(side.querySelectorAll("a"))
  var sections = Array.prototype.slice.call(main.querySelectorAll("section"))
  function mark() {
    var top = window.scrollY + 80, current = null
    sections.forEach(function (s) { if (s.offsetTop <= top) current = s.id })
    links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + current) })
  }
  window.addEventListener("scroll", mark, { passive: true })
  mark()
})()
</script>
</body>
</html>
