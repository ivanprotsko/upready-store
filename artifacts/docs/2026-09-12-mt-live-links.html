`orders` (6) | 7 744 | \\~1291 байт/заказ |\n| `products` (9) | 5 799 | \\~644 байт/товар |\n| `customers` (4) | 1 029 | \\~257 байт/клиент |\n| `api_key` | 164 | фикс |\n| `manifest` | 162 | фикс |\n| `regions` (1) | 119 | \\~119 байт/регион |\n| `admins` (1) | 108 | \\~108 байт/админа |\n| `tenant` | 85 | фикс |\n| `source` | 73 | фикс |\n| `sales_channel` | 72 | фикс |\n| `format`/`exported_at`/`pages`/пустые (`inventory`/`categories`/`collections`/`files`) | 62 | фикс |\n\n**`inventory`/`categories`/`collections`/`files` на стенде равны нулю** (реальное состояние acme,\nобъяснено в `tenant-bundle-format.md`), поэтому байт/единицу для них измерить НЕЧЕМ — этого числа в\nспеке нет, потому что его неоткуда взять, а не потому что забыли.\n\n**Формула** (json, без сжатия), при типовых `admins=2`, `regions=1`, `stock_locations=1`,\nклиенты ≈ 0.667×заказов (соотношение бандла acme, 4/6):\n\n```\nbytes_json(P, O) ≈ 34 207 + 644×P + 1462×O\n```\n\nгде `34 207` = фикс + `warehouse` + 2 админа + 1 регион, `1462` = 1291 (заказ) + 257×0.667 (доля\nклиента на заказ). Гзип на стенде даёт коэффициент `11433 / 48886 = 0.234` — тот же коэффициент\nприменён ниже; структура данных однородная (повторяющиеся объекты), так что коэффициент не должен\nсильно плыть с размером, но это тоже не измерено на большем бандле, а перенесено с одной точки.\n\n| Товаров | Заказов | bytes_json | bytes_gz (×0.234) |\n|---|---|---|---|\n| 10 | 0 | \\~40.6 KB | \\~9.5 KB |\n| 10 | 1 000 | \\~1.50 MB | \\~0.35 MB |\n| 10 | 10 000 | \\~14.7 MB | \\~3.4 MB |\n| 100 | 0 | \\~98.6 KB | \\~23 KB |\n| 100 | 1 000 | \\~1.56 MB | \\~0.37 MB |\n| 100 | 10 000 | \\~14.7 MB | \\~3.4 MB |\n| 1 000 | 0 | \\~678 KB | \\~159 KB |\n| 1 000 | 1 000 | \\~2.14 MB | \\~0.50 MB |\n| 1 000 | 10 000 | \\~15.3 MB | \\~3.4 MB |\n\n**Время** — ТОЛЬКО оценка, не замер под нагрузкой: 0.34с на стенде покрыли 22 «строки»\n(9 товаров + 6 заказов + 4 клиента + 1 админ + 1 регион + 1 склад) — наивная линейная модель\n(`22 / 0.34с ≈ 65 строк/с`) даёт:\n\n| Товаров | Заказов | Оценка времени (линейная, НЕ нагрузочный тест) |\n|---|---|---|\n| 10 | 0 | \\~0.2 с |\n| 100 | 1 000 | \\~27 с |\n| 1 000 | 10 000 | \\~4.6 мин |\n\nЭта модель предполагает, что `query.graph`-обход растёт линейно с числом строк — на 22 строках это\nне проверить, реальная зависимость может быть хуже линейной (JOIN-сложность, память) при 10 000+\nзаказов. **Перед тем как полагаться на ночной job для тенанта такого размера — нужен отдельный замер\nна бандле в 1000+ заказов**, это не сделано сегодня и не должно читаться как сделанное.\n\n## 4. Восстановление\n\nВосстановление = импорт бандла в ТОТ ЖЕ инстанс (raннбук `detach-spec.md` §2, БЕЗ шага 0 —\nпровижининга — инстанс уже есть), с семантикой **replace = upsert по оригинальному id, никогда не\nwipe-then-insert**. Это принципиально: на том же инстансе id из бандла совпадают с id в текущей БД\n(это не detach в новый инстанс, где id перевыпускаются), поэтому «заменить» товар/клиента/заказ —\nзначит обновить существующую строку значениями из бандла, а НЕ удалить весь набор сущностей тенанта\nи вставить заново — иначе восстановление случайно стирает легитимные строки, созданные ПОСЛЕ\nбэкапа.\n\nСемантика replace по сущностям:\n- **products/variants/prices** — upsert по id из бандла (нативных «restore»-workflow нет — сценарий\n  ближе к detach-раннбуку шага 4, но с `updateProductsWorkflow`/`upsert` вместо `create`, когда id\n  уже существует).\n- **inventory** — upsert `stocked_quantity`/`reserved_quantity` по `location_levels` бандла.\n- **customers** — upsert контактных данных/адресов; пароли не трогаются (бандл их не несёт).\n- **orders** — restore заказов = тот же вывод, что в `detach-spec.md` §3: нативного импорта нет,\n  восстановление истории заказов из per-tenant бэкапа — это чтение CSV-архива вручную, не\n  автоматический upsert (риск переиграть платёжный/fulfillment-граф вслепую — заказ не «просто\n  строка», у него собственный workflow-движок изменений).\n- **files** — см. раздел 1: бандл несёт только список `{key,url,size}`, не байты. «Восстановить\n  файлы из per-tenant бэкапа» физически невозможно этим артефактом — байты идут из платформенного\n  яруса 3 (restic → R2 всего bucket). Per-tenant бэкап здесь полезен только как **сверочный список**\n  (раздел 5): какие ключи должны существовать.\n\n**Случай soft-deleted тенанта** (`DELETE /admin/tenants/:id` без `purge_files`, контракт §4),\nслучайное удаление — что нужно откатить:\n\n1. **Un-archive**: `tenant.metadata.archived_at = null` (тот же module service, `updateTenants`,\n   что использует шаг 1 `deleteTenantWorkflow` — но не через compensation воркфлоу, компенсация\n   срабатывает только внутри падающего запуска; здесь нужен отдельный маленький «un-archive» шаг/\n   скрипт, вызывающий ту же module-service-функцию в обратную сторону).\n2. **Канал**: `updateSalesChannelsWorkflow.runAsStep({ is_disabled: false })`.\n3. **Ключ**: публикуемые ключи **нельзя «раз-отозвать»** — проверено по\n   `@medusajs/types` 2.19.0 (`api-key/mutations/api-key.d.ts`): `UpdateApiKeyDTO` несёт только\n   `title`, никакого поля для снятия `revoked_at`; отдельного un-revoke workflow в `core-flows` нет.\n   Значит восстановление ключа — это **новый** ключ (`createApiKeysWorkflow` + линковка к тенанту,\n   тот же путь, что при первом создании тенанта), а не реанимация старого. Практическое следствие:\n   витрина/интеграции тенанта, у которых старый публикуемый ключ зашит в конфиг, должны получить\n   новый — это не развилка (альтернативы физически нет), а операционный шаг восстановления, который\n   нужно проговорить с клиентом заранее.\n4. **Вход админов**: закрывается мидлварью по `archived_at` (контракт §4) — шаг 1 автоматически\n   открывает его обратно, отдельного действия не требуется.\n5. **Файлы**: при `purge_files=false` (дефолт) — ничего восстанавливать не нужно, объекты никуда не\n   делись (контракт §4, шаг 4 delete-workflow вообще не выполнялся). При `purge_files=true` — байты\n   не восстановимы per-tenant бэкапом (раздел 1); единственный путь — платформенный ярус 3\n   (restic-снапшот бакета на дату до удаления), отдельная операция вне этой спеки.\n\n## 5. Проверка бэкапа\n\nЕжемесячный restore drill в одноразовую БД: интеграционный раннер (`@medusajs/test-utils`,\n`node_modules/.pnpm/@medusajs+test-utils@2.19.0.../dist/database.js`) уже умеет поднимать и сносить\nодноразовую БД программно (`createDatabase`/`dropDatabase` из `medusa-test-runner-utils`, тот же\nмеханизм, что использует `pnpm test:integration:http` для каждого прогона) — drill переиспользует\nэтот механизм, не пишет свой.\n\nШаги: раз в месяц (cron/ручной запуск) — поднять throwaway БД → прогнать `medusa db:migrate` на ней\n→ восстановить один случайный НЕ-архивный тенант из его последнего ночного бэкапа по раннбуку\nраздела 4 (в create-режиме, т.к. throwaway БД пуста — фактически это detach-раннбук §2 без шага 0,\nне restore-upsert, потому что restore-upsert по определению требует существующих строк) → сверить\n`manifest.counts` бэкапа с фактическими счётчиками на throwaway БД → снести БД.\n\n**Приёмка** = совпадение счётчиков; расхождение — сигнал, что либо `exportTenantWorkflow`, либо\nимпорт-раннбук сломан молча, раньше, чем это обнаружится на реальном инциденте.\n\n## 6. Развилки\n\nРазвилок нет — оба решения в разделе 2 (место в R2, формат job'а) и в разделе 4 (upsert-семантика,\nпереиздание ключа вместо un-revoke) приняты и обоснованы фактами кода/правил выше, альтернатив,\nкоторые стоило бы отдавать Ивану на утро, не осталось. Единственное, что действительно ждёт\nвнешнего решения — часовой пояс сервера для cron-строки (раздел 2) и живой канал алертов (раздел 2)\n— но это не развилки ЭТОЙ спеки, а прямые следствия ещё не решённого 7.4 (`hosting-spec.md`),\nдублировать вопрос здесь не нужно.\n"},{"id":"docs-multitenancy-detach-spec-md","group":"specs","path":"docs/multitenancy/detach-spec.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/detach-spec.md","title":"Отсоединение","note":"магазин уходит со своим содержимым","bytes":19831,"text":"# Отсоединение тенанта в standalone Medusa (7.2)\n\nАвтор: W5 (ночь платформы, 11→12.09.2026). Спека, код не пишется. Опирается на экспортный бандл\n`upready.tenant-bundle/v1` (owner W3, `docs/multitenancy/tenant-bundle-format.md`), на контракт\n`docs/multitenancy/admin-tenants-api-contract.md` §4/§5 и на `@medusajs/*` 2.19.0 в `node_modules`\nэтого ворктри (версии и наличие workflow проверены по коду, не по памяти — источники ниже).\n\n## 1. Что такое standalone\n\nStandalone — отдельный инстанс Medusa 2.19 (та же версия, что у платформы), со своей БД, своей\nродной админкой (`:9xxx/app`, без «Магазины» — этого расширения там нет) и своим деплоем витрины.\nВладеет им клиент: свой сервер/хостинг, свои креды, свой домен.\n\n**Что клиент получает:**\n- Полноценную родную админку Medusa (Settings, Users, Promotions, всё, что платформенная панель\n  сознательно не показывает тенантам).\n- Полный контроль над инфраструктурой: может менять план хостинга, провайдера оплаты, добавлять\n  собственные модули/расширения.\n- Данные физически переезжают в его собственность — платформа их больше не хранит после переноса\n  файлов (раздел 4) и переключения DNS (раздел 5).\n\n**Что клиент теряет:**\n- Платформенную панель («Магазины» в шапке администратора upready) и всё, что она даёт бесплатно:\n  общий рефе́ренс-код, бесплатные обновления Medusa при апдейте платформы, единый биллинг.\n- Автоматические обновления — с этого момента патчи/мажорные апгрейды Medusa клиент организует сам\n  (или как платная услуга upready).\n- Общий backup-контур платформы (правило 42a) — если не купит per-instance бэкап отдельно.\n\n## 2. Шаги переноса — раннбук\n\nИсточник данных на каждом шаге — экспортный бандл (`POST /admin/tenants/:id/export` или\n`node scripts/tenant-export.mjs \u003chandle>`). Скрипт переноса читает bundle.json один раз и держит\n**карту id**: `Map\u003cстарый_id, новый_id>` per сущность (`products`, `variants`, `customers`,\n`regions`, `categories`, `collections`, `stock_locations`, `shipping_options`), пишет её построчно в\n`import-log-\u003chandle>-\u003cdate>.jsonl` (не только в памяти — процесс может упасть на середине,\nлог позволяет докатить с места обрыва).\n\n| # | Шаг | Как (нативно / вручную-скриптом) | Ремаппинг id |\n|---|---|---|---|\n| 0 | Провижининг инстанса | Репозиторий-шаблон Medusa 2.19 (тот же, что использует платформа), `.env` (новая БД, новый `COOKIE_SECRET`/`JWT_SECRET`), `medusa db:migrate`, первый админ через `npx medusa user -e \u003cemail> -p \u003cpass>` — **всё вручную/скриптом**, Medusa не «импортирует» инстанс целиком. | — |\n| 1 | Регионы | `createRegionsWorkflow` (`@medusajs/core-flows`, `region/workflows/create-regions.js` — нативно, нужны страны/валюта/налоговая ставка из `bundle.regions`, это reference-данные, не строки тенанта, см. `tenant-bundle-format.md` «Что означает reference data»). | старый `region_id` → новый |\n| 2 | Профиль доставки + склад | `createShippingProfilesWorkflow` → `createStockLocationsWorkflow` → `createLocationFulfillmentSetWorkflow` → `createServiceZonesWorkflow` → `createShippingOptionsWorkflow` (все — `@medusajs/core-flows/dist/fulfillment/workflows/*` и `stock-location/workflows/*`, нативно; вход строится из `bundle.warehouse.stock_locations[0]` — адрес, fulfillment sets, service zones, опции доставки с ценами). | `stock_location_id`, `shipping_option_id` |\n| 3 | Категории / коллекции | `createProductCategoriesWorkflow`, `createCollectionsWorkflow` (`core-flows/dist/product-category` и `.../product`, нативно) из `bundle.categories` / `bundle.collections`. | `category_id`, `collection_id` |\n| 4 | Товары + варианты + цены | Нативно: `createProductsWorkflow` (`core-flows/dist/product/workflows/create-products.js`) — вызывается скриптом построчно по `bundle.products`, т.к. источник JSON, а не CSV (альтернатива — сконвертировать в CSV и прогнать `importProductsWorkflow`, но это лишний конвертирующий шаг без выгоды: `importProductsWorkflow` асинхронный, двухфазный — «start» + подтверждение через Workflow Engine — см. `artifacts/research/2026-09-11-detach-backup/source-1-import-products-workflow.md`). Ремап `category_id`/`collection_id` из шага 3 при создании. | `product_id`, `variant_id` |\n| 5 | Инвентарь | `createInventoryItemsWorkflow` + `createInventoryLevelsWorkflow` (`core-flows/dist/inventory/workflows`, нативно) из `bundle.inventory`, привязка к `stock_location_id` из шага 2 и `variant_id` из шага 4. | `inventory_item_id` |\n| 6 | Клиенты | `createCustomersWorkflow` + `createAddressesWorkflow` (`core-flows/dist/customer/workflows`, нативно) из `bundle.customers`. Пароль не переносится (bundle никогда не содержит хеш, см. формат) — клиент получает приглашение сменить пароль или логинится заново через emailpass-регистрацию. | `customer_id` |\n| 7 | Файлы | Нет нативного workflow для «скопировать чужой bucket» — **вручную/скриптом**, раздел 4. | — |\n| 8 | Заказы | Нативного импорта нет (проверено, раздел 3) — **вручную/скриптом**, ограниченно. | — |\n\nПорядок шагов 1→8 обязателен: 4 зависит от 1–3, 5 от 2 и 4, 8 (если делается) — от 1, 2, 4, 6.\n\n## 3. Заказы\n\nПроверено по коду и докам (не по памяти): в `@medusajs/core-flows` 2.19.0 каталог\n`dist/order/workflows` содержит `create-order.js` (создание **одного** заказа, ручной draft-order флоу)\nи `export-orders.js` (экспорт), но файла `import-orders*` там нет — при том, что соседние модули\n(`product`) отдельно несут `import-products*`. Документация Order-модуля Medusa тоже не описывает\nbulk/CSV-импорт заказов (см. `artifacts/research/2026-09-11-detach-backup/source-2-order-module-no-import.md`).\nЗначит: **нативного способа импортировать историю заказов в новый инстанс нет**.\n\nВарианты:\n\n1. **CSV-архив для клиента** (по умолчанию, входит в цену переноса). Скрипт разворачивает\n   `bundle.orders` в плоский CSV/несколько CSV (заказы, позиции, платежи) — годится как бухгалтерский\n   архив и для ручного ввода отдельных заказов через родную админку, но НЕ восстанавливает историю\n   заказов как живые записи в новой БД (клиент их не увидит в разделе Orders).\n2. **Прямой перенос строк БД** — платная услуга. Таблицы (проверено по\n   `node_modules/@medusajs/order/dist/models`, пакет `@medusajs/order` 2.19.0): `order`, `order_item`,\n   `order_change` (+`order_change_action`), `order_summary`, `address`, `line_item`\n   (+`line_item_adjustment`, +`line_item_tax_line`), `shipping_method`\n   (+`shipping_method_adjustment`, +`shipping_method_tax_line`), `order_shipping_method`,\n   `credit_line`, `transaction`, `claim` (+`claim_item`, +`claim_item_image`), `exchange`\n   (+`exchange_item`), `return` (+`return_item`), `return_reason`. Плюс связанные по order id таблицы\n   двух других модулей, которые бандл уже разворачивает целиком (см. `tenant-bundle-format.md`,\n   раздел `orders`): `@medusajs/payment` (`payment_collection`, `payment`, `refund`, `capture`) и\n   `@medusajs/fulfillment` (`fulfillment` + связанные). Перенос — `pg_dump --table=\u003ct> --data-only` по\n   каждой таблице с фильтром по `order_id IN (...)` на новую БД той же версии схемы, вручную проверить\n   последовательности (id-генераторы Medusa — `ulid`, коллизий не будет) и внешние ключи на\n   `customer_id`/`region_id`/`product_id` из шагов 1–6.\n3. **Рекомендация**: вариант 1 по умолчанию (входит в базовую цену переноса, раздел 8), вариант 2 —\n   отдельная платная услуга по запросу клиента (он редко нужен: заказы — история, не операционные\n   данные нового магазина).\n\n## 4. Файлы\n\n`tenants/\u003cid>/` — префикс объектов в текущем bucket (контракт §5). Перенос:\n\n- `rclone copy` (или SDK S3, если rclone недоступен на целевой машине) из\n  `s3://\u003cплатформенный bucket>/tenants/\u003cid>/` в `s3://\u003cbucket клиента>/` — БЕЗ префикса `tenants/\u003cid>/`\n  на новой стороне (это уже не мультитенантный bucket, префикс не нужен клиенту).\n- Ремап URL: каждый `product.images[].url` / `variant` thumbnail в бандле указывает на старый публичный\n  URL (`\u003cплатформенный domain или CDN>/tenants/\u003cid>/…`). Скрипт при выполнении шага 4 раннбука\n  (товары) переписывает `url` на новый (`\u003cдомен клиента>/\u003cтот же object key без tenant-префикса>`)\n  до вызова `createProductsWorkflow`, а не после — правка URL постфактум означала бы второй проход\n  по всем товарам.\n- Что остаётся на платформе: ничего специально не остаётся — после подтверждённого переноса (раздел\n  7) и до `purge_files=true` в `DELETE /admin/tenants/:id` файлы тенанта на платформенном bucket\n  считаются архивом переноса, а не рабочими данными; их удаление — обычный soft/hard delete тенанта,\n  тем же путём, что и для любого другого закрытия магазина (контракт §4), после согласованного окна\n  (раздел 5).\n\n## 5. Домен\n\n- До переноса тенант живёт на технической поддомене платформы (`\u003chandle>.upready.dev` или кастомный\n  домен, проксируемый платформой на общий backend — решение о wildcard-прокси относится к 7.4,\n  `docs/multitenancy/hosting-spec.md`).\n- Перенос: клиент (или upready по его просьбе) заводит DNS-запись (`A`/`CNAME`) на новый деплой,\n  TTL записи снижается до **300 с** минимум за 24 часа до переключения (стандартная практика смены\n  хостинга, чтобы окно пропагации не растягивалось на дни от старого TTL).\n- Окно перекрытия: старый (платформенный) и новый (standalone) инстансы держат идентичные данные\n  (бандл на момент шага 0 переноса) одновременно **72 часа** — платформенный инстанс отвечает\n  read-only (канал `is_disabled: true`, тот же механизм, что у soft delete, контракт §4, без отзыва\n  ключа сразу — иначе витрина 401 раньше времени) до истечения TTL-пропагации на всех резолверах,\n  затем платформенный поддомен ретируется (`archived_at` + отзыв ключа, штатный `deleteTenantWorkflow`).\n\n## 6. Что не переносится\n\n- Пароли админов/auth-идентичности — бандл никогда не содержит хеш (формат бандла, раздел `admins`);\n  админы standalone-инстанса заводятся заново (приглашение / временный пароль).\n- Подключения платёжных провайдеров (Stripe/etc. креды) — секреты, не экспортируются нигде.\n- Аналитика платформы (если появится) — платформенная телеметрия, не собственность тенанта.\n- Модели контент-страниц/home-config волны 2 панели (`feat/mt-panel-2`) — на этой ветке их нет\n  (`bundle.pages` всегда `null`, см. формат бандла); когда появятся на слитой ветке, экспорт/импорт\n  дооформляется отдельным пунктом, не эта спека задним числом.\n- История заказов как живые записи — раздел 3 (только CSV по умолчанию).\n\n## 7. Приёмка переноса\n\n- **Счётчики.** Для каждой сущности (`products`, `customers`, `orders`-CSV-строк, `categories`,\n  `collections`, `inventory`, `stock_locations`) — счётчик на новом инстансе равен\n  `manifest.counts` бандла минус явно исключённые в разделе 6 позиции.\n- **Витрина.** Страница товара открывается на новом домене (любой товар из бандла, случайная\n  выборка ≥3).\n- **Чекаут.** Оформление заказа с тестовым платежом на новом инстансе проходит от корзины до\n  подтверждения (провайдер оплаты клиента настроен заново — раздел 6).\n- **История заказов.** CSV-архив открывается и читаем (раздел 3, вариант 1) либо — если куплен\n  вариант 2 — заказы видны в родной админке нового инстанса с тем же количеством строк, что в\n  `manifest.counts.orders`.\n\n## 8. Цена и время\n\nОценка на бандле стенда (`tenant-acme-2026-09-11.json.gz`, товары 9, клиенты 4, заказы 6,\n`.ai/progress-w3.md`, `elapsed: 0.34s` — это время ЭКСПОРТА/чтения, не импорта; отдельная оценка\nвремени импорта ниже помечена как НЕ замерено — экстраполяция по числу workflow-вызовов, не\nнагрузочный тест).\n\n| Шаг | Кто | Оценка на стенд-бандле (9 товаров / 6 заказов / 4 клиента) |\n|---|---|---|\n| 0. Провижининг инстанса | инженер | 30–60 мин (репо-шаблон, `.env`, миграции, первый админ — большей частью сценарий, не с нуля) |\n| 1–2. Регионы + склад/доставка | скрипт | \u003c 1 мин (единичные workflow-вызовы, объём не зависит от каталога) |\n| 3. Категории/коллекции | скрипт | \u003c 1 мин на стенд-бандле (0 категорий/коллекций у acme); на 50 категорий — доли минуты |\n| 4. Товары+варианты+цены | скрипт | \\~1 мин на 9 товаров (оценка: каждый `createProductsWorkflow`-вызов — round-trip в БД с несколькими вставками; на стенде не замерено отдельно от экспорта) |\n| 5. Инвентарь | скрипт | \u003c 1 мин на стенд-бандле (0 позиций у acme) |\n| 6. Клиенты | скрипт | \u003c 1 мин на 4 клиента |\n| 7. Файлы | скрипт (`rclone`) | зависит от объёма файлов, не от их числа записей — на стенде `files: 0`, не из чего оценить; для непустого тенанта — пропускная способность `rclone`, обычно секунды на мегабайты |\n| 8. Заказы (CSV) | скрипт | \u003c 1 мин на 6 заказов |\n| 8. Заказы (DB-copy, платно) | инженер | 1–3 часа инженерного времени (ручная сверка FK, отдельная услуга, не автоматизируется сегодня) |\n| Итого автоматизируемая часть | скрипт | единицы минут на бандле такого размера — вся оценка ORDER OF MAGNITUDE, не нагрузочный тест |\n| Итого «под ключ» (без DB-copy заказов) | — | \\~1–2 часа с учётом провижининга, DNS, ручной проверки (раздел 7) |\n\nОценка НЕ линейно масштабируется на крупных тенантов без отдельного замера (провижининг и DNS —\nфиксированные, товары/клиенты/заказы — растут пропорционально бандлу); на бандл в 1000 товаров и\n10 000 заказов формула из `backup-spec.md` §3 даёт ориентир по размеру, но не по времени импорта —\nэто отдельный замер, не сделанный тонight.\n"},{"id":"docs-multitenancy-2026-09-11-night-2-platform-brief-md","group":"briefs","path":"docs/multitenancy/2026-09-11-night-2-platform-brief.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/2026-09-11-night-2-platform-brief.md","title":"Платформа","note":"бриф волны","bytes":15888,"text":"# Платформа: админка магазинов, онбординг после оплаты, эксплуатация тенантов (ночь 11→12.09.2026). Бриф архитектору-оркестратору\n\nАвтор: session_01HqysBVaN4S8qDwkauRQdvB, 11.09 \\~07:25 WITA. Источник — слова Ивана 11.09 07:1x (пункты 6 и 7), дословно ключевое:\n\n> «6. нужно сделать функционал который позволит создать магазин: 6.1 из админки администратора (чтобы я мог видеть все магазины и добавлять / удалять / редактировать). У меня должна быть возможность добавить администратора или сменить логин и пароль администратора, который там уже есть. 6.2 онбординг, на который человек будет попадать после того как он оплатит покупку магазина у меня … данные должны быть предзаполнены … возможно часть из них ему не стоит показывать … 6.2.1 покупатель будет заходить на сайт https://upready.dev/, затем выбирать тариф или товар и переходить к оплате. Оплата будет разными способами, например polar.sh, tribute (телеграм) и после оплаты мы будем его редиректить на нужную страницу (или давать ему ссылку) … после оплаты мы должны завести на клиента аккаунт, а также закрепить за клиентом оплаченную услугу (1 клиент может иметь множество покупок), перейдя по ссылке человек будет попадать на онбординг.\n> 7. нужно решить: 7.1 как хранить изображения и файлы тенантов, чтобы удаляя магазин — удалялись и данные тенанта, не затрагивая файлы других; 7.2 отсоединять тенанта, если он решит сделать себе отдельный standalone магазин с полноценной админкой medusa; 7.3 как делать бэкап данных тенанта; 7.4 какой нужен сервер и хостинг, чтобы система стабильно работала, если станет много тенантов.»\n\nРоль сессии: архитектор-оркестратор (слово Ивана «для оркестрации» 07:1x). Что решено — кодировать; что не решено — спека с рекомендацией и развилкой для Ивана утром, НЕ код. Записанные решения Ивана по МТ — `~/upready/memory/decisions/2026-09-10-multitenancy-target-first-config-in-db.md` (shared-модель; конфиг тенанта в БД; publishable key в БД; склад per-tenant; links вместо колонок; `/tenants/*` = backend панели) — им не противоречить.\n\n## Что уже есть (замер 11.09)\n\n- `modules/tenant`: `tenant` (handle, name, metadata), `tenant_admin` (email, имя; actor type `tenant`, вход `POST /auth/tenant/emailpass`); links tenant↔sales_channel, ↔api_key, ↔product, ↔order. `createTenantWorkflow` (канал + publishable key + склад с зоной и двумя опциями доставки через `provisionTenantWarehouseWorkflow` + первый админ + auth app_metadata). Регистрация сегодня — `POST /tenants` с registration-токеном (self-service), админской двери НЕТ.\n- Файлы: `POST /tenants/uploads` = реэкспорт `@medusajs/medusa/api/admin/uploads` → `uploadFilesWorkflow` → провайдер `file-s3` (`medusa-config.ts`, `useS3`; ключи плоские, тенант в ключе не участвует) или local. Удаление тенанта — workflow ОТСУТСТВУЕТ.\n- Админка Medusa :9023/app (admin@upready.dev) — родная; расширений `src/admin/**` под тенантов нет.\n- Бэкап платформы — правило 42a (три яруса, restic → R2, 42d); per-tenant бэкапа нет.\n\n## Часть A — кодировать этой ночью (решения есть)\n\n### A1. Админка магазинов (6.1) — расширение родной админки Medusa\n- `src/api/admin/tenants/**`: `GET /admin/tenants` (список с каналом, ключом, числом товаров/заказов по links), `POST /admin/tenants` (тело = handle, name, first admin {email, password, first_name, last_name} → `createTenantWorkflow`; пароль заводится через auth module emailpass — проверить API `AuthModuleService.register/updateProvider` по `@medusajs/auth` 2.19/2.20 в node_modules, не по памяти), `GET/POST/DELETE /admin/tenants/:id`, `GET/POST /admin/tenants/:id/admins`, `POST/DELETE /admin/tenants/:id/admins/:adminId` (смена email и пароля — «сменить логин и пароль администратора»).\n- `src/admin/routes/tenants/**` (UI route, `defineRouteConfig`, пункт сайдбара «Магазины»): таблица тенантов, создание, карточка (данные, админы: добавить / сменить email+пароль / удалить), удаление с подтверждением. Внешний вид — компоненты `@medusajs/ui`, как остальная админка.\n- Платформенные администраторы (сотрудники upready) — уже родной раздел Settings → Users (invite); НЕ дублировать.\n- Удаление тенанта — `deleteTenantWorkflow`: см. A3; пока Иван не решил hard/soft — реализовать **soft** (флаг `archived_at`, канал `is_disabled`, ключ отозван, вход админов закрыт), purge — отдельным шагом после решения.\n- Приёмка: seam-тесты `apps/backend/integration-tests/http/admin-tenants.spec.ts` (создание → вход нового админа в панель → товар виден в своём канале; удаление → вход 401, витрина по ключу 401); скриншоты экрана в `artifacts/docs/platform-shots/`; tsc + medusa lint rc=0.\n\n### A2. Файлы тенантов (7.1) — префикс на ключе\n- Рекомендация (кодировать): ключ объекта `tenants/\u003ctenant_id>/\u003culid>-\u003cfilename>`. Свой `POST /tenants/uploads` (вместо реэкспорта): тенант из `req.auth_context`, `uploadFilesWorkflow` с `filename` под префиксом — ПРОВЕРИТЬ по `@medusajs/file-s3` (`dist/services/s3-file.js`), как провайдер строит key из filename и сохраняет ли `/`; если нет — свой провайдер-обёртка над s3 с `prefix` из контекста. Local-провайдер — тот же путь в каталоге.\n- Удаление = `ListObjectsV2` по префиксу + `DeleteObjects` (шаг `deleteTenantFilesStep` в `deleteTenantWorkflow`, с компенсацией «нельзя» → шаг последний, после soft-delete). Публичный URL содержит id тенанта — допустимо (публичные ассеты).\n- Уже загруженные файлы стенда без префикса — оставить, отметить в отчёте.\n- Приёмка: seam-тест — загрузка от Acme даёт ключ с `tenants/ten_acme…/`, объект Globex не виден в листинге Acme; удаление тенанта убирает ровно его префикс (на local-провайдере и, если есть креды R2 в `~/upready/.env.keys`, на bucket'е стенда).\n\n### A3. Экспорт тенанта = основа для 7.2 и 7.3 (один код)\n- `exportTenantWorkflow` → bundle `tenant-\u003chandle>-\u003cYYYY-MM-DD>.json.gz` (+ манифест файлов по префиксу): tenant, admins (без паролей), products/variants/options/prices/inventory levels, categories/collections (по links, волна 2 панели добавит их), контент-страницы и home-config (модели волны 2 — читать, если уже есть), customers c заказами канала, orders + line items + payments + fulfillments (как есть, для истории), regions/shipping options своего склада.\n- CLI `apps/backend/scripts/tenant-export.mjs \u003chandle>` и `POST /admin/tenants/:id/export` (скачать).\n- Импорт — ТОЛЬКО спека (часть B), не код.\n\n## Часть B — спека с рекомендацией и развилками (код не писать)\n\n### B1. Онбординг после оплаты (6.2, 6.2.1)\nЦепочка: upready.dev → тариф → оплата (polar.sh / tribute) → webhook → **аккаунт клиента** + **покупка** (entitlement) → ссылка/редирект с одноразовым токеном → мастер онбординга (предзаполнен) → `createTenantWorkflow` → авто-вход в панель.\nСпроектировать и записать в `docs/multitenancy/onboarding-spec.md`:\n- Модуль `platform` в backend: `account` (id, email, telegram_id?, name), `purchase` (account_id, provider ∈ {polar, tribute, manual}, provider_event_id UNIQUE — идемпотентность, plan, status, paid_at), `onboarding_token` (purchase_id, token, expires_at, used_at); link account↔tenant (1:N — «1 клиент может иметь множество покупок»).\n- Webhooks `POST /webhooks/polar`, `POST /webhooks/tribute` — подпись проверяется по первоисточникам (docs polar.sh и tribute — fetch, 17a), ретраи, идемпотентность по event id.\n- Мастер `/onboarding/:token` в `apps/tenant-panel` (PublicLayout): шаг 1 название + handle (предзаполнены из покупки/email), шаг 2 контакты (email из аккаунта), шаг 3 валюта/регион/язык (дефолт из тарифа), финиш → вход. НЕ показывать: склад, опции доставки, ключ (провижнятся сами). Всё остальное правится потом в панели.\n- Контракт для сайта upready.dev: формат ссылки, параметры, страница «оплата прошла» — сайт в эту ночь не трогать (найти его репо в `~/upready/projects/` и записать путь).\n- Развилки Ивану (каждая — `handoff.mjs question add`): идентичность аккаунта (email vs telegram id vs оба); что даёт тариф (1 магазин / N / срок, продление); hard vs soft delete тенанта и срок хранения после удаления; ручная «покупка» из админки (без оплаты — для тестов и рассрочки).\n\n### B2. Отсоединение в standalone (7.2)\nРекомендация: standalone = новый инстанс Medusa (родная админка) + импорт bundle из A3: товары/категории/контент/клиенты — штатно (workflows), заказы — CSV-архив + опционально прямой DB-перенос как платная услуга (у Medusa нет import API для заказов — проверить по докам 2.20). Файлы — копия префикса в bucket клиента. Домен — перенос DNS. Записать шаги и цену в `docs/multitenancy/detach-spec.md`.\n\n### B3. Бэкап данных тенанта (7.3)\nПлатформа — 42a как есть (вся БД + bucket, restic → R2, 42d). Per-tenant — ночной `exportTenantWorkflow` (A3) → `tenants/\u003cid>/backups/\u003cdate>.json.gz` в R2, retention 30 дней + месячные; восстановление = импорт bundle (B2) в тот же инстанс с заменой. Оценить размер bundle на стенде (число + единица) и время экспорта. `docs/multitenancy/backup-spec.md`.\n\n### B4. Сервер и хостинг при росте тенантов (7.4)\nЗамерить на стенде: RSS `medusa develop`/`medusa start`, размер БД (`pg_database_size`), p95 `/store/products` под 50 rps (autocannon или k6 — что есть в `~/upready`), размер bucket. Где сейчас прод upready-store — прочитать `~/r/s5.md`, `~/upready/memory/*deploy*`, `*contabo*` — не выдумывать.\nРекомендация к проверке: один Medusa backend (server + worker режимом `workerMode`) + PG 17 + Redis + одна мультитенантная витрина Next.js (тенант по Host — следствие решения «ключ в БД») + статичная панель; reverse proxy с wildcard `*.\u003cдомен>` и on-demand TLS для кастомных доменов; объектное хранилище R2; managed PG при >N тенантов или >X ГБ (N и X — из замера). Итог — `docs/multitenancy/hosting-spec.md` с таблицей «тенантов → конфигурация → цена/мес» и развилкой провайдера.\n\n## Протокол ночи\n- Ветка `feat/mt-platform` от `feat/mt-vendors` (worktree `~/upready/worktrees/upready-store/feat/mt-platform`); коммиты `IVAN_OK=1`, литеральный pathspec, `(t-2026-09-11-mt-platform-admin)` / `(t-2026-09-11-mt-onboarding-design)` / `(t-2026-09-11-mt-ops-design)`. **Push не делать.**\n- Файлы связи: `artifacts/docs/2026-09-12-platform-night.md` (READY первой строкой), `…-progress.md`. Промпты воркерам по-английски (3a), модель на каждом agent() (5e), воркеры не коммитят.\n- Границы с сессией A (панель, `feat/mt-panel-2`): B владеет `apps/backend/src/admin/**`, `src/api/admin/tenants/**`, `src/workflows/tenant/{delete-tenant,export-tenant}/**`, `src/api/tenants/uploads/**`, `scripts/tenant-export.mjs`, `docs/multitenancy/**`. B **не добавляет моделей в `modules/tenant`** этой ночью (снимок миграций общий с A); `archived_at` для soft-delete — через `metadata` тенанта до утра, миграцию — после слияния веток.\n- Стенд общий: backend :9023 и панель :5180 запущены из worktree `feat/mt-panel` (старая волна). Для своих проверок поднять свой backend на другом порту (`PORT=9024`, та же БД `upready_store_mt` на :5433 — см. креды) — чужие процессы не гасить.\n"},{"id":"docs-multitenancy-2026-09-11-night-2-panel-brief-md","group":"briefs","path":"docs/multitenancy/2026-09-11-night-2-panel-brief.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/2026-09-11-night-2-panel-brief.md","title":"Панель","note":"бриф волны","bytes":13657,"text":"# Панель тенанта — волна 2 (ночь 11→12.09.2026). Бриф оркестратору\n\nАвтор: session_01HqysBVaN4S8qDwkauRQdvB (сессия-приёмщик волны 1), 11.09 \\~07:20 WITA.\nИсточник задания — слова Ивана 11.09 07:1x, дословно ключевое:\n\n> «когда будут готовы остальные части админки, по ним есть ТЗ о том что там должно быть?\n> В админке нужны следующие разделы: категории товаров; промо; контент-разделы (контактная\n> информация, юридические реквизиты, о магазине, политика конфиденциальности, публичная оферта);\n> настройки главной страницы (hero; какие блоки показывать: категории; товары — популярное,\n> товары конкретной категории). Посмотри какие разделы есть в Mercur … по коду бекенда и\n> фронтенда, составь ТЗ и начни внедрение.»\n\nТЗ до этого момента НЕ существовало — этот документ и есть ТЗ v0. Правит его Иван.\n\n## 1. Состояние на входе (замерено 11.09 07:00–07:15)\n\n- Волна 1 принята 06:44: `artifacts/docs/2026-09-11-tenant-panel-morning.md` (вердикт), `…-night.md` (отчёт оркестратора). Код слит в `feat/mt-vendors` (merge-коммит от 07:2x).\n- Панель `apps/tenant-panel` (Vite, копия экранов админки 2.19.0 + свой слой `hooks/api` на `/tenants/*`). Маршруты (`src/app.tsx`): `/` обзор, `/products` список, `/products/create`, `/orders` список, `/login`. **Заглушки `routes/not-built`**: `/products/:id`, `/orders/:id`, `/orders/export`. Всё остальное (в т.ч. `/settings/profile` из user-menu) падает в `path:\"*\"` → `routes/no-match` = страница 404. Ссылка на `/settings/translations/edit` в действиях строки товара — тоже мёртвая.\n- Backend `apps/backend/src/api/tenants/`: `me`, `products`, `products/[id]`, `orders`, `uploads` (реэкспорт админского — файлы НЕ скоупятся по тенанту), `product-categories`, `collections`, `product-tags`, `product-types`, `product-options`, `inventory-items`, `regions`, `sales-channels(/[id])`, `shipping-profiles`, `price-preferences`, `store` — справочники для формы создания товара. Контракт: `docs/tenant-panel/api-contract.md`.\n- Модуль `modules/tenant`: `tenant` (id, handle, name, metadata), `tenant_admin`; links `tenant-sales-channel`, `tenant-api-key`, `tenant-product`, `tenant-order`. Workflows: `create-tenant`, `create-tenant-product`, `link-order-to-tenant`, `provision-tenant-warehouse`.\n- Витрина (`apps/storefront`, :8000/:8001/:8002 по env-ключу): главная = promo-banner + profile-hero + 4 category-tile, товаров на главной 0; товары на `/en/store` (9/3/1 карточек). Кэш `force-cache` — после любого изменения каталога `POST /api/revalidate` (см. отчёт приёмки).\n- Стенд: backend :9023 (`medusa develop` из `apps/backend`), панель :5180, админка :9023/app; креды `~/upready/memory/secrets/upready-store/local-mt-stand.txt`.\n\n## 2. Инвентарь Mercur 2.3.3 (панель продавца) — что там есть\n\nЗамер по `@mercurjs/core` `dist/api/vendor/**` (маршруты) и по бандлу `@mercurjs/vendor` (подписи сайдбара) + скриншоты Ивана.\n\nСайдбар: **Orders** (внутри — returns, claims, exchanges, order-edits, fulfillments, payments/capture/refund) · **Products** → Offers, Collections, Categories · **Inventory** → Reservations · **Customers** → Customer Groups · **Promotions** → Campaigns · **Price Lists** · **Reviews** · **Payouts** / Commission · **Settings**: Profile, Store (описание, handle, email, телефон, сайт, валюта; блоки Address, Company Details, Payment Details, Time off), Users (invite + роли/RBAC), Product Types, Product Tags, Locations & Shipping (stock locations, fulfillment sets/service zones, shipping options + правила, shipping profiles).\nAPI сверх этого: `sellers/*` (адрес, реквизиты компании, payment details, members/invites), `stores` (валюты), `uploads`, `currencies`, `refund-reasons`, `return-reasons`, `feature-flags`, `rbac/me/permissions`.\n\nКак Mercur скоупит: каждая сущность продавца связана с `seller` через links (seller↔product, seller↔order, seller↔promotion, seller↔customer …) — тот же приём, что наши `tenant-product`/`tenant-order`. Ловушка `allowed` со звёздами в query-config — в памяти `decisions/2026-09-10-multitenancy-target-first-config-in-db.md`, раздел «ловушка allowed»: **в наших `/tenants/*` `allowed` либо отсутствует, либо без `*`**.\n\n## 3. Целевой список разделов панели (ТЗ v0)\n\n| # | Раздел | Откуда | Волна 2 (эта ночь) | Примечание |\n|---|---|---|---|---|\n| 1 | Товар: карточка/редактирование (`/products/:id` + подмаршруты админки: edit, media, options, variants, prices, organize, attributes, sales-channels, metadata) | Иван 1.1 | **да** | копия `routes/products/product-detail/**` + все `/tenants/products/[id]/*` действия |\n| 2 | Заказ: карточка (`/orders/:id`) — просмотр, fulfillment/shipment, capture платежа, cancel; returns/claims/exchanges — только просмотр | Иван 1.2 | **да** (действия — минимум: fulfill, ship, capture, cancel) | копия `routes/orders/order-detail/**`; heavy — резать по подмаршрутам |\n| 3 | Экспорт заказов (`/orders/export`) | заглушка | да | CSV по своим заказам |\n| 4 | Профиль тенант-админа (`/settings/profile`: имя, email, язык, смена пароля) + чинить user-menu | 404 у Ивана | **да** | `GET/POST /tenants/me`, пароль через auth module `update` |\n| 5 | Категории товаров (список, дерево, создание, редактирование, привязка товаров) | Иван 5.1 | **да** | категории в Medusa ГЛОБАЛЬНЫ (без канала) → link `tenant-product-category` по образцу `tenant-product`; проверить по `@medusajs/product` до кода |\n| 6 | Промо (promotions + campaigns) | Иван 5.1 | **да** | link `tenant-promotion`; чтобы промо действовало только в канале тенанта — правило `sales_channel_id` при создании (ПРОВЕРИТЬ по `GET /admin/promotions/rule-attribute-options/rules` на живом :9023, не по памяти) |\n| 7 | Контент-разделы: контакты, юр. реквизиты, о магазине, политика конфиденциальности, публичная оферта | Иван 5.1 | **да** | новая модель `tenant_page` в `modules/tenant` (tenant_id, key ∈ {contacts, legal, about, privacy, offer}, title, body (markdown), locale, published); `GET/PUT /tenants/pages/:key`; публичный `GET /store/tenant/pages/:key` по publishable key → канал → тенант; витрина: страницы + ссылки в футере |\n| 8 | Настройки главной: hero (вкл/выкл, заголовок, подзаголовок, CTA, картинка), блоки (категории; товары: популярное / товары категории X), порядок | Иван 5.1 | **да, последним куском** | модель `tenant_home_config` (JSON-композиция) + `GET/PUT /tenants/home`, публичный `GET /store/tenant/home`; витрина читает и рендерит. **Одна схема на всех:** сначала прочитать `feat/stands-composition` (задача `t-2026-09-09-02`, «панель настроек → композиция блоков») и взять её схему; своей второй не заводить. Если там схемы нет — минимальная своя + запись развилки в `…-night.md` |\n| 9 | Коллекции | Mercur | нет | как 5, позже |\n| 10 | Клиенты / группы | Mercur | нет | клиенты глобальны; «свои» = по заказам канала — дизайн отдельно |\n| 11 | Склад/резервы, Locations & Shipping, Price Lists, Reviews, Payouts/Commission, Users/RBAC, Time off | Mercur | нет | вторая очередь; склад per-tenant уже провижнится при создании |\n\nЯзык панели: сейчас английский по всему периметру (i18n админки вырезан при копировании). В волне 2 НЕ переводить — отдельная задача после решения Ивана.\n\n## 4. Механизм (не менять)\n\n- Экраны = файлы админки `@medusajs/dashboard` 2.19.0 **как есть**; меняется только слой `hooks/api/*` → `/tenants/*` (форма ответов админки `{\u003cplural>, count, offset, limit}`). Сравнимость по скриншоту и по коду — критерий Ивана.\n- Изоляция — links (`tenant-*`), фильтр по link в каждом GET; POST/PUT/DELETE проверяют владение (404, не 403, как в волне 1).\n- Витрина видит контент/настройки через `/store/*` по publishable key (ключ → sales channel → tenant по links).\n- Ловушки из волны 1 (в памяти, раздел «Интеграция ночной волны 11.09»): `allowed` без `*`; «двойной диалог» = паритет с админкой; seam-suite только с `DB_HOST=localhost DB_USERNAME=ivanprotsko PORT=9031`; кэш витрины → `POST /api/revalidate`.\n\n## 5. Приёмка (каждый кусок — в том же коммите, s4)\n\n- seam-тесты `apps/backend/integration-tests/http/tenants.spec.ts` (+ новые файлы по разделам) зелёные с изоляцией: строка тенанта A не читается/не правится токеном B.\n- e2e панели `apps/tenant-panel/e2e/tenant-panel.e2e.mjs` расширен на новые экраны, зелёный на живой :5180.\n- `tsc --noEmit` и eslint в `apps/tenant-panel`, `tsc` + `medusa lint` в `apps/backend` — rc=0.\n- Пары скриншотов admin/panel на каждый новый экран в `artifacts/docs/tenant-panel-shots/` (в git не идут).\n- Витрина: контент-страницы и главная Acme отличаются от Globex после правки из панели (после revalidate), Initech не изменился.\n- Утром Иван смотрит своими глазами: заголовки не обрезаны, статусы словами, форма заполняется без инструкции (18e).\n\n## 6. Протокол ночи (как в волне 1)\n\n- Ветка `feat/mt-panel-2` от `feat/mt-vendors` (worktree `~/upready/worktrees/upready-store/feat/mt-panel-2`), подветки на куски; коммиты `IVAN_OK=1`, литеральный pathspec, Conventional Commits `(t-2026-09-11-mt-panel-wave-2)`. **Push не делать.**\n- Файлы связи: `artifacts/docs/2026-09-12-tenant-panel-night.md` (READY первой строкой по готовности), `…-defects.md`, `…-progress.md` (строка на каждый шаг с временем по `date`).\n- Промпты воркерам — по-английски (3a), модель пинится на каждом agent() (5e). Воркеры не коммитят (21).\n- Параллельно работает сессия B (платформа/онбординг/эксплуатация, `feat/mt-platform`). **Границы владения путей:** A владеет `apps/tenant-panel/**`, `apps/backend/src/api/tenants/**`, `apps/backend/src/api/store/tenant/**`, `apps/storefront/**`, `modules/tenant/models/tenant-page.ts` + `tenant-home-config.ts` и их миграции, `links/tenant-product-category.ts`, `links/tenant-promotion.ts`. B владеет `apps/backend/src/admin/**`, `apps/backend/src/api/admin/tenants/**`, `workflows/tenant/delete-tenant/**`, `api/tenants/uploads` (скоупинг файлов) и `docs/multitenancy/**`. Общий файл миграций модуля — согласовывать через `…-progress.md` обеих веток: B в эту ночь моделей в `modules/tenant` НЕ добавляет.\n"},{"id":"docs-multitenancy-2026-09-11-night-2-specs-brief-md","group":"briefs","path":"docs/multitenancy/2026-09-11-night-2-specs-brief.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/2026-09-11-night-2-specs-brief.md","title":"Спеки","note":"бриф волны","bytes":10441,"text":"# Спецификации и схемы мультитенантности — зеркало кода (ночь 11→12.09.2026). Бриф сессии C\n\nАвтор: session_01HqysBVaN4S8qDwkauRQdvB, 11.09 08:12 WITA. Источник — слова Ивана 11.09 08:1x, дословно ключевое:\n\n> «сессия будет посвящена созданию спецификаций как все работает и как должно работать + мне нужны все схемы, которыми можно выразить то, что мы строим, er, sequence, flowchart, gantt chart, и тд, чтобы я наглядно мог ориентироваться. Плюс эти схемы должны стать зеркалом источника истины (которым является код) и регулярно перепроверяться. … для каждой схемы, и любой другой части документации и спецификаций следует указывать дату создания и обновления, чтобы агенты понимали, когда следует полагаться на веру, а когда следует пойти в код и перепроверить.»\n\nРоль: архитектор-оркестратор спецификаций. **Код приложений не правит** — только читает (три worktree: `feat/mt-vendors` = принятое, `feat/mt-panel-2` = волна 2 панели + витрина по Host, `feat/mt-platform` = админка магазинов/онбординг/эксплуатация). Своя ветка `feat/mt-specs` от `feat/mt-vendors`. Владеет `docs/specs/**` и `scripts/specs-*.mjs` (корень репо; если корневого `scripts/` нет — `apps/backend/scripts/`, выбор записать в README). Задача `t-2026-09-11-mt-specs-diagrams`. Ограничения по задачам направления МТ сняты Иваном 08:10 (память, последний раздел решения МТ) — новые `t-…-mt-…` заводить самому.\n\n## 1. Принцип: схема = зеркало кода, с датой и коммитом\n\n- Каждый документ и каждая схема несёт frontmatter: `id`, `kind` (er | sequence | flowchart | state | c4-context | c4-container | gantt | route-map | glossary), `status` (`as-is` — отражает код на коммите; `to-be` — целевое, со ссылкой на задачу `t-…`), `created`, `updated` (ISO, WITA), `verified_against` (sha коммита, по которому сверено), `verified_at`, `generator` (`script:\u003cимя>` | `hand`), `sources` (файлы кода, которые схема отражает).\n- Реестр — **JSON**, не markdown (18b): `docs/specs/registry.json` — те же поля на каждую схему; markdown-файлы схем ссылаются на id. Правило доверия пишется в `docs/specs/README.md` одной фразой: «если `verified_against` — не предок HEAD или `sources` менялись после него — схеме не верить, идти в код».\n- **Генерируется из кода всё, что можно:** ER (из `model.define` в `apps/backend/src/modules/**/models/*.ts` + `defineLink` в `src/links/*.ts`), карта маршрутов (из `apps/backend/src/api/**/route.ts` — экспортированные методы, actor type по каталогу `admin|store|tenants|auth`), шаги workflow (из `src/workflows/**` — `createStep`/`runAsStep`), gantt (из `HANDOFF.json`: created/approved/updated/done задач `t-…-mt-…`). Скрипт `specs-generate.mjs` пишет их в `docs/specs/generated/*.md` со штампом коммита.\n- **Рукописные схемы** (sequence, flowchart, c4, state): рисуются по коду, `sources` перечисляют файлы; `specs-verify.mjs` для каждой считает `git diff --name-only \u003cverified_against>..HEAD -- \u003csources>` — если непусто, схема помечается STALE в отчёте; для generated — регенерирует и сравнивает с закоммиченным, дрейф = FAIL. Выход ≠0 при дрейфе. Отчёт `docs/specs/verify-report.md`; `registry.json` обновляется (`verified_at`/`verified_against`) только при зелёном прогоне. Скрипт прогнать самому (19c), команду записать в README и в `AGENTS.md` (раздел проверок); подключение к хуку/CI — вопрос Ивану (`question add`), не самовольно.\n- Формат схем — mermaid внутри markdown (рендерится в артефактах и на GitHub). BPMN — только через генерацию из IR (29a); руками не рисовать.\n\n## 2. Что нарисовать (минимум; каждая схема — в двух статусах, если целевое отличается от кода)\n\n1. **C4 context + container:** upready.dev (сайт/оплата: polar.sh, tribute), backend Medusa (:9023; server/worker), PostgreSQL, Redis, R2/S3 (файлы под `tenants/\u003cid>/`), витрина Next.js (сегодня — процесс на тенанта с ключом в env; целевое — один процесс, тенант по Host), панель тенанта (Vite, `/tenants/*`), родная админка Medusa (платформа), прокси (wildcard + custom domains).\n2. **ER:** `tenant`, `tenant_admin`, links tenant↔sales_channel/api_key/product/order (+ product_category, promotion — волна 2), `tenant_page`, `tenant_home_config`, domains (to-be, `t-2026-09-12-mt-storefront-by-host`: домен уникален между тенантами, у тенанта всегда есть технический субдомен), platform: `account`, `purchase`, `onboarding_token` (to-be, `t-2026-09-11-mt-onboarding-design`) — плюс затронутые сущности Medusa (sales_channel, api_key, product, order, stock_location, customer).\n3. **Sequence:** (a) создание тенанта (`createTenantWorkflow`: канал → ключ → склад+зона+2 опции → админ → auth app_metadata; компенсации); (b) запрос покупателя: DNS → прокси → витрина → `Host` → `GET /store/tenant/by-host` → ключ → `/store/products` → канал (as-is: ключ из env); (c) вход тенант-админа → панель → `/tenants/products` через links; (d) заказ с витрины → `order.placed` → `linkOrderToTenantWorkflow`; (e) оплата → webhook → account → purchase → ссылка → онбординг → тенант (to-be); (f) удаление тенанта → soft delete → отзыв ключа → файлы по префиксу (to-be).\n4. **Flowchart:** маршрутизация запроса по доменам (vasya.com / petya.ru / *.upready.store → один процесс); шаги мастера онбординга (что предзаполнено, что скрыто); проверки изоляции в `/tenants/*` (link-фильтр в GET, владение в POST/PUT/DELETE, `allowed` без `*`).\n5. **State:** жизненный цикл тенанта (created → active → archived → purged), покупки (paid → onboarding_sent → consumed / expired), заказа в панели (что показываем словами).\n6. **Gantt:** направление МТ по задачам HANDOFF (`t-2026-09-10-mt-*`, `t-2026-09-11-mt-*`, `t-2026-09-12-mt-*`): done/in_progress/backlog, даты из JSON — генерируется.\n7. **Route map:** таблица всех `/tenants/*`, `/admin/tenants/*`, `/store/tenant/*`, `/auth/tenant/*`, `/webhooks/*` с методами, actor type, workflow за ними, seam-тестом, покрывающим маршрут — генерируется + рукописная колонка «зачем».\n8. **Глоссарий** (`docs/specs/glossary.md`): тенант, sales channel, publishable key, link, actor type, Host-резолв, пресет, композиция — по одной фразе, на русском, с английским термином в скобках.\n\nЧитать до рисования: `docs/multitenancy/2026-09-11-night-2-{panel,platform}-brief.md`, `~/upready/memory/decisions/2026-09-10-multitenancy-target-first-config-in-db.md` (все решения Ивана; не противоречить), `docs/tenant-panel/api-contract.md`, отчёты `artifacts/docs/2026-09-11-tenant-panel-{night,morning}.md`; целевое — из брифов и задач, as-is — только из кода на конкретном коммите.\n\n## 3. Приёмка\n- `node scripts/specs-generate.mjs` и `specs-verify.mjs` прогнаны, rc=0 на своём коммите; отчёт лежит; в `registry.json` у каждой схемы заполнены все поля, `verified_against` = реальный sha (скопирован из `git log --oneline -1`, не выдуман).\n- Иван открывает `docs/specs/README.md` и за 5 минут находит: как устроено сейчас, что строится, какая схема свежая, а какой не верить (18e: у каждой схемы дата и коммит на виду, статус as-is/to-be словами).\n- Ни одного изменения вне `docs/specs/**`, `scripts/specs-*.mjs`, `AGENTS.md` (одна строка про проверку) и `HANDOFF.json`.\n- Отчёт ночи: `artifacts/docs/2026-09-12-specs-night.md` (READY первой строкой), прогресс в `…-progress.md` с временем по `date`. Коммиты `IVAN_OK=1`, литеральный pathspec, `(t-2026-09-11-mt-specs-diagrams)`. Push не делать. Промпты воркерам по-английски, модель на каждом agent().\n"},{"id":"artifacts-docs-2026-09-12-platform-night-md","group":"nights","path":"artifacts/docs/2026-09-12-platform-night.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/artifacts/docs/2026-09-12-platform-night.md","title":"Платформенная ночь","note":"что сделано и чем доказано","bytes":9144,"text":"READY\n\n# Платформенная ночь 11→12.09.2026 — отчёт архитектора-оркестратора (feat/mt-platform)\n\nСессия session_01MQKTcc6DWhp7ZFrq8zRzFJ, 08:32–09:3x WITA. Задачи: t-2026-09-11-mt-platform-admin (код),\nt-2026-09-11-mt-ops-design (спеки с замерами), t-2026-09-11-mt-onboarding-design (спека с развилками).\nЖурнал хода с датами: artifacts/docs/2026-09-12-platform-progress.md. Push не делался.\n\n## Что готово и где смотреть\n\n**Родная админка → «Магазины»** (A1). `http://localhost:9025/app/tenants`, вход admin@upready.dev /\nsupersecret (backend этой ветки на 9025; 9023 — старая волна). Таблица магазинов с поиском и фильтром\n«показать архивные», создание (название, handle, первый администратор с паролем), карточка (домен, канал,\nпубликуемый ключ с копированием, счётчики, экспорт), администраторы: добавить, сменить email и пароль,\nудалить (последнего нельзя), «Удалить магазин» с подтверждением → статус «Архивирован», действия\nотключены. Скриншоты 01–06 в artifacts/docs/platform-shots/ (PNG на диске, в git только README и\nshoot.mjs, как у прежних shot-каталогов). Внешний вид — @medusajs/ui, как у остальной админки; Geist\nнамеренно не применён (родная оболочка админки живёт на своих токенах) — на усмотрение Ивана.\n\n**API** `src/api/admin/tenants/**` по контракту docs/multitenancy/admin-tenants-api-contract.md:\nGET/POST /admin/tenants, GET/POST/DELETE /admin/tenants/:id, GET/POST …/admins, POST/DELETE …/admins/:adminId,\nPOST …/export. Workflows: create-tenant-by-admin, add/update/remove-tenant-admin, update-tenant,\ndelete-tenant (soft). Пароль через `authModuleService.register(\"emailpass\")`, смена — `updateProvider`\n+ `updateProviderIdentities` (проверено в node_modules 2.19.0).\n\n**Soft delete** без новых моделей (снимок миграций общий с feat/mt-panel-2): `tenant.metadata.archived_at`,\nканал `is_disabled`, publishable key отозван, вход админа тенанта закрыт middleware на `/tenants/*` и\n`POST /auth/tenant/emailpass` (401), витрина по отозванному ключу — **400** (не 401: NOT_ALLOWED в\nensure-publishable-api-key.js, проверено W1). Файлы удаляются только с явным `purge_files=true`.\n\n**Файлы тенанта** (A2). Ключ `tenants/\u003ctenant_id>/\u003cимя>-\u003culid>.\u003cext>` через `filename` в\n`uploadFilesWorkflow` — file-s3 и file-local сохраняют сегменты каталогов (проверено в dist). Хелпер\n`src/tenant-files` (список/удаление по префиксу: local — каталог `static/tenants/\u003cid>/`, S3 —\nListObjectsV2/DeleteObjects через @aws-sdk/client-s3@3.1094.0, добавлен как прямая зависимость). Старые\nфайлы стенда без префикса оставлены. Live-проверка R2 не удалась: TLS handshake_failure именно к хосту\nбакета (воспроизведено node/curl/openssl) — проверить биндинг бакета в Cloudflare.\n\n**Экспорт тенанта** (A3). `exportTenantWorkflow` + JSON Schema бандла + `POST /admin/tenants/:id/export`\n+ CLI `apps/backend/scripts/tenant-export.mjs \u003chandle> [--out \u003cdir>]`. Формат —\ndocs/multitenancy/tenant-bundle-format.md. Замер на стенде, тенант acme: 9 товаров, 6 заказов,\n4 покупателя, 1 регион; 48 886 байт JSON / 11 433 байт gzip / 0,34 с. Страницы и home-config панели\n(ветка A) в бандле как `pages: null`. Поле `files` — метаданные, не байты.\n\n**Спеки** (часть B): docs/multitenancy/onboarding-spec.md (348 строк, 6 источников polar.sh/tribute),\ndetach-spec.md (164), backup-spec.md (216), hosting-spec.md (352, 14 файлов замеров, 6 источников).\n\n## Приёмка по строкам задач\n\nt-2026-09-11-mt-platform-admin:\n1. seam admin-tenants: создание → вход нового админа → товар в своём канале; удаление → вход 401, витрина по ключу 400 — **5/5 зелёные** (ожидание 401 для ключа заменено на 400 по коду Medusa).\n2. Раздел «Магазины»: таблица, создание, карточка с админами, удаление с подтверждением — **есть**, 6 скриншотов против живого :9025.\n3. Загрузка от Acme даёт `tenants/\u003cid>/…`, удаление убирает ровно его префикс — seam tenant-uploads **2/2** (local-провайдер).\n4. tenant-export.mjs выдаёт бандл с числом записей и размером — **да** (числа выше).\n5. tsc + medusa lint rc=0 — **да** (сквозной прогон оркестратора 09:20–09:2x: tsc 0 после правки import attributes в src/admin/i18n/index.ts, lint 0, seam 5/5 + 2/2 + 4/4).\n\nt-2026-09-11-mt-ops-design: 7.1 закодирован и покрыт тестом — да; detach-spec (шаги, штатно/вручную,\nчто не переносится; нативного импорта заказов в Medusa нет — проверено по node_modules и докам) — да;\nbackup-spec (ярус поверх 42a, байты и секунды бандла, экстраполяция по размеру, restore drill) — да;\nhosting-spec (RSS, БД, p95, прод из памяти, таблица конфигураций, развилка провайдера) — да, с оговоркой ниже.\n\nt-2026-09-11-mt-onboarding-design: спека, развилки вопросами, кода нет — да (done, 816dddc).\n\n## Оговорки (честные дыры)\n\n- Нагрузочные p95 в hosting-spec скомпрометированы: во время прогонов на стендовом PG было \\~27 чужих\n  соединений ночных сессий (p95 /store/products 51,8 с при 24 rps на develop, 205 с при 6,5 rps на start).\n  Качественно — один процесс насыщается около 50 rps; для планирования мощности нужен изолированный повтор.\n- Живые цены Hetzner не сняты (страница на JS); объём бакета R2 не измерен (TLS, см. выше).\n- Побайтовая сборка подписей вебхуков Polar (Standard Webhooks) и Tribute (trbt-signature) — проверить по\n  SDK/OpenAPI перед кодом; в спеке помечено, не выдумано.\n- Restore после случайного удаления: отозванный publishable key «раз-отозвать» нельзя — выпускается новый.\n\n## Вопросы Ивану (HANDOFF)\n\nq-mt-onb-identity (email / telegram_id / оба), q-mt-onb-plan (что даёт тариф), q-mt-tenant-delete-mode\n(hard/soft и срок хранения; сегодня soft), q-mt-onb-manual-purchase (ручная покупка из админки),\nq-mt-onb-tribute-link (у Tribute нет редиректа — ссылку слать ботом/письмом). Рекомендации — §7 onboarding-spec.\n\n## Прод сейчас (из памяти, не выдумано)\n\nContabo VPS 84.46.251.149, Coolify + traefik, пять стендов *.upready.dev\n(memory/agent-creatr-prod-deploy-contabo.md, stands-deploy-decisions-2026-09-09.md). Целевая топология\nи прокси доменов тенантов (wildcard *.upready.dev + on-demand TLS, инструкция DNS для тенанта,\nмаппинг Host на единственный процесс витрины) — hosting-spec §3–4.\n\n## Коммиты ветки feat/mt-platform (порядок)\n\n4a78d1b контракт+брифы · 1bc3d3a/816dddc/d70d80a HANDOFF · 9fc3969 onboarding-spec · 33544fc файлы+экспорт ·\n8b11f0e hosting-spec · далее: admin API+UI (t-…-platform-admin), detach/backup (t-…-ops-design), этот отчёт.\nПамять: 0bf5056 (базовый домен upready.dev). Бандлы `artifacts/deliverables/tenant-exports/*.json.gz` и PNG\nскриншотов — на диске, не в git (21f).\n"},{"id":"artifacts-docs-2026-09-12-tenant-panel-night-md","group":"nights","path":"artifacts/docs/2026-09-12-tenant-panel-night.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/artifacts/docs/2026-09-12-tenant-panel-night.md","title":"Ночь панели","note":"что сделано и чем доказано","bytes":9106,"text":"READY\n\n# Волна 2 панели тенанта (11→12.09.2026) — отчёт оркестратора\n\nЗадачи `t-2026-09-11-mt-panel-wave-2` (куски 1–8) и `t-2026-09-12-mt-storefront-by-host` (кусок 9). Оркестратор — session_01477g3q3qsvgSsc4QHptDUh, worktree `feat/mt-panel-2`. Первая строка файла станет `READY`, когда все куски приняты моими прогонами. Ход — в `2026-09-12-tenant-panel-progress.md`, дефекты приёмщика — в `2026-09-12-tenant-panel-defects.md`.\n\n## Что открыть утром\n\n- Панель волны 2: http://localhost:5181 — вход `admin@acme.test` / `supersecret` (Globex `admin@globex.test`, Initech `admin@initech.test`, пароль тот же). Разделы сайдбара: Overview, Products (карточка товара со всеми подэкранами), Orders (карточка заказа: fulfill/ship/capture/cancel, экспорт CSV), Categories, Promotions (+ Campaigns), Pages, Home page; user-menu → Profile (имя, язык, смена пароля); Overview → Domains.\n- Родная админка для сравнения: http://localhost:9026/app (`admin@upready.dev` / `supersecret`). Бэкенд волны 2: http://localhost:9026 (worktree `feat/mt-panel-2`, лог `/tmp/mt-backend-9026.log`). Старый стенд :9023 / :5180 / :8000–8002 не трогался и жив.\n- Витрина одна на всех (кусок 9): http://acme.localhost:8010 и http://globex.localhost:8010 — один процесс `next dev` без `NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY` (лог `/tmp/mt2-storefront-8010.log`); Chrome резолвит `*.localhost` сам, /etc/hosts не нужен. Контент-страницы: `/en/pages/contacts` и ссылки в футере; главная — по документу из панели (Home page).\n- Пары скриншотов «админка ↔ панель» и кадры витрины (1440×900): `file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-panel-2/artifacts/docs/tenant-panel-shots/` (в git не идут).\n- Код: ветка `feat/mt-panel-2`, worktree `/Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-panel-2`; push не делался (приказ). Контракт: `docs/tenant-panel/api-contract.md` (раздел Wave 2), дизайн куска 9: `docs/multitenancy/storefront-by-host.md`.\n\n## Как принималось (все прогоны — мои, не слова воркеров)\n\nКаждый кусок: `tsc`+`eslint` панели, `tsc`+`medusa lint` бэкенда (для 7/8/9 — ещё `tsc`+`next lint` витрины), seam-suite куска на PORT 904x (throwaway БД), затем коммит из worktree воркера и merge в trunk; после каждого merge — те же проверки на trunk и e2e панели на живом :5181/:9026 (после 7 — с витриной :8010): 71 → 82 → 136 → 155 → 175 PASS без FAIL; седьмой прогон после куска 8 дал 4 тестовых FAIL (секция ссылалась на витрину воркера :8012; Globex получил документ главной от сидирования куска 9) — e2e поправлен (972a7e7), секция home 137 PASS. Финальные прогоны на слитом trunk (407389d; стенд :9026/:5181/:8010 без env-ключа, 11:31): tsc/lint трёх приложений rc=0; by-host e2e витрины 18 PASS / 0 FAIL; полный e2e панели 215 PASS / 0 FAIL (лог /tmp/mt2-e2e-trunk-final.log).\n\nSeam-suites (все зелёные на моих прогонах): tenants 34–35, products-detail 7, profile 7, orders-detail 7, categories 12, promotions 14, pages 8, home 13, domains 12.\n\n## Что знать до того, как кликнешь\n\n- Панель целиком по-английски (копия экранов админки, i18n не переводился — вне объёма волны).\n- Числа на стенде выросли: e2e-прогоны создают товары/заказы/категории (Acme: 30+ товаров, 10+ заказов) — приёмка сверяет владельца строк, а не числа.\n- Загрузки файлов (медиа товара, картинка hero) на стенде отдаются локальным провайдером на порту 9000 — картинка в панели может быть «битой» до настройки провайдера (пробел стенда, не маршрута; см. контракт, uploads).\n- Промо: правило `sales_channel_id = канал тенанта` добавляется бэкендом при создании и не удаляется через rules/batch (400); в UI правило видно в карточке промо.\n- Экспорт заказов — синхронный CSV, URL открывается из тоста.\n\n## Куски\n\n| # | Кусок | Состояние | Коммит |\n|---|---|---|---|\n| 4 | Профиль + смена пароля (`/settings/profile`, user-menu 404 закрыт) | ПРИНЯТ: мои прогоны tsc/eslint/lint rc=0, seam tenants-profile.spec.ts 7/7; пары profile/profile-edit | 5f87bb2, merge 4dd51d0 |\n| 1 | Карточка товара (+ варианты, опции, цены, медиа, склад) | ПРИНЯТ: мои прогоны tsc/eslint/lint rc=0, seam 7/7; 4 пары скриншотов | 2b7cf57, merge 7fdfeb9 |\n| 2+3 | Карточка заказа (fulfill/ship/capture/cancel) + экспорт CSV | ПРИНЯТ: мои прогоны tsc/eslint/lint rc=0, seam tenants-orders-detail.spec.ts 7/7; пары order-detail/fulfillment-create/export | 2522f01, merge 952ea2e |\n| 5 | Категории (список, создание, карточка, товары, organize; публичный /store/tenant/product-categories) | ПРИНЯТ: мои прогоны tsc/eslint/lint rc=0, seam tenants-categories.spec.ts 12/12; пары categories/category-detail/category-create | 6bf3591, merge dd94096 |\n| 6 | Промо + кампании (правило sales_channel_id навязано и защищено) | ПРИНЯТ: мои прогоны tsc/eslint/lint rc=0, seam tenants-promotions.spec.ts 14/14 (скидка только в канале Acme); пары promotions/promotion-create/promotion-detail/campaigns | f4bea0d |\n| 7 | Контент-страницы (контакты, реквизиты, о магазине, политика, оферта) + витрина `/pages/:key` и ссылки в футере | ПРИНЯТ: мои прогоны панель/бэкенд tsc+lint rc=0, витрина tsc/next lint rc=0, seam tenants-pages.spec.ts 8/8; кадры pages/page-edit/storefront-page-contacts/storefront-footer | d743d8f |\n| 8 | Настройки главной (`/home-settings`: пресет темы, композиция, hero, источник товаров, порядок блоков) + витрина по документу | ПРИНЯТ: мои прогоны панель/бэкенд tsc+lint rc=0, витрина tsc/next lint rc=0, seam tenants-home.spec.ts 13/13; кадры home-settings + storefront-home-acme before/after/geist-light + globex-default | db129dc |\n| 9 | Витрина по Host: ОДИН процесс next на всех тенантов (`GET /storefront/by-host`, домены в БД `/tenants/domains` + экран Domains, ключ/тема per request из заголовков, env-ключ = fallback одиночного режима) | ПРИНЯТ: мои прогоны три приложения tsc+lint rc=0, seam tenants-domains.spec.ts 12/12 + tenants-home 13/13 на слитом коде; стенд :8010 без env-ключа: acme.localhost → `sneakers`/dark, globex.localhost → `home-goods`/light, каталоги разные; кадры storefront-acme/storefront-globex/panel-domains | eff0577 + c3b9194/51313a2 (слияние с 8), merge 407389d |\n\n## Решения архитектора (см. также memory/decisions, раздел «Волна 2 панели 2026-09-11»)\n\n- Схема главной одна: `settings` = документ feat/stands-composition дословно, `content` — контентное расширение (hero-текст/CTA/картинка, источник товаров, порядок блоков), `theme.preset` из семи пресетов витрины. Развилки нет.\n- Резолвер по Host — `GET /storefront/by-host` (не `/store/*`: гейт publishable key отвечает 400 без ключа, замер на :9026).\n- База доменов `upready.dev` (поправка Ивана 08:5x); технический субдомен выводится из handle, не хранится.\n"},{"id":"artifacts-docs-2026-09-12-mt-deploy-wave-state-md","group":"nights","path":"artifacts/docs/2026-09-12-mt-deploy-wave-state.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/artifacts/docs/2026-09-12-mt-deploy-wave-state.md","title":"Состояние волны деплоя","note":"снимок на момент передачи","bytes":11934,"text":"# МТ-деплой shipshift.dev — состояние волны (2026-09-11, ночь, session_01PgEWhjTRQC4aTED9KrDt7e)\n\nРоль сессии: **оркестратор**. Приёмщик — отдельная сессия, открывает домены руками.\nПредыдущее состояние: `artifacts/docs/2026-09-12-mt-deploy-acceptor-state.md` («ничего живого\nне принято»). Ниже — только то, что измерено в этой сессии.\n\n## 1. Стек здоров, все пять контейнеров\n\n```\nmt-storefront   Up (healthy)     mt-backend   Up (healthy)     mt-panel   Up (healthy)\nmt-ingress-sync Up               mt-postgres  Up (healthy)\n```\n\n`mt-storefront` до этого держал `unhealthy` c FailingStreak 14 при полностью рабочих доменах:\nпроба ходила на `http://127.0.0.1:8000/`, то есть с `Host: 127.0.0.1`, который не резолвится ни в\nодного тенанта → 500. Починено маршрутом `/healthz` (коммит `701392b`).\n\n## 2. Сид: три профиля в одной базе — заявленное поведение оказалось ложным\n\nБриф требовал проверить на живой базе утверждение из шапки `initial-data-seed.ts`, а не верить ему.\nПроверено — **утверждение было ложным**, сид падал дважды:\n\n| Прогон | Где упал | Почему |\n|---|---|---|\n| home-goods #1 | `seedProductOptions` | `Product option with title: Colour, already exists` — опция в 2.19.0 **общая** (`product_option` без product_id, уникальный индекс по title при `is_exclusive=false`), а «Colour» есть у четырёх профилей из пяти |\n| home-goods #2 | `seedTranslations` | `Translation with reference_id: opt_…, locale_code: ar, already exists` — та же общая строка, уже переведённая профилем sneakers |\n\nСид не транзакционный: каждое падение оставляло половину профиля (канал, ключ, категории — без\nтоваров), а `resolveSeedMode` читал «канал есть» как «профиль готов» и делал это состояние\n**неисправимым повторным прогоном**.\n\nПочинено (`817acc2`, `21c6c93`): общие опции присоединяются и получают ОБЪЕДИНЕНИЕ значений;\nметаданные ключуются парой (title, value) — «Chalk» есть и у `Colourway` sneakers (#E8E4DC), и у\n`Colour` electronics (#E6E7E9); переводы, уже стоящие на общих строках, отбрасываются по тройке\n(reference_id, locale_code); признак завершённости — штамп `seed_completed_at` на sales channel,\nкоторый пишется ПОСЛЕДНИМ шагом, а не угадывается по строкам; все шаги стали find-or-create.\n\n**Замер до и после (то, что просил бриф):**\n\n| | до (только sneakers) | после (три профиля) |\n|---|---|---|\n| store | 1 | **1** (не 3) |\n| sales channels | 1 (Kerbstone, 14 товаров) | 3: Kerbstone 14, Long Morning 12, Ferrite 14 |\n| publishable keys | 1 | 3 |\n| товары всего | 14 | 40 = 14+12+14 — **ни один товар не в двух каналах** |\n| категории | 7 | 20 |\n| общие опции | Size 9 знач., Colour 3, Colourway 6 | Size 12, Colour 9, Colourway 6, Capacity 5 |\n\nКаталожная изоляция проверена не по строкам, а через публичный ключ тенанта:\n`GET /store/products` с ключом Globex отдаёт ровно 12 товаров home-goods.\n\n## 3. Домены и сертификаты — живьём\n\n```\nshipshift.dev/app       200  tls_verify=0      custombot.space       302  tls_verify=0\npanel.shipshift.dev     200  tls_verify=0      www.custombot.space   302  tls_verify=0\nacme.shipshift.dev      302  tls_verify=0      setpomo.com           302  tls_verify=0\nglobex.shipshift.dev    302  tls_verify=0      www.setpomo.com       302  tls_verify=0\ninitech.shipshift.dev   302  tls_verify=0      shiftship.dev         502  ← см. §5\n```\n\n`tls_verify=0` = сертификат Let's Encrypt проверен без `-k`.\n\n## 4. Домен из панели → живой сертификат без редеплоя: **70 секунд**\n\nЭто то, что Иван просил увидеть. Замер полный, с обеих сторон:\n\n```\nT+0s    POST /tenants/domains {\"host\":\"probe.custombot.space\"}   (вызов, который делает экран Domains)\nT+19s   mt-ingress-sync записал хост в /data/coolify/proxy/dynamic/mt-tenants.yml   (интервал 15 с)\nT+70s   https://probe.custombot.space -> 302, ssl_verify_result=0   (сертификат выпущен)\n```\n\nОбратный ход тоже проверен: DELETE домена → через 25 с хоста нет в `mt-tenants.yml`.\nПробный хост и его A-запись в Cloudflare удалены после замера (созданы этой же сессией минутами\nраньше, своё собственное output).\n\nОговорка честности: я мерил **вызов API, который делает панель**, а не клик в браузере —\nбраузерного инструмента у этой сессии нет. Клик остаётся за приёмщиком.\n\n## 5. shiftship.dev — не «домен не поднялся», а конфликт с живым продуктом\n\n```\n/data/coolify/proxy/dynamic/0ui-custom-shiftship.dev.yml\n  # Auto-generated by upready-studio-api — verify-domain handler\n  rule: \"Host(`shiftship.dev`)\"   priority: 100   service: http://upready-studio-api:4130\n```\n\nФайл написан 2026-05-03 обработчиком verify-domain **upready studio**. У нашего роутера приоритета\nнет (по умолчанию = длина правила), поэтому traefik выбирает чужой — а контейнер\n`upready-studio-api` в статусе `Exited (137) 7 days ago`. Отсюда 502.\n\nНичего не трогал: чужой проект, чужой файл. Развилка — Ивану, §7.\n\n## 6. Дефекты, подтверждённые на живом продукте\n\n- **A4, имя магазина.** Все пять витрин отдают `\u003ctitle>Shipshift\u003c/title>` —\n  `NEXT_PUBLIC_SITE_NAME` вшит build-аргументом в один образ. `GET /storefront/by-host` уже отдаёт\n  `tenant.name`, менять надо 15 мест импорта `SITE_NAME`.\n- **Категории не изолированы.** `acme.shipshift.dev` и `globex.shipshift.dev` отдают ОДИН и тот же\n  список из 20 категорий всех трёх профилей: магазин кроссовок предлагает «The kitchen», магазин\n  посуды — «Footwear» и «Audio». Витрина ходит в глобальный `/store/product-categories`\n  (`apps/storefront/src/lib/data/categories.ts:14,115`), хотя `GET /tenants/product-categories` и\n  линк `tenant-product-category` (волна 2) уже есть, а seed-mt-demo категории к тенанту не привязывает.\n- **Картинок категорий нет** — поля нет в ядре Medusa. Решение оркестратора принято ДО кода:\n  `product_category.metadata.image_url` (+ `image_alt`). Обоснование — в брифе W3.\n\n## 7. Что осталось и что блокировано\n\nГотовы три брифа под соло- или агентское исполнение:\n`artifacts/prompts/2026-09-12-w{1,2,3}-*.md` (имя магазина / категории / картинки и hero), каждый со\nсвоим worktree (`feat/mt-sitename`, `feat/mt-categories`, `feat/mt-cat-images`, все от `21c6c93`).\nФан-аут **не запущен**: правило 3b требует показать Ивану план деградации до спавна, хук это\nостановил — справедливо.\n\nСтраница ссылок (задача 4 брифа) не начата: она имеет смысл после §6.\n\n---\n\n## 8. Продолжение 2026-09-12 (ответы Ивана получены)\n\n**Третий домен — вариант (в), исполнено.** `shiftship.dev` и `www.shiftship.dev` сняты с тенанта\nInitech через продуктовый путь (`DELETE /tenants/domains/:id` под сессией актора `tenant`,\n`admin@initech.test`), ответ `{\"deleted\":true}` по обоим. Через интервал синхронизации хоста не\nстало в `/data/coolify/proxy/dynamic/mt-tenants.yml` — там остались ровно пять витринных хостов:\n`acme.shipshift.dev`, `globex.shipshift.dev`, `initech.shipshift.dev`, `custombot.space`,\n`setpomo.com` (+ `www.`-двойники). Публично `shiftship.dev` по-прежнему отдаёт 502 — это чужой\nроутер студии с `priority: 100` на её же контейнер `upready-studio-api` в статусе Exited; это и\nозначает «вернуть хост студии», чинить его приложение — не наша работа. Initech остался на\nтехническом поддомене.\n\n**Фан-аут — свёрнут в ОДНОГО воркера (решение Ивана 2.5.1).** Три worktree (`feat/mt-sitename`,\n`feat/mt-categories`, `feat/mt-cat-images`) удалены неиспользованными (ноль своих коммитов),\nвместо них — `feat/mt-tenant-identity` от `09d5408` (текущая вершина `feat/mt-deploy`, а не от\n`c2418ea`: так воркер получает уже слитые переименование студийной панели и восстановленные\nсгенерированные файлы витрины). Бриф-обёртка — `artifacts/prompts/2026-09-12-w-tenant-identity.md`,\nтри исходных брифа W1/W2/W3 остаются его содержанием, порядок W1 → W2 → W3, коммит после каждой\nзадачи. Модель воркера — Sonnet 5 (правило 5e: механика по спеке; ловушка `use client` названа в\nбрифе вместе с `~/r/19g.md`), ревью и мерж — на мне, Opus.\n\n**Замер, из-за которого стоило свернуть иначе, чем думали.** Init трёх агентов ≈ 3 × 45k = 135k —\nцифра верная, но это 0.5–1.5% того, что агент тратит за 20 минут работы (медиана Opus-сабагента —\n7.2M токенов при boot 36k). Платит не старт, а оборот контекста: за 7 дней по всем проектам\n5.63 млрд токенов, из них 97.2% — перечитывание контекста, 0.66% — полезный выход, 0.46% — весь\nboot. Замер и инструмент: `file:///Users/ivanprotsko/upready/memory/agent-init-token-footprint-2026-09-12.md`,\n`file:///Users/ivanprotsko/upready/artifacts/deliverables/agent-usage/`.\n"},{"id":"artifacts-docs-2026-09-12-mt-deploy-acceptor-state-md","group":"nights","path":"artifacts/docs/2026-09-12-mt-deploy-acceptor-state.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/artifacts/docs/2026-09-12-mt-deploy-acceptor-state.md","title":"Состояние для приёмщика","note":"что измерено, что нет","bytes":4621,"text":"# Состояние МТ-деплоя на момент передачи (2026-09-11, вечер, session_01HqysBVaN4S8qDwkauRQdvB)\n\nПриказ Ивана: продолжать в режиме оркестрации — эта сессия становится **приёмщиком**, работу делает\nотдельный **оркестратор** по брифу `artifacts/prompts/2026-09-12-mt-deploy-orchestrator.md`.\n\n## Что СДЕЛАНО и чем это проверено\n\n| Пункт | Состояние | Чем подтверждено |\n|---|---|---|\n| Ветка `feat/mt-deploy` = волна A + волна B | сделано | `fbdbdcf` (merge, 3 конфликта разрешены), `aeff2fe` (деплой-обвязка); `medusa build`/`tsc`/`medusa lint` rc=0, панель `tsc --noEmit` rc=0 — мои прогоны в этом worktree |\n| DNS на 4 зоны | применено | `node deploy/scripts/mt-dns-records.mjs` → «0 change(s) pending»; бэкап 27 записей до правки в `artifacts/deliverables/mt-deploy/dns-backup-2026-09-11.json` |\n| Образы собраны на хосте | сделано | лог `/opt/upready-store/mt-build.log`; backend build 31 с, storefront `next build` 11/11 страниц |\n| Контейнеры | ЧАСТИЧНО | замер 2026-09-11 \\~23:5x: `mt-postgres` healthy, `mt-backend` health: starting, `mt-ingress-sync` up, `mt-panel`/`mt-storefront` Created (ждут здоровья бэкенда) |\n\n**Ничего из живого ещё не принято.** Ни один домен я не открывал после деплоя, ни одного сертификата\nне видел, сид не запускал. Всё, что ниже слова «осталось», — не сделано.\n\n## Осталось (это и есть работа волны)\n\n1. Дождаться здоровья `mt-backend` (первая загрузка гонит миграции + сид профиля sneakers +\n   composition + ensure-accounts), затем поднять `mt-panel` и `mt-storefront`.\n2. Сид: `home-goods` и `electronics` вторым и третьим прогоном `initial-data-seed.js`, затем\n   `seed-mt-demo.js` (три тенанта, каталоги, темы, домены).\n3. Проверить живьём: `shipshift.dev/app`, `panel.shipshift.dev`, три домена тенантов, сертификаты.\n4. Четыре задачи Ивана из брифа: имя магазина, категории, изображения категорий и hero, и страница\n   ссылок (оплата → онбординг, онбординг нового прототипа, ночные документы и схемы).\n\n## Развилки, которые несёт приёмщик\n\n- **Сколько доменов.** Первый приказ (вечер): `custombot.space`, `setpomo.com`, `shiftship.dev`.\n  Второй (при передаче): `custombot.space`, `shiftship.dev`. DNS и `seed-mt-demo.ts` сейчас\n  настроены на все три (Acme → custombot.space, Globex → setpomo.com, Initech → shiftship.dev).\n  Снимать третий — только по слову Ивана.\n- **Имя магазина в витрине** сегодня вшито в образ (`NEXT_PUBLIC_SITE_NAME`) — это дефект A4, а не\n  настройка. Пункт «разное название» без правки кода не закрывается.\n- **Картинка категории** в Medusa полем не хранится. Механизм выбирает оркестратор и объявляет его\n  ДО кода.\n- Дыра изоляции `t-2026-09-11-01` открыта; волна не должна её расширять.\n\n## Что я поменял снаружи репозитория (для отката)\n\n- Cloudflare: 14 правок в 4 зонах. Заменены парковочные CNAME апексов `custombot.space`,\n  `setpomo.com` (и их `www`) на `sell-domain-97s.pages.dev` и `www.shiftship.dev` → `0ui.dev`.\n  Полный дамп «как было» — в `dns-backup-2026-09-11.json`.\n- Хост Contabo: новый каталог `/opt/upready-store/mt`, проект docker compose `mt` (5 контейнеров),\n  файл `/data/coolify/proxy/dynamic/mt-tenants.yml` пишется контейнером `mt-ingress-sync`.\n  Пять старых стендов и agent-creatr не тронуты.\n"},{"id":"artifacts-docs-2026-09-12-tenant-panel-defects-md","group":"nights","path":"artifacts/docs/2026-09-12-tenant-panel-defects.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/artifacts/docs/2026-09-12-tenant-panel-defects.md","title":"Дефекты панели","note":"список","bytes":383,"text":"# Дефекты приёмки волны 2 панели тенанта (12.09.2026)\n\nПишет утренний приёмщик, читает оркестратор. Одна строка = один дефект: шаг воспроизведения → ожидаемое → фактическое. Пустой список = принято.\n\n## Дефекты\n\n(пусто)\n"},{"id":"artifacts-docs-2026-09-12-paywall-onboarding-demo-requirements-md","group":"demo-docs","path":"artifacts/docs/2026-09-12-paywall-onboarding-demo-requirements.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/artifacts/docs/2026-09-12-paywall-onboarding-demo-requirements.md","title":"Требования Ивана","note":"заказ целиком","bytes":5294,"text":"# Тестовый UI «оплата → онбординг» на shiftship.dev — требования Ивана (2026-09-12, ночь)\n\nЗаказ дословно: «по адресу `www.shiftship.dev` и `shiftship.dev` я вижу текст \"Bad gateway\", давай\nтам разместим тестовый UI для перехода на сценарий тестовой оплаты». Ниже — четыре входа, которые\nон назвал, и прямой вход в онбординг.\n\n## Что должно открываться с холодного старта\n\nОдна страница-витрина сценариев на `shiftship.dev` (и `www.`), каждая карточка — рабочий вход:\n\n1. **Прямая оплата.** Перейти к тестовой оплате → ввести данные карты → нажать «Оплатить» →\n   попасть на страницу онбординга с настройками своего магазина.\n2. **Услуга + тариф.** Выбрать услугу, затем тариф → оплата (как в п.1) → онбординг.\n3. **Только тариф.** Услуга подразумевается единственной: выбор тарифа → оплата → онбординг.\n4. **Только услуга.** У услуги подразумевается единственный тариф: выбор услуги → оплата →\n   онбординг.\n5. **Онбординг напрямую** — отдельная ссылка, входящая в сценарий онбординга без оплаты.\n\nСмысл набора: Иван сравнивает ЧЕТЫРЕ формы воронки на одном стенде, а не одну «правильную».\nКаждая карточка ведёт в свой поток целиком, не в заглушку.\n\n## Что уже есть в репозитории (не строить заново)\n\n- `docs/multitenancy/onboarding-spec.md` — дизайн онбординга волны B (спека, не реализация).\n- `apps/storefront/src/modules/checkout/components/demo-card-fields/` — демо-форма карты стендов:\n  отклоняет оплату по номеру, начинающемуся с `0000`, до `placeOrder`\n  (`~/upready/memory/stands-deploy-decisions-2026-09-09.md`).\n- `apps/storefront/src/lib/data/onboarding.ts` и `modules/order/components/onboarding-cta/` — это\n  онбординг СТАРТЕРА Medusa (подсказка в админке), НЕ онбординг тенанта. Не путать.\n- Тенант создаётся `POST /tenants`
