et"},{"href":"https://panel.shipshift.dev","label":"Панель владельца магазина","note":"admin@acme.test / supersecret"},{"href":"https://shipshift.dev/storefront/by-host?host=acme.shipshift.dev","label":"Как движок отвечает по Host","note":"JSON: тенант, ключ, тема, главная"}]}],"docGroups":[{"id":"specs","title":"Спеки мультитенантности"},{"id":"briefs","title":"Брифы ночи 2"},{"id":"nights","title":"Отчёты ночей"},{"id":"demo-docs","title":"Демо «оплата → онбординг»"}],"docs":[{"id":"docs-multitenancy-storefront-by-host-md","group":"specs","path":"docs/multitenancy/storefront-by-host.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/storefront-by-host.md","title":"Витрина по Host","note":"как хост становится магазином","bytes":9447,"text":"# Витрина одна на всех: тенант по Host (дизайн куска 9, до кода)\n\nЗадача `t-2026-09-12-mt-storefront-by-host`. Автор — архитектор волны 2 (session_01477g3q3qsvgSsc4QHptDUh), 11.09.2026 \\~09:00 WITA. Файл — единственный документ сессии A в `docs/multitenancy/**` (приказ Ивана в details задачи); остальное в этом каталоге — сессии B.\n\n## 1. Как сейчас (замерено 11.09 08:05–08:45)\n\n- Три процесса `next-server` из одного `apps/storefront` (:8000/:8001/:8002), у каждого свой `NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY` в окружении; ключ читается в двух местах: `src/middleware.ts:7` (запрос регионов) и `src/lib/config.ts:14` (SDK). По Host ничего не резолвится.\n- Тема — build-time: `app/layout.tsx` ставит `data-theme`/`data-mode` на `\u003chtml>` из `readProfileTheme()` (профиль сборки `NEXT_PUBLIC_STORE_PROFILE`); пресетов семь: `electronics, geist, home-goods, medusa, sneakers, supplements, womens-fashion` (`lib/theme/presets.generated.ts`, CSS `styles/themes.css` по атрибутам). Пресеты ПОДХОДЯТ — минимальный свой пресет не нужен, развилки нет.\n- Композиция главной — `store.metadata.storefrontSettings` (одна на весь backend, `GET /store/storefront-settings`); per-tenant документ — `tenant_home_config` (кусок 8, схема в `docs/tenant-panel/api-contract.md`, «Piece 8»).\n- `/store/*` целиком закрыт глобальным гейтом publishable key: `GET /store/custom` без заголовка → 400 «Publishable API key required» (замер на :9026). Значит резолвер ключа не может жить под `/store/*`.\n\n## 2. Целевая модель\n\n**Домены.** Таблица `tenant_domain` (id `tdom_…`, `host` unique, `tenant_id`; миграция Migration20260911004426 накатана). Хранятся кастомные хосты в нижнем регистре без порта (`petya.com`, `shop.petya.com`). **Технический субдомен `\u003chandle>.upready.dev`** (база — `upready.dev`, Иван 11.09 08:5x) не хранится: он выводится из `tenant.handle` (уже unique) и списка базовых доменов `TENANT_BASE_DOMAINS` (env бэкенда, по умолчанию `upready.dev,localhost`; `localhost` — чтобы стенд отвечал на `acme.localhost`). Так инвариант «у тенанта всегда есть технический субдомен» держится конструкцией: строку нельзя удалить, потому что её нет. Уникальность между тенантами: индекс на `host` + при POST проверка, что хост не равен `\u003cчужой handle>.\u003cбаза>`; коллизия → 409 `DUPLICATE_ERROR`.\n\n**Резолвер.** `GET /storefront/by-host?host=\u003chost>` — публичный, без ключа и без auth (namespace `/storefront/*`, не `/store/*` — см. §1; express `app.use(\"/store\")` не матчит `/storefront`, это проверяется seam-тестом «без ключа → 200»). Алгоритм: хост в нижний регистр, порт отрезать; (1) точное совпадение в `tenant_domain`; (2) иначе если хост = `\u003cx>.\u003cбаза>` для одной из баз — тенант по `handle = x`; (3) иначе 404. Ответ:\n\n```\n{ tenant: { id, handle, name },\n  publishable_key: \"pk_…\",              // tenant.api_key.token через link tenant-api-key\n  theme: { preset, mode } | null,       // из tenant_home_config.config.theme / settings.defaultMode\n  settings: StorefrontSettingsInput | null,\n  home: TenantHome | null }             // весь документ куска 8\n```\n\nКлюч не секрет (он в HTML каждой витрины), поэтому анонимный маршрут допустим. Кэш ответа на стороне витрины — 60 с на хост в памяти процесса (Map в middleware, как `regionMapCache`), инвалидация по времени; «новый тенант без рестарта» = его хост впервые спрашивается и тут же находится.\n\n**Панель.** `GET /tenants/domains` → `{ domains: [{id, host}], technical: [\"acme.upready.dev\", \"acme.localhost\"] }`, `POST /tenants/domains {host}`, `DELETE /tenants/domains/:id`. Экран «Domains» в панели — своя простая страница (`/settings/domains`, ссылка из обзора): технические хосты read-only, список кастомных с добавлением/удалением; DNS-инструкция одной строкой: «CNAME → `stores.upready.dev`» (Иван 11.09: wildcard `*.upready.dev`, CNAME-target `stores.upready.dev`, on-demand TLS для кастомных доменов — реализация прокси/TLS в hosting-spec B4 сессии B, не в этом куске). Админка магазинов (сессия B, `/admin/tenants/*`) может показать те же данные позже — из тех же строк.\n\n**Витрина.**\n1. `src/middleware.ts`: по `request.headers.get(\"host\")` вызывает резолвер (кэш 60 с); при 404 — single-store fallback: ключ из `NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY`, тема из профиля (сегодняшнее поведение, ничего не ломается). Найденное кладётся в заголовки запроса (`NextResponse.next({ request: { headers } })`): `x-tenant-key`, `x-tenant-handle`, `x-tenant-theme`, `x-tenant-mode`. Запрос регионов в middleware использует ключ тенанта.\n2. `src/lib/config.ts`: SDK создаётся без `publishableKey`; обёртка `sdk.client.fetch` (уже есть — добавляет `x-medusa-locale`) дописывает `x-publishable-api-key` из `headers()` (`next/headers`, серверный код) или из env-fallback. `fetchWithoutLocale` получает ту же подпись. Клиентские вызовы SDK из браузера (если есть) берут ключ из `\u003cmeta name=\"x-tenant-key\">`, который кладёт `app/layout.tsx` — воркер измеряет, есть ли такие вызовы (`grep -rn \"sdk\\.\" src --include=*.tsx | grep -v \"use server\"`).\n3. Кэш: теги `getCacheOptions()` получают суффикс handle тенанта (`products-\u003chandle>`…), `POST /api/revalidate` принимает необязательный `handle` — иначе один `force-cache` отдаст каталог Acme посетителю Globex.\n4. `app/layout.tsx`: `data-theme`/`data-mode` из заголовков, иначе профиль (как сейчас). `(main)/page.tsx` — документ тенанта (кусок 8) вместо `getStorefrontSettings()`, когда он есть.\n5. Витрина поднимается ОДНА: `next dev -p 8010` (стенд оркестратора; :8000–:8002 старого стенда не трогаем до приёмки). `acme.localhost` и `globex.localhost` резолвятся в 127.0.0.1 без /etc/hosts (Chrome и curl `--resolve`).\n\n## 3. Приёмка (критерии задачи, как проверяются)\n\n| Критерий | Проверка |\n|---|---|\n| один процесс, разные каталоги и темы | `curl -s http://acme.localhost:8010/en/store \\| grep -o product-wrapper \\| wc -l` = 9, для globex = 3; `data-theme` в `\u003chtml>` разный (acme `sneakers`/dark, globex `home-goods`/light — сидируется через `PUT /tenants/home`); скриншоты обеих в `artifacts/docs/tenant-panel-shots/storefront-{acme,globex}.png` |\n| ключ не из env | витрина стартует БЕЗ `NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY` и отдаёт каталоги; с env-ключом и неизвестным хостом (`localhost:8010`) — single-store режим |\n| домены в БД, правятся из панели | `POST /tenants/domains {host:\"acme.example\"}` → резолвер отвечает по `acme.example` (curl `--resolve`) |\n| новый тенант без рестарта | `POST /tenants` (регистрация) → `http://\u003chandle>.localhost:8010` открывается |\n| seam + e2e + tsc/lint | `tenants-domains.spec.ts` (резолвер без ключа 200, чужой домен 409, B не видит доменов A), e2e витрины двух хостов, `tsc`/`next lint` rc 0 |\n\n## 4. Что НЕ входит\n\nПрокси/wildcard TLS/on-demand сертификаты (hosting-spec B4, сессия B); удаление тенанта; перенос старых стендов :8000–:8002 на один процесс (делает утренний приёмщик, когда примет кусок 9).\n"},{"id":"docs-multitenancy-hosting-spec-md","group":"specs","path":"docs/multitenancy/hosting-spec.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/hosting-spec.md","title":"Хостинг","note":"топология, ingress, замеры (есть диаграмма)","bytes":30695,"text":"# Сервер и хостинг при росте тенантов (7.4)\n\nДата: 2026-09-11. Коммит на момент замеров: `816dddc` (ветка `feat/mt-platform`). Автор — воркер\nW6 ночной волны платформы (`docs/multitenancy/2026-09-11-night-2-platform-brief.md`, часть B4).\n\nКаждое число ниже — либо замер на локальном стенде (скрипт + сырой вывод рядом,\n`artifacts/docs/platform-measurements/`), либо факт со страницы прайсинга/доков провайдера\n(`artifacts/research/2026-09-11-hosting/source-*.md`), либо цитата из файла памяти с путём. Где\nизмерить не удалось — сказано прямо, число не придумано.\n\n## 1. Где сейчас прод\n\nПрод upready-store сегодня — **пять демо-стендов на том же Contabo VPS, где уже стоит\n`agent-creatr`** (Иван, чат 2026-09-09 \\~22:00 — `~/upready/memory/stands-deploy-decisions-2026-09-09.md`):\n\n- Хост: `root@84.46.251.149` (Contabo), ключ `~/.ssh/id_ed25519_contabo` —\n  `~/upready/memory/agent-creatr-prod-deploy-contabo.md`.\n- Оркестрация: Coolify на этом хосте, но наши контейнеры **не через UI Coolify** — свой\n  `docker compose` в сети `coolify`, traefik-лейблы на уже работающий `coolify-proxy` (entrypoints\n  `http`/`https`, резолвер `letsencrypt`, HTTP-01), Cloudflare DNS зоны `upready.dev` с\n  `proxied=false` — `~/upready/memory/agent-creatr-prod-deploy-contabo.md`.\n- Стенды: `kerbstone|ferrite|scruple|larchant|long-morning.upready.dev` (+ `api-\u003cстенд>.`) —\n  `~/upready/memory/stands-deploy-decisions-2026-09-09.md`, раскладка на диске\n  `/opt/upready-store/\u003cстенд>` — `deploy/README.md` (этот worktree).\n- Замер живого хоста (`deploy/README.md`, «Stand one — measured 2026-09-10»): `free -m` → 11 960 MB\n  RAM всего, 7 121 MB available с уже поднятым Kerbstone-триплетом + Coolify + agent-creatr +\n  bpj-dev + verdaccio; `df -h /` → 193 GB всего, 107 GB свободно. Число ядер хоста в памяти **не\n  найдено** — не выдумываю.\n- Реальный footprint ОДНОГО стенда (RSS в состоянии покоя, `docker stats`): backend 331.1 MiB,\n  postgres 114 MiB, storefront 98.02 MiB — итого **≈543 MiB на стенд**. Источник — тот же раздел\n  `deploy/README.md`.\n- Архитектура сегодня — **процесс витрины на тенанта** (каждый стенд = свой `next-server`), что и\n  стало поводом для целевой архитектуры ниже: у одного worktree три параллельных `next-server`\n  держали до 2,6 GB Turbopack на 16 GB машине —\n  `~/upready/memory/decisions/2026-09-10-multitenancy-target-first-config-in-db.md`, последний\n  раздел.\n\nЭто прод стендов-демо, не прод самой платформы (админки магазинов/онбординга) — той сегодня в\nэксплуатации ещё нет, эта спека проектирует именно её хостинг.\n\n## 2. Замеры стенда\n\nВсе скрипты — `artifacts/docs/platform-measurements/`, сырой вывод рядом как\n`2026-09-11-\u003cwhat>.txt`. Стенд использовался ОБЩИЙ (та же Postgres на `:5433`, к которой в момент\nзамеров были параллельно подключены ещё 3-4 бэкенда других ночных сессий — `pg_stat_activity` во\nвремя нагрузочного теста показал 27 открытых соединений) — там, где это меняет интерпретацию\nчисла, сказано отдельно.\n\n| Метрика | Значение | Единица | Как измерено (скрипт) | Дата |\n|---|---|---|---|---|\n| RSS `medusa develop` (:9025) | 42 736 | KB (≈41.7 MB) | `ps -o rss -p \u003cpid>`, pid через `lsof -iTCP:9025`; `01-rss-develop.sh` | 2026-09-11 |\n| RSS `medusa start`, простой (:9027) | 79 232 | KB (≈77.4 MB) | `ps -o rss -p \u003cpid>` сразу после `Server is ready`; `2026-09-11-rss-start-idle.txt` | 2026-09-11 |\n| RSS `medusa start`, после нагрузки (:9027) | 53 776 | KB (≈52.5 MB) | `ps -o rss -p \u003cpid>` сразу после load.mjs; `2026-09-11-rss-start-load.txt` | 2026-09-11 |\n| Размер БД `upready_store_mt` | 51 149 847 (49 MB) | bytes | `pg_database_size`; `03-db-size.sh` | 2026-09-11 |\n| Крупнейшая таблица — `translation` | 20 922 368 (20 MB) | bytes | `pg_total_relation_size`, топ-10 в файле | 2026-09-11 |\n| Строк: `product` / `order` / `tenant` / `sales_channel` | 24 / 6 / 3 / 4 | шт | тот же скрипт | 2026-09-11 |\n| p95 `/store/products?limit=12`, develop (:9025), цель 50 rps | 51 786.09 | ms | `load.mjs`, 5s прогрев + 30s; достигнуто 24.1 rps (сервер — узкое место, открытый цикл планирования копит очередь) | 2026-09-11 |\n| p95 `/store/products?limit=12`, start (:9027), цель 50 rps | 205 135.35 | ms | тот же `load.mjs`; достигнуто 6.5 rps | 2026-09-11 |\n| `apps/backend/static` на этом worktree | не существует (0) | — | `du -sk` → No such file or directory; загрузок local-провайдером здесь не было | 2026-09-11 |\n| R2-бакет (`R2_BACKUP_*`) — число объектов/байт | пропущено | — | TLS handshake failure (alert 40) к `\u003caccount>.r2.cloudflarestorage.com`, воспроизведено node/curl/openssl; `api.cloudflare.com` и `example.com` с той же машины — нормальный handshake, см. `2026-09-11-r2-bucket.txt` | 2026-09-11 |\n| Память машины | 17 179 869 184 (16 GB) | bytes | `sysctl -n hw.memsize` | 2026-09-11 |\n| Ядер машины | 10 | шт | `sysctl -n hw.ncpu` | 2026-09-11 |\n| macOS | 26.2 | версия | `sw_vers -productVersion` | 2026-09-11 |\n| Node | v26.8.1 | версия | `node -v` | 2026-09-11 |\n| psql (клиент/сервер) | 17.11 / 16.13 | версия | `psql --version` / `select version()` | 2026-09-11 |\n\n**Честно про p95-строки.** Обе цифры (51.8 с и 205 с при цели 50 rps) — реальный вывод скрипта, но\nцикл открытый (`load.mjs` продолжает планировать запросы независимо от того, ответил ли сервер),\nи при таком насыщении очередь копится быстро — обе цифры показывают «сервер сильно не успевает за\n50 rps», а не «типичная задержка одного запроса». Сравнивать `develop` и `start` между собой этими\nчислами **нельзя без оговорки**: тест на `:9027` шёл позже теста на `:9025`, и `pg_stat_activity`\nв этот момент показал 27 открытых соединений — БД стенда делили минимум 4 параллельных бэкенда\n(мой плюс as минимум три других ночных сессии на `:9023`/`:9024`/своём порту). Что число `start`\nоказалось хуже `develop` — не диагноз «прод-сборка медленнее», а необъяснённая аномалия при общей\nнагрузке на общую БД; чистый (изолированный) повтор — открытый пункт (см. `OPEN` в возврате\nсессии). Качественный вывод, который эти цифры всё же подтверждают надёжно: **51 rps каталожных\nзапросов — уже перегрузка для одного бэкенд-процесса на этой машине**, независимо от режима; малое\nчисло тенантов (10-50) с типичной посещаемостью не подойдёт к этому порогу, но его стоит держать в\nуме при планировании второго инстанса витрины/бэкенда (§6).\n\nДля реалистичного «сколько ест бэкенд/витрина в проде» ниже (§5) используется в первую очередь\n**число из живого Contabo-стенда** (331 / 98 / 114 MiB, §1) — оно снято под настоящим\nDocker-лимитом и настоящим трафиком верификации, а не под пустым локальным процессом с 3\nтенантами; локальные RSS-цифры выше — нижняя граница (idle, без реального трафика, без S3/тем).\n\n## 3. Целевая топология\n\nОдин backend-процесс Medusa в режиме `workerMode` (опция `projectConfig.workerMode`,\n`node_modules/@medusajs/framework/dist/config/config.js:109-124`, допустимые значения\n`\"shared\" | \"worker\" | \"server\"`, по умолчанию `\"shared\"` — один процесс делает всё; для реального\nразделения сервер/воркер поднимаются ДВА процесса с `workerMode: \"server\"` и `workerMode:\n\"worker\"` соответственно) — PostgreSQL 17 — Redis — один мультитенантный процесс витрины (тенант\nрезолвится по `Host`, решение и задача `t-2026-09-12-mt-storefront-by-host`,\n`~/upready/memory/decisions/2026-09-10-multitenancy-target-first-config-in-db.md`) — статичная\nпанель тенанта — reverse proxy — R2.\n\n**Redis — не опционально для этой топологии.** Тот же `config.js` (строка \\~103) логирует «redisUrl\nnot found. A fake redis instance will be used» и подставляет ин-процессный фейковый Redis, когда\n`redisUrl` не задан — а два ОТДЕЛЬНЫХ процесса (`server` и `worker`) физически не могут делить\nин-процессную подделку между собой: без настоящего Redis `workerMode` со split server/worker не\nимеет смысла (см. §6).\n\n```mermaid\nflowchart TB\n    subgraph internet[\"Интернет\"]\n        visitor[\"Покупатель\u003cbr/>*.upready.dev или свой домен\"]\n        tenantadmin[\"Админ тенанта\u003cbr/>panel.upready.dev\"]\n        platformadmin[\"Админ платформы\u003cbr/>api.upready.dev/app\"]\n    end\n\n    proxy[\"Reverse proxy\u003cbr/>wildcard *.upready.dev + on-demand TLS\u003cbr/>(см. §4)\"]\n\n    subgraph app[\"Backend процессы (Medusa 2.19)\"]\n        server[\"medusa start\u003cbr/>workerMode=server\u003cbr/>HTTP API\"]\n        worker[\"medusa start\u003cbr/>workerMode=worker\u003cbr/>подписчики / workflow-шаги\"]\n    end\n\n    storefront[\"Витрина Next.js\u003cbr/>ОДИН процесс\u003cbr/>middleware резолвит тенанта по Host\"]\n    panel[\"Панель тенанта\u003cbr/>Vite, статика, /tenants/*\"]\n\n    pg[(PostgreSQL 17)]\n    redis[(Redis\u003cbr/>event-bus + workflow-engine + cache)]\n    r2[(Cloudflare R2\u003cbr/>tenants/&lt;id&gt;/...)]\n\n    visitor --> proxy\n    tenantadmin --> proxy\n    platformadmin --> proxy\n    proxy --> storefront\n    proxy --> panel\n    proxy --> server\n    storefront --> server\n    panel --> server\n    server --> pg\n    worker --> pg\n    server --> redis\n    worker --> redis\n    server --> r2\n```\n\n## 4. Прокси для доменов тенантов\n\n### Wildcard `*.upready.dev`\n\nКаждый тенант получает `\u003chandle>.upready.dev` с момента создания. DNS: **одна** wildcard-запись\n`A`/`AAAA` на IP прокси (`*.upready.dev → \u003cip proxy>`), сертификат — **один статический\nwildcard-сертификат** через DNS-01 (Cloudflare DNS-плагин), выпущенный заранее и продлеваемый по\nсвоему расписанию — НЕ через on-demand TLS: обе изученные системы (источники 5 и 6) требуют\nDNS-01 именно для wildcard и именно НЕ в связке с on-demand-выдачей (on-demand работает через\nHTTP-01/TLS-ALPN-01, DNS-01 просит знать домен заранее — несовместимо с «домен появился прямо\nсейчас, реши на лету»).\n\n### Кастомные домены (`vasya.com`, `petya.ru`)\n\n**Caddy** с On-Demand TLS: `on_demand_tls.ask` — эндпоинт бэкенда, который Caddy опрашивает перед\nвыпуском сертификата для незнакомого домена (источник 5). Предлагаемый (НЕ построенный) эндпоинт:\n`GET /store/tenant-domains/check?domain=` → 200 только если домен сохранён за каким-то тенантом,\nиначе 4xx — Caddy отказывает в выпуске. Рейт-лимит — общий ACME-лимит аккаунта (источник 5 даёт\nтолько общую цифру «10 попыток ACME на аккаунт за 10 секунд», специфического on-demand-лимита\nстраница не раскрыла — конкретное значение `interval`/`burst` для `on_demand_tls` не зафиксировано\nживьём, читать в доке `on_demand_tls` перед конфигурацией). Домен без записи в БД (Host, которого\nпрокси не знает) — **404/редирект на upready.dev, сертификат никогда не запрашивается** (`ask`\nотвечает отказом раньше, чем Caddy тронет ACME).\n\nКастомные домены проверяются **HTTP-01** (не DNS-01 — мы не владеем чужой зоной DNS; HTTP-01\nработает, потому что A-запись домена уже указывает на наш прокси — это ровно то, что тенант\nнастраивает по инструкции ниже).\n\n### DNS-инструкция для тенанта (как в панели, дословно)\n\n```\nЧтобы подключить свой домен к магазину:\n\n1. Зайдите в панель управления вашего регистратора домена (там, где вы его купили).\n2. Добавьте A-запись:\n   Тип:   A\n   Имя:   @  (или пусто — означает \"весь домен\")\n   Значение: \u003cIP прокси>\n   TTL:   3600 (или \"Auto\")\n\n   Если ваш регистратор поддерживает ALIAS/ANAME для корневого домена — можно использовать её\n   вместо A-записи, значение то же.\n\n3. (Рекомендуется) Добавьте CNAME для www:\n   Тип:   CNAME\n   Имя:   www\n   Значение: \u003chandle>.upready.dev\n   TTL:   3600\n\n4. Нажмите \"Проверить домен\" в этой панели.\n\nЧто происходит дальше: мы каждые несколько минут проверяем, куда указывает ваш домен (DNS-lookup).\nКак только он начнёт указывать на наш сервер, домен активируется автоматически и получит\nсобственный сертификат безопасности (HTTPS) — обычно это занимает от 5 минут до нескольких часов,\nэто время нужно вашему регистратору, чтобы разослать запись по всему интернету (DNS-пропагация,\nот нас не зависит).\n\nПока домен не активирован: ваш магазин продолжает работать по адресу \u003chandle>.upready.dev — ничего\nне сломается. Статус в этой панели будет показывать \"Проверяем DNS...\", а после активации сменится\nна \"Домен подключён\".\n```\n\nТехнический субдомен `\u003chandle>.upready.dev` **продолжает работать всегда**, даже после подключения\nкастомного домена — это одна и та же запись `domains` на одного тенанта, прокси просто отвечает на\nоба `Host`.\n\n### Как один `Host` превращается в конкретную витрину\n\n`reverse_proxy` прокси сохраняет заголовок `Host` без изменений (это поведение по умолчанию и у\nCaddy, и у Traefik) → единственный процесс витрины получает исходный `Host` → middleware витрины\nрезолвит тенанта по нему из БД (таблица доменов, задача `t-2026-09-12-mt-storefront-by-host`) →\nдостаёт publishable key и пресет темы тенанта → рендерит его магазин. Нормализация: `www.\u003cдомен>` и\nголый `\u003cдомен>` резолвятся в одного тенанта (по значению без `www.` в таблице доменов); домен,\nдля которого нет записи (например, отвязанный) — 404 на уровне витрины, отдельно от 404 на уровне\nпрокси для неизвестного `Host` вообще.\n\n### Caddyfile-набросок (≤40 строк)\n\n```caddyfile\n{\n\ton_demand_tls {\n\t\task https://api.upready.dev/store/tenant-domains/check\n\t}\n}\n\n# Wildcard-поддомены платформы — один статический сертификат, DNS-01.\n*.upready.dev {\n\ttls {\n\t\tdns cloudflare {env.CLOUDFLARE_API_TOKEN}\n\t}\n\treverse_proxy storefront:3000\n}\n\napi.upready.dev {\n\ttls {\n\t\tdns cloudflare {env.CLOUDFLARE_API_TOKEN}\n\t}\n\treverse_proxy backend:9000\n}\n\npanel.upready.dev {\n\ttls {\n\t\tdns cloudflare {env.CLOUDFLARE_API_TOKEN}\n\t}\n\treverse_proxy panel:80\n}\n\n# Кастомные домены тенантов — любой Host, не покрытый блоками выше,\n# приходит сюда; on_demand_tls решает через ask, стоит ли выпускать сертификат.\n:443 {\n\ttls {\n\t\ton_demand\n\t}\n\treverse_proxy storefront:3000\n}\n```\n\n## 5. Таблица роста\n\nДопущения (формулы, не цифры с потолка):\n\n- **DB(N) ≈ 20 MB (фикс: справочники/`translation`) + N × 10 MB.** Источник коэффициента: на\n  стенде 3 тенанта дают 49 MB суммарно, из них 20 MB — таблица `translation` (справочная, не\n  растёт с числом тенантов), остаток ≈29 MB / 3 ≈ 9.7 MB на тенанта, округлено до 10 MB (§2).\n  Экстраполяция за пределы измеренного диапазона (3 тенанта) — грубая, помечена курсивом в\n  таблице.\n- **Backend RSS на процесс ≈ 331 MiB** (реальный Docker-замер одного прод-бэкенда, §1) —\n  топология §3 держит backend ОДНИМ процессом (server) + вторым (worker) на всех тенантов сразу,\n  не по процессу на тенанта, так что это число почти не растёт с N до тех пор, пока хватает\n  connection pool к Postgres; после порога — второй `server`-инстанс за балансировщиком.\n- **Storefront RSS на процесс ≈ 98 MiB** (тот же прод-замер) — один процесс на ВСЮ платформу\n  (§3), растёт не с числом тенантов, а с одновременной посещаемостью; второй инстанс — по CPU/p95,\n  не по N (см. §6, CPU хоста в проде не измерено — открытый пункт).\n- **Файлы: $0.015/GB-month** (R2 Standard storage, источник 4) — без замера текущего объёма\n  бакета (TLS-фейл, §2), берём на объект дела по прайсу, не по факту.\n- **p95 headroom**: локальный замер (§2) показал насыщение уже на цели 50 rps каталожных\n  запросов ОДНИМ процессом при общей нагрузке на стенд — используется как качественный, не\n  количественный порог (число подтверждено, но замер делил БД с чужими сессиями).\n\n| Тенантов | Backend | Storefront | PG | Прокси | Цена/мес (провайдер, план) | Обоснование |\n|---|---|---|---|---|---|---|\n| 10 | 1× server (+1× worker опц.) | 1 инстанс | на том же VPS | 1 инстанс, статич. wildcard | Contabo Cloud VPS 4 (4 vCPU/8 GB) — **€5.50** (источник 2) | DB(10)≈120 MB, backend 331 MiB + storefront 98 MiB + PG 114 MiB ≈ 543 MiB — укладывается в 8 GB с большим запасом (тот же footprint, что уже держит один прод-стенд, §1) |\n| 50 | 1× server + 1× worker (Redis обязателен) | 1-2 инстанса | тот же VPS или managed | 1 инстанс | Contabo Cloud VPS 8 (8 vCPU/24 GB) — **€14.00** (источник 2) | DB(50)≈520 MB; split server/worker требует настоящего Redis (config.js, §3) — Redis-контейнер добавляет заметный, но не измеренный этой ночью footprint (открытый пункт) |\n| 200 | 2× server за балансировщиком + 2× worker | 2 инстанса за балансировщиком | managed PG | 1-2 инстанса прокси | Contabo Cloud VPS 16 (16 vCPU/64 GB) — **€37.00** + Neon Launch, метрика (источник 2, 3) | DB(200)≈2 GB — всё ещё в пределах self-host, но приближается к порогу §6; второй backend-инстанс — по насыщению 50 rps/процесс, замеренному в §2 |\n| 1000 | N× server за балансировщиком + N× worker | 3+ инстанса, CDN перед статикой | managed PG обязателен | балансировщик + wildcard/on-demand на отдельном узле | Contabo Cloud VPS 16 ×2-3 узла + Neon Scale, метрика (источник 2, 3) — точная сумма зависит от реального QPS/тенанта, не измеренного | DB(1000)≈10 GB — за порогом self-host (§6); при 543 MiB/стенд-эквивалент старой архитектуры 1000 отдельных витрин физически не влезли бы никуда — это ровно причина решения «одна витрина по Host» (§1) |\n\nHetzner в этой таблице не участвует ценой (§8, `source-1`: живые EUR-цифры не получены,\nJS-рендеринг), но его CX/CAX линейка (2 vCPU/4 GB … 16 vCPU/32 GB, NVMe) — прямая замена\nContabo-плана в каждой строке при том же порядке величин; см. §7.\n\n## 6. Пороги\n\n- **Managed PG вместо self-host: ориентировочно при DB(N) > 5-10 GB или N > 150-200 тенантов**\n  (экстраполяция формулы DB(N) из §5; при DB≈10 GB self-host на VPS уже конкурирует с диском и\n  бэкапами, а Neon Launch/Scale в этом диапазоне метрируется предсказуемо, источник 3).\n- **Второй инстанс витрины: когда p95 каталожных запросов на ОДИН процесс подходит к насыщению,\n  измеренному в §2 (около 50 rps на процесс на текущем железе стенда)** — это качественный\n  порог, не точная цифра для прод-железа (замер шёл на общей БД с чужой нагрузкой, §2); перед тем\n  как принимать решение о масштабировании в проде — переизмерить изолированно.\n- **Redis становится обязательным, как только `workerMode` разносится на `server` + `worker` в\n  разные процессы** — без настоящего `redisUrl` framework подставляет ин-процессную подделку\n  (`config.js` строка \\~103), которую два процесса делить не могут; до этого момента (режим\n  `shared`, один процесс) Redis нужен только для персистентности между рестартами кэша/очереди\n  событий, не для корректности.\n\n## 7. Развилка провайдера\n\n1. **Contabo** (рекомендация по умолчанию — уже проверенный хост). Причина: тот же провайдер уже\n   держит пять демо-стендов и `agent-creatr` живьём (§1) — нулевой риск незнакомой платформы,\n   реальные VPS-планы с ценами подтверждены (источник 2), traefik/Coolify-обвязка уже отлажена\n   (грабли с алиасами сетевых имён, entrypoint-именами — все найдены и закрыты на этом же хосте,\n   `~/upready/memory/agent-creatr-prod-deploy-contabo.md`).\n2. **Hetzner.** Причина рассмотреть: заметно более низкая цена за то же железо у конкурентов при\n   сопоставимых CX/CAX-планах (по неподтверждённым сегодня, но публично известным EUR-цифрам —\n   перепроверить калькулятором перед решением, §8/OPEN) и заявленный лучший сетевой перформанс в\n   EU; цена сегодня НЕ подтверждена живым фетчем (источник 1) — решение откладывается до момента,\n   когда кто-то откроет калькулятор руками.\n3. **Managed-платформа (Render/Railway/Fly.io — не проверялись этой ночью).** Причина\n   рассмотреть: ноль DevOps-работы на масштабирование и TLS (то, что здесь спроектировано в §3-4\n   руками), но заметно выше цена за единицу RAM/CPU и меньше контроля над on-demand TLS\n   custom-доменов (эта механика — ключевая часть продукта, §4) — обычно не первоклассная фича на\n   managed-PaaS, требует проверки конкретной платформы, не входила в объём этой ночи.\n\n**Что решает Иван:** зафиксировать Contabo (продолжение текущего хоста) или выделить время на\nподтверждение цен Hetzner живым калькулятором перед сравнением; managed-платформа — только если\nготовность отказаться от on-demand TLS кастомных доменов как first-class фичи приемлема.\n\n## 8. Источники\n\nЗамеры (все в `artifacts/docs/platform-measurements/`, эта ветка):\n- `01-rss-develop.sh` → `2026-09-11-rss-develop.txt`\n- `2026-09-11-rss-start-idle.txt`, `2026-09-11-rss-start-load.txt`\n- `03-db-size.sh` → `2026-09-11-db-size.txt`\n- `load.mjs` → `2026-09-11-load-develop-9025.txt`, `2026-09-11-load-start-9027.txt`\n- `2026-09-11-static-size.txt`\n- `05-r2-bucket.mjs` → `2026-09-11-r2-bucket.txt` (пропущено, диагностика внутри)\n- `06-machine.sh` → `2026-09-11-machine.txt`\n\nПрайсинг и документация (все в `artifacts/research/2026-09-11-hosting/`, дата фетча 2026-09-11):\n- `source-1-hetzner-cloud.md` — характеристики CX/CAX/CPX получены, живые цены EUR — нет (JS-рендер)\n- `source-2-contabo-vps.md` — Cloud VPS 4/6/8/12/16/18, цены получены\n- `source-3-neon-managed-postgres.md` — Free/Launch/Scale, цены получены\n- `source-4-cloudflare-r2-pricing.md` — Standard/Infrequent Access, цены получены\n- `source-5-caddy-on-demand-tls.md` — ask-эндпоинт, ограничения DNS-01/wildcard\n- `source-6-traefik-acme-reference.md` — `ref-acme.yaml` из `traefik/traefik@master`, нет ask-аналога\n\nПамять (упомянуты выше с путями): `agent-creatr-prod-deploy-contabo.md`,\n`stands-deploy-decisions-2026-09-09.md`,\n`decisions/2026-09-10-multitenancy-target-first-config-in-db.md`.\n\nКод: `apps/backend/medusa-config.ts`, `apps/backend/.env`, `deploy/compose.stand.yml`,\n`deploy/README.md`, `node_modules/@medusajs/framework/dist/config/config.js` (workerMode,\nredis-фейк).\n"},{"id":"docs-multitenancy-onboarding-spec-md","group":"specs","path":"docs/multitenancy/onboarding-spec.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/onboarding-spec.md","title":"Онбординг","note":"сценарий заведения магазина (есть диаграмма)","bytes":35776,"text":"# Онбординг после оплаты — спека (6.2, 6.2.1)\n\nАвтор: worker W4, ночь платформы 11→12.09.2026 (`feat/mt-platform`). Это СПЕКА, не код: ничего из\nописанного здесь не реализуется этой ночью. Основа — брифа B1 (`docs/multitenancy/2026-09-11-night-2-platform-brief.md`),\nконтракт `docs/multitenancy/admin-tenants-api-contract.md`, код `createTenantWorkflow`, и живая\nдокументация polar.sh / tribute.tg (fetch 2026-09-11, источники — §8; **никаких фактов о внешних\nсервисах из памяти модели**, 17a). Базовый домен платформы — `upready.dev`, технический поддомен\nтенанта — `\u003chandle>.upready.dev` (правка владельца, применена по всему документу).\n\n## 1. Цепочка\n\n```mermaid\nsequenceDiagram\n    actor Buyer as Покупатель\n    participant Site as upready.dev\n    participant Provider as polar.sh / tribute.tg\n    participant Hook as backend: POST /webhooks/{polar,tribute}\n    participant Platform as platform-модуль (account, purchase, onboarding_token)\n    participant Notify as Email / Telegram-бот\n    participant Wizard as tenant-panel: /onboarding/:token\n    participant Workflow as createTenantWorkflow\n    participant Panel as tenant-panel (авто-вход)\n\n    Buyer->>Site: открывает upready.dev, выбирает тариф\n    Site->>Provider: переход на checkout (Polar Checkout Link / Tribute product link)\n    Buyer->>Provider: оплачивает\n    Provider-->>Buyer: редирект на success_url (Polar) ИЛИ ничего (Tribute — платёж внутри Telegram)\n    Provider->>Hook: webhook: order.paid / newDigitalProduct / newSubscription (не trial)\n    Hook->>Hook: проверка подписи (webhook-signature HMAC-SHA256 / trbt-signature HMAC-SHA256)\n    Hook->>Platform: идемпотентно по provider_event_id: find-or-create account, create purchase(status=paid)\n    Platform->>Platform: create onboarding_token (случайные 32 байта, хранится хэш, TTL)\n    Platform->>Notify: письмо (Polar) или сообщение бота (Tribute) со ссылкой /onboarding/:token\n    Buyer->>Wizard: переходит по ссылке (email или Telegram)\n    Wizard->>Wizard: шаг 1 (название+handle) → шаг 2 (контакты) → шаг 3 (валюта/регион/язык) → пароль\n    Wizard->>Workflow: createTenantWorkflow(name, handle, admin{email,password}, authIdentityId)\n    Workflow-->>Wizard: tenant + sales_channel + api_key + склад + первый админ\n    Wizard->>Platform: onboarding_token.used_at = now; link account↔tenant\n    Wizard->>Panel: авто-вход (та же сессия/токен, что POST /auth/tenant/emailpass выдал бы)\n```\n\nПронумерованный ход событий:\n\n1. Покупатель на `upready.dev` выбирает тариф или товар (страница тарифов; в эту ночь сайт не\n   трогаем, но контракт для неё — §4).\n2. Переход к оплате: Polar Checkout Link (долгоживущий URL организации) или Tribute product\n   link/webLink (открывается внутри Telegram). Выбор способа оплаты живёт на стороне upready.dev.\n3. Оплата проходит на стороне провайдера. Polar может отредиректить браузер на `success_url` с\n   `checkout_id={CHECKOUT_ID}`; Tribute редиректа не документирует — платёж целиком внутри Telegram\n   (источник 6, §4 ниже разводит эти два случая явно).\n4. Провайдер шлёт вебхук (`order.paid` для Polar; `newDigitalProduct` / `newSubscription` /\n   `renewedSubscription` с `type != \"trial\"` для Tribute) на `POST /webhooks/polar` или\n   `POST /webhooks/tribute`.\n5. Хендлер проверяет подпись, идемпотентность по `provider_event_id`, находит/создаёт `account`,\n   создаёт `purchase` со статусом `paid`.\n6. Хендлер создаёт `onboarding_token`, привязанный к `purchase`, и отправляет ссылку получателю —\n   письмом (email есть всегда, включая Polar-путь) или сообщением бота (обязательно для Tribute, т.к.\n   redirect недоступен).\n7. Покупатель открывает `/onboarding/:token` в `apps/tenant-panel` (PublicLayout, без сайдбара —\n   как `routes/login`), проходит три шага мастера (§5), задаёт пароль.\n8. Мастер на финише вызывает тот же `createTenantWorkflow`, что и `POST /admin/tenants` (контракт,\n   §6), с `authIdentityId` от только что зарегистрированной emailpass-идентичности.\n9. `onboarding_token.used_at` проставляется, `account` линкуется к новому `tenant`, покупатель\n   автоматически входит в `apps/tenant-panel` (тот же токен, что выдал бы `POST /auth/tenant/emailpass`).\n\n## 2. Модель `platform` (новый модуль Medusa `src/modules/platform`, НЕ этой ночью)\n\nОтдельный модуль, а не расширение `modules/tenant` — граница ночи (админ-контракт §3c бриф-документа):\n`tenant` ничего не знает о деньгах, `platform` ничего не знает о складе/канале. Связь `account` ↔\n`tenant` — модульный линк (`src/links/account-tenant.ts`, по образцу `tenant-sales-channel.ts`), не\nколонка: один `account` может обзавестись 0..N тенантами со временем (не только в момент покупки —\nFork №2 решает, сколько тенантов даёт один `purchase`).\n\n### `account`\n\n| Поле | Тип | Примечание |\n|---|---|---|\n| `id` | `model.id({ prefix: \"acc\" })` | PK |\n| `email` | `text`, nullable | обязателен для Polar-пути; может отсутствовать у чисто Telegram-покупателя, пока Fork №1 не решён |\n| `telegram_id` | `text`, nullable, unique когда не null | обязателен для Tribute-пути |\n| `name` | `text`, nullable | из checkout (Polar `customer_name`) или из Telegram-профиля |\n| `created_at` / `updated_at` | timestamps | стандартные Medusa-поля модели |\n\n### `purchase`\n\n| Поле | Тип | Примечание |\n|---|---|---|\n| `id` | `model.id({ prefix: \"pur\" })` | PK |\n| `account_id` | `text` (FK через связь `belongsTo`) | владелец покупки |\n| `provider` | `enum: polar \\| tribute \\| manual` | `manual` — Fork №4 (ручная покупка из админки) |\n| `provider_event_id` | `text`, **UNIQUE** | идемпотентность вебхука: id события у провайдера (Polar: id объекта `order`/`subscription` события, не id самого webhook-запроса — ретрай шлёт то же событие повторно; Tribute: `purchase_id` из payload, источник 5) |\n| `provider_customer_id` | `text`, nullable | Polar: `customer.id`; Tribute: `telegram_id` покупателя (нет отдельного customer id в документации, источник 6) |\n| `plan` | `text` | slug тарифа/продукта на стороне платформы, НЕ id продукта у провайдера напрямую (провайдер может переименовать/удалить продукт; маппинг `provider_product_id → plan` — конфиг платформы, не хранится здесь) |\n| `status` | `enum: paid \\| refunded \\| expired` | `expired` — Fork №2 (срок действия тарифа) может его проставлять фоновой задачей, не вебхуком |\n| `paid_at` | timestamp, nullable | из payload события |\n| `amount` | `integer` | минорные единицы (центы/копейки — как у обоих провайдеров) |\n| `currency` | `text` | ISO-код из payload |\n| `raw_payload` | `json` | весь тело вебхука как пришло — для отладки и повторной обработки без нового вызова провайдера |\n| `created_at` / `updated_at` | timestamps | |\n\nJSON Schema `purchase` (для валидации при записи, не для API-ответа — `raw_payload` в схему не\nвключён намеренно, это сырьё):\n\n```json\n{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"title\": \"purchase\",\n  \"type\": \"object\",\n  \"required\": [\"id\", \"account_id\", \"provider\", \"provider_event_id\", \"plan\", \"status\", \"amount\", \"currency\"],\n  \"properties\": {\n    \"id\": { \"type\": \"string\", \"pattern\": \"^pur_\" },\n    \"account_id\": { \"type\": \"string\", \"pattern\": \"^acc_\" },\n    \"provider\": { \"type\": \"string\", \"enum\": [\"polar\", \"tribute\", \"manual\"] },\n    \"provider_event_id\": { \"type\": \"string\" },\n    \"provider_customer_id\": { \"type\": [\"string\", \"null\"] },\n    \"plan\": { \"type\": \"string\" },\n    \"status\": { \"type\": \"string\", \"enum\": [\"paid\", \"refunded\", \"expired\"] },\n    \"paid_at\": { \"type\": [\"string\", \"null\"], \"format\": \"date-time\" },\n    \"amount\": { \"type\": \"integer\", \"minimum\": 0 },\n    \"currency\": { \"type\": \"string\", \"minLength\": 3, \"maxLength\": 3 },\n    \"created_at\": { \"type\": \"string\", \"format\": \"date-time\" },\n    \"updated_at\": { \"type\": \"string\", \"format\": \"date-time\" }\n  }\n}\n```\n\n### `onboarding_token`\n\n| Поле | Тип | Примечание |\n|---|---|---|\n| `id` | `model.id({ prefix: \"obt\" })` | PK |\n| `purchase_id` | `text` (FK через `belongsTo`) | одна покупка может породить несколько токенов (перевыпуск при истечении — см. §4) |\n| `token` | `text`, unique | случайные 32 байта, **хранится хэш** (sha256), не сырое значение — сырое значение уходит только в ссылку и никогда не пишется в БД в открытом виде (тот же принцип, что у auth-токенов) |\n| `expires_at` | timestamp | решение о длительности — §4 |\n| `used_at` | timestamp, nullable | проставляется мастером на финише; повторный визит по использованному токену → страница «уже использовано» |\n\nСвязь `account` ↔ `tenant`: модульный линк 1:N, `src/links/account-tenant.ts`\n(`{ platform: { account_id } } ↔ { tenant: { tenant_id } }`), записывается мастером в том же шаге, что\nи `onboarding_token.used_at`.\n\n## 3. Вебхуки `POST /webhooks/polar`, `POST /webhooks/tribute`\n\nОба маршрута публичные (без admin/tenant middleware — провайдер не аутентифицирован как пользователь\nплатформы), защита — только проверкой подписи. Тело читается как raw bytes ДО парсинга JSON (подпись\nсчитается по сырому телу у обоих провайдеров).\n\n### Проверка подписи\n\n- **Polar** (источник 1): заголовок `webhook-signature`, HMAC-SHA256. Секреты, выпущенные с\n  2026-09-08, следуют спецификации Standard Webhooks (секрет `whsec_…` передаётся библиотеке как есть);\n  более старые секреты — собственная схема Polar HMAC (секрет нужно предварительно base64-закодировать\n  перед тем же кодом проверки). Точная конструкция подписываемой строки не была дословно\n  воспроизведена фетчем — перед кодом сверить с SDK Polar (`@polar-sh/sdk`, если появится в\n  `node_modules`) или со спекой Standard Webhooks, а не угадывать (19d/17a).\n- **Tribute** (источник 5): заголовок `trbt-signature`, HMAC-SHA256 от тела запроса, ключ — API-ключ\n  платформы у Tribute. Точная конструкция (сырые байты тела vs канонизированная строка) не\n  воспроизведена дословно документацией — сверить с `https://tribute.tg/api/v1/openapi/en` при кодинге.\n\n### Идемпотентность и ретраи\n\n- Уникальный индекс на `purchase.provider_event_id`. Обработка вебхука — вставка `purchase`; конфликт\n  уникальности → это тот же ивент, обработанный ранее (провайдер ретраит), отвечаем `200` без побочных\n  эффектов (не пересоздаём `onboarding_token`, не шлём письмо повторно).\n- Polar ретраит до 10 раз с экспоненциальной задержкой, таймаут ответа 10с (рекомендация уложиться в\n  2с), после 10 подряд неуспешных попыток эндпоинт отключается автоматически — обработчик обязан\n  отвечать быстро (создание `purchase`/`onboarding_token` — синхронно и дёшево, отправка письма/Telegram\n  — можно вынести в фон, чтобы не рисковать таймаутом).\n- Tribute ретраит по расписанию 5м/15м/30м/1ч/2ч/4ч/8ч/8ч (\\~24ч, 8 попыток).\n\n### Что создаёт хендлер и в каком порядке\n\n1. Проверить подпись → `401` при несовпадении (без создания записей).\n2. Распарсить событие, отфильтровать не-«оплачено» события: `checkout.updated` без статуса success\n   (Polar), `newSubscription{type:\"trial\"}` (Tribute) → `200` без побочных эффектов (это не покупка).\n3. `find_or_create account`: Polar — по `customer.email`; Tribute — по `telegram_id` из payload\n   (см. Fork №1 — это решение временное, пока Иван не выбрал модель идентичности).\n4. `INSERT purchase` (конфликт по `provider_event_id` → идемпотентный `200`, см. выше).\n5. `INSERT onboarding_token` с новым `token`/`expires_at`.\n6. Отправить ссылку: Polar → email на `account.email`; Tribute → сообщение ботом в `telegram_id`\n   (Tribute не даёт браузерного редиректа — источник 6; ссылка обязана дойти через Telegram, иначе\n   покупатель с Tribute не получит её вообще).\n\n### Отказные пути\n\n- **Неизвестный план** (`plan`/id продукта провайдера не смэплен на тариф платформы): `purchase`\n  всё равно создаётся (деньги реальны), но `plan` пишется как `\"unknown:\u003cprovider_product_id>\"` и\n  событие уходит в ops-алерт (лог + канал уведомлений оператора, вне рамок этой спеки) — `onboarding_token`\n  НЕ создаётся автоматически, регистрация тенанта в этом случае идёт вручную через Fork №4 (ручная\n  покупка/выдача) после того, как оператор разберётся с маппингом.\n- **Refund / cancel** (`digitalProductRefund`, `cancelledSubscription`, Polar `order.refunded` —\n  не подтверждено дословно фетчем, но симметрично `order.paid` по устройству API): `purchase.status =\n  refunded` по `provider_event_id`/`purchase_id` из payload. Что делать с уже созданным тенантом —\n  зависит от Fork №3 (hard/soft delete и retention); эта спека не решает это сама, только фиксирует\n  связь `purchase → tenant` через `account`, по которой оператор находит нужный тенант.\n- **Дубликат email/telegram_id с уже существующим `account`**: не ошибка — ровно случай «1 клиент,\n  много покупок» из брифа; новый `purchase` привязывается к найденному `account`. Ошибкой это становится\n  только если один и тот же человек приходит один раз через Polar (email `a@b.com`) и один раз через\n  Tribute (`telegram_id`) — тогда без Fork №1 система заведёт ДВА разных `account` на одного человека;\n  это следствие, а не что-то, что вебхук может починить сам.\n\n## 4. Ссылка и страница «оплата прошла» — контракт для upready.dev\n\nupready.dev не трогаем этой ночью; ниже — то, что должна уметь его будущая страница тарифов/успеха,\nчтобы онбординг работал.\n\n- **Формат ссылки на мастер**: `https://upready.dev/onboarding/:token` — редиректится (по 200/302,\n  решает сайт) на `https://panel.upready.dev/onboarding/:token` или на прямой путь `tenant-panel`, если\n  панель обслуживается с самого `upready.dev` по другому базовому пути; технической разницы для этой\n  спеки нет, важно, что `:token` — сырое (не хэшированное) значение из `onboarding_token.token`.\n- **Редирект vs ссылка**: у Polar браузер может сразу попасть на `success_url` с\n  `checkout_id={CHECKOUT_ID}` (источник 3) — но в этот момент вебхук ещё мог не долететь (гонка:\n  редирект — синхронный ответ Stripe/Polar пользователю, вебхук — асинхронная серверная нотификация).\n  Значит страница `success_url` НЕ должна сама показывать токен по `checkout_id`: она показывает\n  «оплата принята, письмо со ссылкой уже идёт» и не пытается угадать `onboarding_token` раньше, чем он\n  создан. Единственный канал, гарантированно несущий реальный `token`, — письмо (Polar) или сообщение\n  бота (Tribute), оба отправляются ПОСЛЕ вебхука, п. 5 выше. У Tribute браузерного редиректа нет вовсе\n  (источник 6) — там для покупателя вообще нет страницы «оплата прошла» на upready.dev, только сообщение\n  в Telegram.\n- **TTL токена**: решение (не входит в обязательные развилки, беру рекомендацией) — **7 дней**,\n  одноразовый (`used_at`). Истёкший неиспользованный токен можно перевыпустить вручную из ops (новый\n  `onboarding_token` на ту же `purchase`) без повторной оплаты.\n- **Страница при использованном/истёкшем токене**: мастер (`tenant-panel`) отвечает, не сайт —\n  `GET /onboarding/:token` до первого шага проверяет `used_at`/`expires_at` и вместо формы показывает:\n  «эта ссылка уже использована, войдите в панель» (с ссылкой на `/login`) для `used_at`, и «ссылка\n  истекла, напишите в поддержку» (с mailto/telegram поддержки) для `expires_at` в прошлом.\n\n## 5. Мастер `/onboarding/:token` в `apps/tenant-panel` (PublicLayout)\n\nНовый маршрут верхнего уровня рядом с `routes/login` (тот же паттерн: `PublicLayout`, без\n`ProtectedRoute`/`MainLayout`/сайдбара — см. `apps/tenant-panel/src/app.tsx`,\n`components/layout/public-layout.tsx`). Три шага + финиш:\n\n| Поле | Предзаполнено из | Показ/скрыт | Правится позже в панели |\n|---|---|---|---|\n| Название магазина | `purchase.plan` → дефолтное имя тарифа, либо `account.name` | показан, шаг 1 | нет прямого route в этой волне панели (не строился) |\n| Handle | slug из названия магазина / локальной части email (`account.email` до `@`) | показан, шаг 1 | **нет** — иммутабелен через API и в мастере (контракт §3: «immutable through this API tonight»; правило берём и для мастера, `src/api/tenants/validators.ts` regex `^[a-z0-9]+(?:-[a-z0-9]+)*$`, 3–63 симв.) |\n| Email администратора | `account.email` (Tribute-путь без email — поле пустое, покупатель вводит вручную; см. Fork №1) | показан, шаг 2 | нет (смена — только `POST /admin/tenants/:id/admins/:adminId`, админский, не self-service) |\n| Пароль | новое значение, вводит покупатель | показан, шаг 2 (или отдельный финальный экран) | нет self-service смены пароля в этой волне панели |\n| Валюта | дефолт тарифа (`plan`) | показан, шаг 3 | да, позже в настройках магазина (вне рамок этой ночи — раздел настроек не построен) |\n| Регион | дефолт тарифа | показан, шаг 3 | да, позже |\n| Язык | дефолт тарифа / язык браузера как fallback | показан, шаг 3 | да, позже |\n| Склад | провижнится автоматически (`provisionTenantWarehouseWorkflow` внутри `createTenantWorkflow`) | **скрыт** | да, позже (не в этой волне) |\n| Опции доставки | провижнятся автоматически (два стандартных, из того же workflow) | **скрыт** | да, позже |\n| Publishable API key | создаётся автоматически | **скрыт** | ключ виден тенант-админу через `GET /tenants/me` уже сегодня; в мастере не показываем |\n\nФиниш мастера: `createTenantWorkflow({ name, handle, admin: { email, first_name?, last_name? },\nauthIdentityId })` — тот же вызов, что делает `POST /admin/tenants` (контракт §3). `authIdentityId`\nполучается тем же способом, что и в `POST /tenants` сегодня: `POST /auth/tenant/emailpass/register`\nс введённым email+паролем ДО вызова workflow, затем сам workflow с готовым `authIdentityId`. После\nуспеха: `onboarding_token.used_at = now`, линк `account ↔ tenant`, авто-вход — тот же токен/сессия,\nчто выдаёт `POST /auth/tenant/emailpass` (мастер логинится тем же email+паролем сразу после регистрации,\nбез отдельного экрана логина).\n\n## 6. Что уже есть и что переиспользуется\n\n- `createTenantWorkflow` (`apps/backend/src/workflows/tenant/create-tenant/index.ts`) — канал, ключ,\n  склад, первый админ; мастер вызывает его без изменений.\n- Регистрация пароля админским способом — `authModuleService.register(\"emailpass\", …)`, как в\n  `POST /admin/tenants` (контракт §3) и как сегодняшний `POST /tenants` уже делает через\n  `/auth/tenant/emailpass/register`.\n- `POST /auth/tenant/emailpass` — вход тенант-админа; мастер использует его же для авто-входа на\n  финише, отдельного «онбординг-логина» не изобретаем.\n- `src/api/tenants/validators.ts` (`PostTenantCreateSchema`) — источник правила handle; мастер\n  использует ТУ ЖЕ регулярку на клиенте для мгновенной валидации, сервер всё равно перепроверяет тем же\n  валидатором на вызове workflow.\n- PublicLayout + структура `routes/login` (`apps/tenant-panel/src`) — образец для нового маршрута\n  `/onboarding/:token`, без нового приложения.\n\n## 7. Развилки для Ивана\n\n1. **Идентичность аккаунта: email vs telegram_id vs оба.**\n   Сейчас `account` в этой спеке допускает оба поля nullable и заводит запись по тому, что прислал\n   конкретный провайдер (email для Polar, telegram_id для Tribute) — без явного решения один человек,\n   купивший через оба канала, получит два разных `account`.\n   Варианты: (a) email — обязательное поле идентичности, Tribute-покупатель обязан ввести email в\n   мастере до создания тенанта (Telegram даёт только имя/номер для DM, не для идентичности); (b)\n   telegram_id — обязателен, email опционален; (c) оба поля есть, но связывание по совпадению\n   выполняется вручную оператором при обращении клиента (без автосклейки).\n   Рекомендация: **(a)** — email как обязательный идентификатор, потому что он единственный канал,\n   общий обоим провайдерам (Tribute тоже может слать email внутри Telegram-сообщения, если попросить\n   его у покупателя в первом шаге мастера), а вход в панель уже устроен по email\n   (`POST /auth/tenant/emailpass`) — второй идентификатор входа не потребуется.\n\n2. **Что даёт тариф: 1 магазин / N магазинов / срок действия, продление.**\n   Модель `purchase` не решает, порождает ли она ровно один `tenant` или лимит/бессрочность. Варианты:\n   (a) 1 `purchase` = 1 `tenant`, без ограничения по времени (простейшее, соответствует «1 клиент может\n   иметь много покупок» из брифа буквально — вторая покупка = второй магазин); (b) `purchase.plan`\n   несёт лимит N тенантов и покупатель выбирает, к какому применить онбординг-токен; (c) подписочная\n   модель — `purchase` даёт доступ на срок, магазин архивируется (Fork №3) при не-продлении.\n   Рекомендация: **(a)** на старте — самая простая связь `purchase → onboarding_token → tenant` 1:1:1,\n   не требует UI выбора «к какому магазину применить покупку»; (c) добавляется позже как надстройка над\n   `purchase.status = expired` без изменения модели.\n\n3. **Hard vs soft delete тенанта и срок хранения после удаления.**\n   `deleteTenantWorkflow` этой ночью делает только soft delete (A3/A1 брифа). Варианты: (a) soft\n   навсегда, purge — только вручную по явному запросу владельца данных; (b) soft + автоматический hard\n   purge (файлы + строки) через фиксированный срок (30/60/90 дней); (c) hard delete сразу опционален\n   флагом `purge_files` (уже есть в контракте §3) — но постоянного расписания purge нет.\n   Рекомендация: **(b)**, 30 дней — совпадает с retention пер-тенантного бэкапа из B3\n   (`docs/multitenancy/backup-spec.md`, если уже написан другим воркером: ночной `exportTenantWorkflow`\n   с retention 30 дней даёт ровно то окно, за которое воостановление ещё возможно из бэкапа даже после\n   purge).\n\n4. **Ручная «покупка» из админки (без оплаты — для тестов и рассрочки).**\n   `purchase.provider = \"manual\"` уже заложен в модель (§2), но кто и как её создаёт — не решено.\n   Варианты: (a) новый admin-эндпоинт `POST /admin/purchases` (оператор вводит email/telegram, план,\n   сумму 0 или частичную — «рассрочка» из брифа) с `provider_event_id` = сгенерированный платформой id;\n   (b) переиспользовать `POST /admin/tenants` как есть (уже сегодня заводит тенант без всякой\n   `purchase`) и не заводить `purchase` вовсе для ручных тенантов; (c) гибрид — `POST /admin/tenants`\n   опционально принимает `purchase: { plan, amount }`, создающий связанную ручную `purchase` тем же\n   вызовом.\n   Рекомендация: **(c)** — не плодит два разных пути создания тенанта (админский и «покупка без\n   оплаты» остаются одним и тем же вызовом), при этом ручные покупки видны в той же таблице `purchase`,\n   что и настоящие — статистика и рассрочка (несколько ручных `purchase` с разными `amount` на один\n   `account`) не требуют отдельной модели.\n\n5. **Канал доставки ссылки для Tribute-покупателей — форс со стороны документации, не выбор дизайна.**\n   Источник 6 подтверждает: у Tribute нет браузерного редиректа после оплаты (платёж целиком внутри\n   Telegram) и нет параметра для передачи внутреннего id покупателя при чекауте. Значит ссылка на\n   `/onboarding/:token` физически может дойти до Tribute-покупателя только сообщением от бота в тот же\n   Telegram-чат, где прошла оплата. Варианты: (a) свой Telegram-бот platform шлёт DM с ссылкой сразу\n   после вебхука (нужен бот-токен и `telegram_id` из payload — оба есть, источник 5); (b) сама Tribute\n   присылает покупателю единственное подтверждение оплаты, а ссылку на онбординг платформа добавляет в\n   описание товара как «после оплаты напишите нам email в бот» — то есть просит покупателя ВРУЧНУЮ\n   инициировать диалог; (c) email — тоже собирается на шаге чекаута, если Tribute это позволяет (не\n   подтверждено фетчем, источник 6 явно отмечает «no field for external/platform customer id»).\n   Рекомендация: **(a)** — единственный вариант без ручного шага покупателя; требует завести\n   Telegram-бота платформы (вне рамок этой ночи, отдельная задача), это единственная новая\n   инфраструктура, которую B1 подразумевает, но не называет явно.\n\n## 8. Источники\n\nВсе файлы — `artifacts/research/2026-09-11-onboarding-payments/`, fetch 2026-09-11 (время — UTC):\n\n1. `source-1-polar-webhooks-delivery.md` — https://polar.sh/docs/integrate/webhooks/delivery (редирект\n   с `docs.polar.sh`), 2026-09-11T00:45:00Z\n2. `source-2-polar-webhooks-events.md` — https://polar.sh/docs/integrate/webhooks/events (редирект),\n   2026-09-11T00:45:30Z\n3. `source-3-polar-checkout-links.md` — https://polar.sh/docs/features/checkout/links (редирект),\n   2026-09-11T00:46:00Z\n4. `source-4-polar-sandbox.md` — https://polar.sh/docs/integrate/sandbox (редирект), 2026-09-11T00:46:20Z\n5. `source-5-tribute-webhooks.md` — https://wiki.tribute.tg/for-content-creators/api-documentation/webhooks,\n   2026-09-11T00:49:00Z\n6. `source-6-tribute-api-overview.md` — https://wiki.tribute.tg/for-content-creators/api-documentation\n   и `.../api-documentation/products`, 2026-09-11T00:49:20Z\n\nНе удалось получить дословный JSON-пейлоад события (`order.paid`, Polar) и точную конструкцию подписи\nу обоих провайдеров — инструмент фетча возвращает суммаризацию страницы, не сырой markdown/OpenAPI;\nзафиксировано как TODO прямо в текстах source-2 и source-5, а не додумано.\n"},{"id":"docs-multitenancy-admin-tenants-api-contract-md","group":"specs","path":"docs/multitenancy/admin-tenants-api-contract.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/admin-tenants-api-contract.md","title":"Контракт /tenants","note":"админский API тенантов","bytes":11133,"text":"# Admin tenants API + tenant files — contract for the platform night (11→12.09.2026)\n\nOwner: orchestrator session (feat/mt-platform, session_01MQKTcc6DWhp7ZFrq8zRzFJ). Shared by workers\nW1 (API + delete workflow), W2 (tenant files), W3 (export), W7 (Admin UI). A worker that needs a\nchange here writes the need into its `.ai/progress-\u003cworker>.md`; only the orchestrator edits this file.\nVerified on `@medusajs/*` 2.19.0 in `node_modules` (not from memory), 2026-09-11 08:4x WITA.\n\n## 1. Authentication\n\n- Everything under `/admin/*` is protected by the framework's default admin middleware (actor type\n  `user`; session, bearer or secret api-key). Custom routes in `src/api/admin/**` inherit it; W1 proves\n  it with a `401` test for an unauthenticated call.\n- The Admin UI (W7) runs on the same origin as the API (`:9025/app` → `/admin/tenants`), so it calls\n  `fetch(path, { credentials: \"include\", headers: { \"content-type\": \"application/json\" } })`. No\n  `@medusajs/js-sdk` (not installed in `apps/backend`).\n- Tenant admins keep logging in through `POST /auth/tenant/emailpass` (actor type `tenant`); nothing\n  here changes that.\n\n## 2. Shapes\n\n```ts\ntype TenantSummary = {\n  id: string;                 // ten_…\n  handle: string;             // immutable through this API tonight (it is the technical subdomain)\n  name: string;\n  metadata: Record\u003cstring, unknown> | null;\n  archived_at: string | null; // derived: metadata.archived_at ?? null (soft delete lives in metadata)\n  created_at: string;\n  updated_at: string;\n  sales_channel: { id: string; name: string; is_disabled: boolean } | null; // via link tenant-sales-channel\n  api_key: { id: string; token: string; revoked_at: string | null } | null;  // via link tenant-api-key (publishable, token is public)\n  admins_count: number;\n  products_count: number;     // via link tenant-product\n  orders_count: number;       // via link tenant-order\n};\n\ntype TenantAdmin = {\n  id: string;                 // tenadm_…\n  email: string;\n  first_name: string | null;\n  last_name: string | null;\n  created_at: string;\n  updated_at: string;\n};\n\ntype TenantDetail = TenantSummary & { admins: TenantAdmin[] };\n```\n\n## 3. Endpoints (all JSON; errors are Medusa's `{ type, message }`)\n\n| Method + path | Body / query | Response | Notes |\n|---|---|---|---|\n| `GET /admin/tenants` | `q?`, `limit?` (default 20), `offset?` (0), `archived?` = `exclude` (default) / `include` / `only` | `{ tenants: TenantSummary[], count, offset, limit }` | `q` matches `handle` or `name` (ilike). Order: `created_at desc`. |\n| `POST /admin/tenants` | `{ name, handle, admin: { email, password, first_name?, last_name? } }` | `201 { tenant: TenantDetail }` | Registers an emailpass auth identity for the admin (`authModuleService.register(\"emailpass\", { email, password })`, compensated by deleting the identity), then runs `createTenantWorkflow` with that `authIdentityId`. Duplicate handle or email → `400` (Medusa `INVALID_DATA`/`DUPLICATE_ERROR`). Handle rules = `PostTenantCreateSchema` in `src/api/tenants/validators.ts`. Password ≥ 8 chars. |\n| `GET /admin/tenants/:id` | — | `{ tenant: TenantDetail }` | `404` when unknown. Archived tenants are readable. |\n| `POST /admin/tenants/:id` | `{ name?, metadata? }` | `{ tenant: TenantDetail }` | `metadata` merges (Medusa convention verified by W1 in `merge-metadata.js`: an EMPTY STRING deletes a key, `null` is stored literally). `metadata.archived_at` may NOT be set through this route (`400`); it belongs to the delete workflow. `handle` in the body → `400`. |\n| `DELETE /admin/tenants/:id` | query `purge_files?=true` | `{ id, object: \"tenant\", deleted: true, archived_at }` | Soft delete, see §4. Idempotent: deleting an archived tenant answers `200` again with the original `archived_at`. |\n| `GET /admin/tenants/:id/admins` | — | `{ admins: TenantAdmin[] }` | |\n| `POST /admin/tenants/:id/admins` | `{ email, password, first_name?, last_name? }` | `201 { admin: TenantAdmin }` | Auth identity registered + `tenant_admin` row + `setAuthAppMetadataStep` (actor type `tenant`, value = admin id). Archived tenant → `400`. |\n| `POST /admin/tenants/:id/admins/:adminId` | `{ email?, password?, first_name?, last_name? }` | `{ admin: TenantAdmin }` | Password: `authModuleService.updateProvider(\"emailpass\", { entity_id: \u003ccurrent email>, password })` (the provider's `update` requires `entity_id`, which for emailpass IS the email). Email: `tenant_admin.email` + the provider identity's `entity_id` (`authModuleService.updateProviderIdentities({ id: \u003cprovider_identity.id>, entity_id: \u003cnew email> })`, find it by `listAuthIdentities` filtering `provider_identities.entity_id = old email` and `provider = \"emailpass\"`). When both are sent: password first (against the OLD email), then the email. Compensation restores the previous values. Admin not of this tenant → `404`. |\n| `DELETE /admin/tenants/:id/admins/:adminId` | — | `{ id, object: \"tenant_admin\", deleted: true }` | The last admin of a tenant cannot be removed → `400`. Deletes the `tenant_admin` row and the auth identity (`deleteAuthIdentities`). |\n| `POST /admin/tenants/:id/export` | — | `200`, `content-type: application/gzip`, `content-disposition: attachment; filename=\"tenant-\u003chandle>-\u003cYYYY-MM-DD>.json.gz\"` | Owner W3. Runs `exportTenantWorkflow`, streams the bundle. |\n\nValidators: zod (`@medusajs/framework/zod`) in `src/api/admin/tenants/validators.ts`, wired through\n`validateAndTransformBody` / `validateAndTransformQuery` in `src/api/middlewares.ts` (W1 is the only\nwriter of that file tonight).\n\n## 4. Soft delete — `deleteTenantWorkflow` (`src/workflows/tenant/delete-tenant/index.ts`, owner W1)\n\nInput `{ id: string; purge_files?: boolean }` (default `false`). Steps, in order, each with a compensation\nthat restores the previous state (except the last one):\n\n1. `tenant.metadata.archived_at = \u003cISO now>` (module service `updateTenants`; compensation writes the\n   previous metadata back). No new model, no migration: the migration snapshot is shared with the panel\n   branch `feat/mt-panel-2` tonight.\n2. The tenant's sales channel → `is_disabled: true` (`updateSalesChannelsWorkflow.runAsStep`).\n3. The tenant's publishable key → revoked (`revokeApiKeysWorkflow.runAsStep`; read its input type in\n   `node_modules/@medusajs/core-flows/dist/api-key/workflows/revoke-api-keys.d.ts`). The storefront's\n   calls with that key answer `400` from then on (verified by W1: a revoked key raises NOT_ALLOWED in `ensure-publishable-api-key.js`, mapped to 400; the contract first assumed 401).\n4. Only when `purge_files` is true: `deleteTenantFilesStep({ tenant_id })` from\n   `src/workflows/tenant/delete-tenant/steps/delete-tenant-files.ts` (owner W2, §5). No compensation is\n   possible for deleted objects, which is why it is the last step and off by default.\n\nLogin is closed by MIDDLEWARE, not by touching auth identities (so a decision «restore» stays cheap):\n\n- `/tenants/*` (after `authenticate`): when `req.auth_context.actor_id` is set, resolve the admin's tenant;\n  `metadata.archived_at` present → `401 { message: \"Tenant is archived\" }`. `POST /tenants`\n  (registration with an actorless token) is untouched.\n- `POST /auth/tenant/emailpass` (login): look the body's `email` up in `tenant_admin`; its tenant archived →\n  `401` with the same message, before Medusa's handler runs.\n\nExpected after `DELETE`: tenant admin login `401`; `GET /tenants/me` with an old token `401`;\n`GET /store/products` with the tenant's publishable key `400` (revoked key = NOT_ALLOWED); `GET /admin/tenants` hides the tenant\nunless `archived=include|only`.\n\n## 5. Tenant files (owner W2) — key prefix `tenants/\u003ctenant_id>/`\n\nVerified in `@medusajs/file-s3` 2.19.0 `dist/services/s3-file.js`: `upload()` builds\n`fileKey = ${prefix}${parsedFilename.dir ? dir + \"/\" : \"\"}${name}-${ulid()}${ext}` after\n`sanitizeFilePath` (which only strips leading slashes, `.` and `..` segments and keeps directory\nsegments). `@medusajs/file-local` does the same with `path.join(parsedFilename.dir, name-ulid.ext)` under\n`static/`. So a tenant-scoped key is produced by sending `filename: \"tenants/\u003ctenant_id>/\u003coriginal name>\"`\nto `uploadFilesWorkflow`; no custom provider is needed.\n\nShared helper, plain code outside the seven Medusa loader directories (AGENTS.md):\n\n```ts\n// apps/backend/src/tenant-files/index.ts  (owner W2; W1 and W3 import from it)\nimport type { MedusaContainer } from \"@medusajs/framework/types\";\n\nexport const TENANT_FILES_ROOT = \"tenants\";\n/** Always ends with \"/\" — `tenants/\u003ctenant_id>/`. */\nexport const tenantFilePrefix: (tenantId: string) => string;\nexport type TenantFile = { key: string; url: string; size: number | null };\n/** Every object under the tenant's prefix (local provider: `static/tenants/\u003cid>/**`; S3: ListObjectsV2 by prefix). */\nexport const listTenantFiles: (container: MedusaContainer, tenantId: string) => Promise\u003cTenantFile[]>;\n/** Deletes exactly the objects under the prefix. Returns how many. Nothing under the prefix = 0, not an error. */\nexport const deleteTenantFiles: (container: MedusaContainer, tenantId: string) => Promise\u003c{ deleted: number }>;\n```\n\nProvider detection mirrors `medusa-config.ts`: S3 is active only when `NODE_ENV=production` and\n`S3_BUCKET` is set (then also `S3_ENDPOINT`, `S3_ACCESS_KEY`, `S3_SECRET_KEY`, `S3_REGION`); otherwise\nthe local provider with its default `static/` directory under `process.cwd()`. Public URLs keep the\ntenant id in the path — accepted (public assets).\n\n`POST /tenants/uploads` (own handler replacing the re-export): tenant id from the authenticated admin\n(`getTenantScope(req)` in `src/api/tenants/tenant-scope.ts`), then `uploadFilesWorkflow` with\n`filename: tenantFilePrefix(tenant.id) + file.originalname`, `access: \"public\"`. Response stays\n`{ files: [{ id, url }] }` (what the panel reads).\n\n## 6. Export bundle (owner W3)\n\n`exportTenantWorkflow` → `{ bundle: TenantBundle, manifest: { counts: Record\u003cstring, number>, bytes: number } }`,\nserialised as gzip JSON `tenant-\u003chandle>-\u003cYYYY-MM-DD>.json.gz`. Format documented in\n`docs/multitenancy/tenant-bundle-format.md` with a JSON Schema next to the workflow\n(`src/workflows/tenant/export-tenant/bundle.schema.json`). CLI: `apps/backend/scripts/tenant-export.mjs\n\u003chandle> [--out \u003cdir>]` → spawns `npx medusa exec ./src/scripts/tenant-export.ts \u003chandle> \u003cout>` (container\naccess without HTTP credentials), prints the counts table and the size in bytes.\n\n## 7. Stand used for acceptance\n\n- Orchestrator's backend: `http://localhost:9025` (`medusa develop` from this worktree, `.env` with\n  `PORT=9025`, DB `postgres://ivanprotsko@127.0.0.1:5433/upready_store_mt`, local file provider).\n  Admin `:9025/app`, login `admin@upready.dev` / `supersecret`. `:9023` / `:5180` / `:9024` belong to\n  other sessions — never stop them.\n- Integration tests (`pnpm test:integration:http`) boot their OWN throwaway database through\n  `@medusajs/test-utils`; pass `DB_HOST=localhost DB_PORT=5433 DB_USERNAME=ivanprotsko` and a free `PORT`\n  (W1 `9031`, W2 `9032`, W3 `9033`). The stand DB is never written by tests.\n"},{"id":"docs-multitenancy-tenant-bundle-format-md","group":"specs","path":"docs/multitenancy/tenant-bundle-format.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/tenant-bundle-format.md","title":"Формат бандла","note":"что увозит магазин при отсоединении","bytes":6774,"text":"# Tenant export bundle — `upready.tenant-bundle/v1`\n\nOwner: W3 (platform night, 11→12.09.2026). Produced by `exportTenantWorkflow`\n(`apps/backend/src/workflows/tenant/export-tenant/index.ts`), validated against\n`bundle.schema.json` next to it (JSON Schema draft 2020-12, checked with `ajv`\nin the seam test `integration-tests/http/tenant-export.spec.ts`). Consumed by:\n\n- `POST /admin/tenants/:id/export` (`src/api/admin/tenants/[id]/export/route.ts`)\n  — streams the bundle as gzip JSON, headers per\n  `docs/multitenancy/admin-tenants-api-contract.md` §3/§6.\n- `node scripts/tenant-export.mjs \u003chandle> [--out \u003cdir>]` — container access,\n  no HTTP credentials, spawns `npx medusa exec ./src/scripts/tenant-export.ts\n  \u003chandle> \u003coutDir>`.\n\nIt is the one artifact behind two later specs (detaching a tenant into a\nstandalone Medusa, and per-tenant backup), so every field here is either\ncopied straight from a `query.graph` result or explicitly `null`/`[]` when the\ntenant has none — nothing in the bundle is invented.\n\n## Top level\n\n| Field | What it is |\n|---|---|\n| `format` | Always the literal `\"upready.tenant-bundle/v1\"`. |\n| `exported_at` | ISO timestamp of the run, not of the data. |\n| `source.backend_version` | `@medusajs/medusa` version of the backend that produced the bundle. |\n| `source.tenant_id` | The tenant this bundle is for. |\n| `tenant` | `{ id, handle, name, metadata }` — the tenant row itself. |\n| `admins` | Tenant admins: `{ id, email, first_name, last_name }`. **Never a password hash** — the auth identity's provider data is not exported. |\n| `sales_channel` | `{ id, name, is_disabled }` or `null` if the tenant's channel was deleted (the tenant row survives that, see contract §4). |\n| `api_key` | `{ id, title, type, token }` or `null`. The token is a **publishable** key — public by design, not a secret (contract §6). |\n| `warehouse.stock_locations` | The tenant's stock location(s) with address, fulfillment sets, service zones and shipping options (+ their prices and shipping profile id). One location per tenant on this branch (`provisionTenantWarehouseWorkflow`), but the shape is an array. |\n| `products` | Full product graph: variants, options, prices, images, tags, type, collection, categories, and each variant's linked inventory items. |\n| `inventory` | Inventory items (`id`, `sku`, `title`, `stocked_quantity`, `reserved_quantity`, `location_levels`) referenced by the tenant's variants, deduplicated by id. This is the same data embedded under `products[].variants[].inventory_items[].inventory`, pulled to the top level for a flat read. |\n| `categories` | Product categories referenced by the tenant's products, deduplicated. **No owner link table exists on this branch** (`tenant_product_category` — the panel branch `feat/mt-panel-2` adds it); until then \"referenced by the tenant's own products\" is the tenant's category set, which is the same answer for a tenant whose categories are not shared with another tenant. |\n| `collections` | Product collections referenced by the tenant's products, deduplicated. |\n| `customers` | Customers of the tenant's orders, with addresses (`*addresses`), deduplicated by `order.customer_id`. A tenant with no orders has `[]`, not every registered auth identity. |\n| `orders` | Full order graph, as history: items (+ tax lines, adjustments, variant), shipping address, billing address, shipping methods, payment collections (+ payments, refunds, captures), fulfillments. |\n| `regions` | Regions referenced by the tenant's orders (`order.region_id`), as reference data — not scoped to the tenant, since a region is shared store-wide infrastructure the order merely points at. |\n| `files` | `listTenantFiles(container, tenant_id)` from the shared helper `src/tenant-files/index.ts` (owner W2) — every object under `tenants/\u003ctenant_id>/`. |\n| `pages` | **Always `null` on this branch.** Content pages / home config live on the panel branch (`feat/mt-panel-2`), not `feat/mt-platform`. A future export version that merges both branches replaces this with the real array; the schema's `manifest.counts` has no `pages` key for the same reason. |\n| `manifest.counts` | One integer per top-level array/warehouse field: `admins`, `products`, `inventory`, `categories`, `collections`, `customers`, `orders`, `regions`, `files`, `stock_locations`. |\n| `manifest.bytes` | `Buffer.byteLength` of the bundle's JSON serialisation, uncompressed. |\n\n## What \"reference data\" means here\n\nTwo sections are not filtered to rows the tenant *owns* the way products and\norders are, because nothing in the schema records tenant ownership of them:\n\n- **`regions`** — a region is store-wide infrastructure (shared currency,\n  countries, tax settings). The bundle exports the regions the tenant's own\n  orders actually reference, not every region on the backend, but a region\n  itself is not \"the tenant's\" the way a product is.\n- **`categories`/`collections`** — same reasoning, narrowed to what the\n  tenant's own products reference (see the table row above for the missing\n  link table).\n\nA restore or a detach reading this bundle treats these two sections as\nreference data to look up or recreate on the target backend, not as rows to\nre-parent to the tenant.\n\n## Empty is `[]`, not missing\n\nEvery array field is present even when the tenant has zero rows of that kind:\na tenant with no orders yet gets `\"orders\": []`, `\"customers\": []`, not an\nomitted key. `manifest.counts` follows the same rule — a `0` there is a real\ncount, not the absence of the section. This is what the schema's\n`required` list on the top-level object enforces.\n\n## Measured on the stand\n\n`node scripts/tenant-export.mjs acme` against\n`postgres://ivanprotsko@127.0.0.1:5433/upready_store_mt` (this worktree's\nstand DB, tenants `acme`, `globex`, `initech`), read-only:\n\n```\ncounts:\n  admins                1\n  products              9\n  inventory             0\n  categories            0\n  collections            0\n  customers              4\n  orders                  6\n  regions                 1\n  files                   0\n  stock_locations         1\nbytes (uncompressed): 48886\nbytes (gzip):         11433\nelapsed:              0.34s\n```\n\n`inventory: 0` reflects the stand's own data, not a query bug: the tenant's\nproducts were created through `POST /tenants/products` with\n`manage_inventory: false` (the same default the seam test's `productBody`\nuses), so no variant on this tenant has a linked inventory item to export.\n`categories: 0` / `collections: 0` likewise — the acme catalog on this stand\nwas not assigned either. `files: 0` — no admin has uploaded a file under\n`tenants/\u003cacme id>/` yet. All five are correctly empty, not silently dropped:\neach is still a real key in `manifest.counts`.\n"},{"id":"docs-multitenancy-backup-spec-md","group":"specs","path":"docs/multitenancy/backup-spec.md","file":"file:///Users/ivanprotsko/upready/worktrees/upready-store/feat/mt-deploy/docs/multitenancy/backup-spec.md","title":"Бэкапы","note":"три уровня, восстановление","bytes":19733,"text":"# Бэкап данных тенанта (7.3)\n\nАвтор: W5 (ночь платформы, 11→12.09.2026). Спека, код не пишется. Опирается на `exportTenantWorkflow`\n(owner W3), `docs/multitenancy/tenant-bundle-format.md`, дома́шние правила бэкапов (`~/r/42a.md`,\n`~/r/42d.md`, `~/upready/memory/feedback_backup_strategy.md`) и на реальный замер бандла стенда\n(`artifacts/deliverables/tenant-exports/tenant-acme-2026-09-11.json.gz`, разобран построчно ниже).\n\n## 1. Ярусы\n\nДействующий бэкап платформы (правило 42a, полный текст `~/r/42a.md`) — три яруса, без исключений:\n\n1. `\u003cproject>/backups/` — 7 дней.\n2. `~/upready/backups/\u003cproject>/` — 30 дней.\n3. R2/`restic` (encrypted) — 90 дней + monthly-снапшот, провайдер по умолчанию Cloudflare R2 (42d),\n   политика `restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 12 --keep-yearly 5`.\n\nЭтот контур бэкапит **всё** (вся БД + весь bucket файлов, `memory/feedback_backup_strategy.md`:\n«Postgres dump — вся пользовательская/контентная БД», «Docker volumes (raw) — uploads/кэши») и\nвосстанавливает платформу целиком на любой момент снапшота.\n\n**Per-tenant бэкап — четвёртый, ЛОГИЧЕСКИЙ ярус поверх, не замена.** Он даёт то, чего три яруса выше\nне дают:\n- восстановление ОДНОГО тенанта без разворачивания всего платформенного снапшота;\n- откат одного тенанта на дату N дней назад, пока остальные не трогаются;\n- переносимый артефакт для detach (`detach-spec.md`) и для клиента как «выгрузка моих данных».\n\n**Важная граница, которую нельзя стереть:** бандл `exportTenantWorkflow` несёт байты файлов\n**НЕ во всех случаях** — поле `files` в бандле (см. `tenant-bundle-format.md`) — это список\n`{ key, url, size }` из `listTenantFiles()`, метаданные объектов, а не их содержимое. Байты картинок\nи файлов тенанта восстанавливает ТОЛЬКО платформенный ярус 3 (весь bucket, restic → R2), не\nper-tenant JSON-бандл. Раздел 4 ниже разводит это по сценариям.\n\n## 2. Схема\n\n**Job:** `src/jobs/tenant-backup-nightly.ts` (Medusa scheduled job, `apps/backend/src/jobs/README.md` —\nстандартный `export const config = { name: \"tenant-backup-nightly\", schedule: \"0 19 * * *\" }`).\n\nCron-поле у Medusa (проверено по `src/jobs/README.md` — конфиг несёт только `name`, `schedule`,\n`numberOfExecutions`) **не знает часовых поясов** — время исполнения = время процесса. `0 19 * * *`\nздесь означает 03:00 UTC+8 **при условии, что процесс backend'а работает в TZ=UTC** — это решение\nо часовом поясе сервера относится к 7.4 (`hosting-spec.md`); до его принятия число в cron-строке —\nпредположение, а не факт.\n\n**Что делает job**, для каждого тенанта где `metadata.archived_at == null` (не архивные — архивные\nуже застыли, бэкапить нечего нового):\n\n1. `exportTenantWorkflow.run({ input: { handle: tenant.handle } })` — тот же workflow, что использует\n   ручной экспорт (A3), без изменений.\n2. Сериализация → gzip → запись `backups/tenants/\u003ctenant_id>/\u003cYYYY-MM-DD>.json.gz` в\n   `R2_BACKUP_BUCKET` (проверено — переменная уже существует в `~/upready/.env.keys`, это бакет\n   платформенного яруса 3, не бакет файлов тенантов).\n3. Manifest-файл того же прогона рядом: `backups/tenants/\u003ctenant_id>/\u003cYYYY-MM-DD>.manifest.json`\n   (копия `manifest.counts`/`manifest.bytes` бандла + `status: \"ok\"`), чтобы восстановление и\n   проверка (раздел 5) не разжимали gzip только ради счётчиков.\n4. Ретенш‑проход (тот же или отдельный job `tenant-backup-retention`, следующим шагом за первым):\n   листинг `backups/tenants/\u003ctenant_id>/` по датам, оставить последние 30 ежедневных +\n   по одному первому числу месяца за 12 месяцев, остальное удалить.\n\n**Решение о размещении в R2 — `backups/tenants/\u003cid>/…`, отдельный корень, НЕ под `tenants/\u003cid>/`\nфайлового бакета.** Причина: файловый префикс `tenants/\u003cid>/` — это ровно то, что стирает\n`deleteTenantFilesStep` при `purge_files=true` (контракт §4/§5). Если бы бэкапы лежали под тем же\nпрефиксом (даже в другом бакете), это было бы концептуальной путаницей «бэкап живёт там же, где\nданные, которые он должен пережить»; кладя их в отдельный, уже существующий R2-бакет платформенного\nяруса 3 с отдельным корнем `backups/`, бэкап тенанта переживает purge файлов тенанта по конструкции,\nа не по счастливой случайности бакета.\n\n**Отказ (`status: \"failed\"` в manifest'е job'а):** в кодовой базе backend'а сейчас **нет** готового\nканала алертов (проверено: `grep -rl discord` по `apps/backend/src` — пусто; `DISCORD_TOKEN` в\n`~/upready/.env.keys` принадлежит другому инструменту, в backend не подключён). Решение на сегодня:\n`logger.error(...)` (framework-логгер, попадает в лог процесса/контейнера) + запись\n`backups/_failures/\u003cYYYY-MM-DD>/\u003ctenant_id>.json` с текстом ошибки, которую сможет читать монитор\n7.4, когда появится хостинг с системой алертов. Живой пуш-канал (Discord/email) — не сегодняшняя\nзадача, это не развилка (альтернативы для «сегодня» нет — канала физически не существует), а прямое\nследствие того, что 7.4 ещё не решён.\n\n## 3. Размер и время\n\nЗамер на стенде — реальный, не оценка: `tenant-acme-2026-09-11.json.gz`\n(`.ai/progress-w3.md`, `docs/multitenancy/tenant-bundle-format.md`), счётчики\n`admins=1 products=9 inventory=0 categories=0 collections=0 customers=4 orders=6 regions=1 files=0\nstock_locations=1`, `bytes (uncompressed) = 48886`, `bytes (gzip) = 11433`, `elapsed = 0.34s`.\n\nРазбор бандла по секциям (разжатый `tenant-acme-2026-09-11.json.gz`, посчитано\n`Buffer.byteLength(JSON.stringify(bundle[key]))` для каждого ключа):\n\n| Секция | Байт | На единицу |\n|---|---|---|\n| `warehouse` (1 stock_location) | 33 252 | фиксировано на тенанта (1 склад на этой ветке — `provisionTenantWarehouseWorkflow`) |\n|
